/** Convierte casi cualquier fecha (yyyy-mm-dd, dd/mm/yyyy, serial de Excel, Date) a 'yyyy-mm-dd' */
function toYMD(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date) return isNaN(v) ? '' : ymd(v);
  if (typeof v === 'number' || /^\d{5}(\.\d+)?$/.test(String(v))) {
    const n = Number(v); if (n > 20000 && n < 80000) { const d = new Date(Math.round((n - 25569) * 86400000)); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; }
  }
  const s = String(v).trim();

  const d = new Date(s); return isNaN(d) ? '' : ymd(d);
}
const dobj = s => { const t = toYMD(s); return t ? new Date(t + 'T12:00:00') : null; };

/** 263.77 → "DOSCIENTOS SESENTA Y TRES 77/100 DÓLARES" */
function numLetras(n, moneda = 'DÓLARES') {
  n = r2(Math.abs(num(n)));
  const ent = Math.floor(n), cen = Math.round((n - ent) * 100);
  const U = ['', 'UN', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE', 'DIEZ', 'ONCE', 'DOCE', 'TRECE', 'CATORCE', 'QUINCE', 'DIECISÉIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE', 'VEINTE', 'VEINTIÚN', 'VEINTIDÓS', 'VEINTITRÉS', 'VEINTICUATRO', 'VEINTICINCO', 'VEINTISÉIS', 'VEINTISIETE', 'VEINTIOCHO', 'VEINTINUEVE'];
  const D = ['', '', '', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
  const C = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];
  const dec = x => x < 30 ? U[x] : D[Math.floor(x / 10)] + (x % 10 ? ' Y ' + U[x % 10] : '');
  const cent = x => x === 100 ? 'CIEN' : (C[Math.floor(x / 100)] + (x % 100 ? ' ' + dec(x % 100) : '')).trim();
  const mil = x => { const m = Math.floor(x / 1000), r = x % 1000; let s = ''; if (m) s = m === 1 ? 'MIL' : cent(m) + ' MIL'; if (r) s += (s ? ' ' : '') + cent(r); return s; };
  const mill = x => { const m = Math.floor(x / 1e6), r = x % 1e6; let s = ''; if (m) s = m === 1 ? 'UN MILLÓN' : mil(m) + ' MILLONES'; if (r) s += (s ? ' ' : '') + mil(r); return s || 'CERO'; };
  return `${mill(ent)} ${pad2(cen)}/100 ${moneda}`.trim();
}

const IDB = {
  db: null,
  open() {
    return new Promise((res) => {
      if (!window.indexedDB) return res(false);
      let rq;
      try { rq = indexedDB.open('suministros_v1', 1); } catch (e) { return res(false); }
      rq.onupgradeneeded = () => {
        const d = rq.result;
        d.createObjectStore('rows', { keyPath: 'k' }).createIndex('b', 'b');
        d.createObjectStore('queue', { keyPath: 'k' });
        d.createObjectStore('kv');
      };
      rq.onsuccess = () => { this.db = rq.result; res(true); };
      rq.onerror = () => res(false);
    });
  },
  _p(rq) { return new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); },
  async bucket(b) { if (!this.db) return []; return this._p(this.db.transaction('rows').objectStore('rows').index('b').getAll(b)); },
  put(store, arr) {
    if (!this.db || !arr.length) return Promise.resolve();
    return new Promise((res, rej) => { const tx = this.db.transaction(store, 'readwrite'); const os = tx.objectStore(store); arr.forEach(o => os.put(o)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },
  del(store, keys) {
    if (!this.db || !keys.length) return Promise.resolve();
    return new Promise((res, rej) => { const tx = this.db.transaction(store, 'readwrite'); const os = tx.objectStore(store); keys.forEach(k => os.delete(k)); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },
  async all(store) { if (!this.db) return []; return this._p(this.db.transaction(store).objectStore(store).getAll()); },
  async get(k) { if (!this.db) return MemKV[k]; return this._p(this.db.transaction('kv').objectStore('kv').get(k)); },
  async set(k, v) { if (!this.db) { MemKV[k] = v; return; } return new Promise(res => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; }); },
  async clearAll() { if (!this.db) return; for (const s of ['rows', 'queue', 'kv']) await this._p(this.db.transaction(s, 'readwrite').objectStore(s).clear()); }
};

function deepMerge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over : base;
  if (typeof base !== 'object' || base === null) return over === undefined ? base : over;
  const o = Object.assign({}, base);
  if (over && typeof over === 'object') for (const k in over) o[k] = (k in base) ? deepMerge(base[k], over[k]) : over[k];
  return o;
}

const mesesCobro = () => { const a = CFG.alimentos || {}; if (Array.isArray(a.mesesCobro) && a.mesesCobro.length) return a.mesesCobro.map(Number).filter(m => m >= 1 && m <= 12).sort((x, y) => x - y); const ini = num(a.mesInicio) || 2, n = num(a.meses) || 10; return Array.from({ length: n }, (_, i) => ini + i).filter(m => m <= 12); };
/** Meses que debe tener pagados a una fecha: 'anual' = todos los del año; 'fecha' = los que ya pasaron */
function mesesRequeridos(fecha) {
  const ms = mesesCobro(); if ((CFG.alimentos.modo || 'anual') === 'anual') return ms.length;
  const d = dobj(fecha || today()); if (!d) return ms.length;
  if (d.getFullYear() < Store.year) return 0; if (d.getFullYear() > Store.year) return ms.length;
  return ms.filter(m => m <= d.getMonth() + 1).length;
}
/** Meses de alimentos de un recibo (si no se anotaron, se calculan con el monto ÷ cuota) */

/** Qué meses cubre lo pagado (en orden) y cuáles faltan */
function detalleMeses(pagados) { const ms = mesesCobro(); const n = Math.min(Math.floor(pagados + 0.001), ms.length); return { cub: ms.slice(0, n), pen: ms.slice(n), extra: Math.max(0, r2(pagados - ms.length)) }; }
const listaMeses = ms => { if (!ms.length) return '—'; const consec = ms.every((m, i) => !i || m === ms[i - 1] + 1); return consec && ms.length > 2 ? `${MESES[ms[0] - 1]} a ${MESES[ms[ms.length - 1] - 1]}` : ms.map(m => MESES[m - 1]).join(', '); };

  async loadAll() {

function limpiarUrl(u) {
  u = String(u || '').trim().replace(/\s+/g, '');
  const m = u.match(/^(https:\/\/script\.google\.com\/(?:a\/[^/]+\/)?macros\/s\/[^/?#]+\/(?:exec|dev))/);
  return m ? m[1] : u.split(/[?#]/)[0];

  return new Promise((res, rej) => {
    const cb = '__jp' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const sc = document.createElement('script'); let t;
    const fin = () => { clearTimeout(t); delete window[cb]; sc.remove(); };
    window[cb] = r => { fin(); res(r); };
    sc.onerror = () => { fin(); rej({ error: 'NET', msg: 'No se pudo conectar con Google (conexión alternativa bloqueada)' }); };
    t = setTimeout(() => { fin(); rej({ error: 'NET', msg: 'Google tardó demasiado en responder' }); }, ms);
    sc.src = url + '?' + Object.entries(Object.assign({}, params, { cb })).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');

  partes.push(cur);

  let r;
  for (let i = 0; i < partes.length; i++) {
    r = await jsonpGet(url, partes.length === 1 ? { d: partes[0] } : { id, i, n: partes.length, d: partes[i] });
    if (!r || (!r.ok && i < partes.length - 1)) return Promise.reject(r || { error: 'Sin respuesta' });

/* ======================= Autocompletar ======================= */
function attachAC(input, source, onPick) {
  let box = null, items = [], idx = -1;
  const close = () => { if (box) box.remove(); box = null; idx = -1; };
  const show = () => {
    const q = input.value; items = source(q).slice(0, 40);
    close(); if (!items.length || !q) return;
    box = document.createElement('div'); box.className = 'ac-list';
    const rc = input.getBoundingClientRect();
    box.style.width = Math.max(rc.width, 280) + 'px';
    box.style.position = 'fixed'; box.style.left = rc.left + 'px'; box.style.top = rc.bottom + 2 + 'px';
    box.innerHTML = items.map((it, i) => `<div data-i="${i}">${esc(it.label)}${it.sub ? `<br><small>${esc(it.sub)}</small>` : ''}</div>`).join('');
    box.onmousedown = e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); pick(Number(d.dataset.i)); } };
    document.body.appendChild(box);
  };
  const pick = i => { const it = items[i]; if (!it) return; input.value = it.value ?? it.label; close(); onPick && onPick(it); input.dispatchEvent(new Event('change')); };
  const deb = debounce(show, 120);
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('input', deb);
  input.addEventListener('blur', () => setTimeout(close, 150));
  input.addEventListener('keydown', e => {
    if (!box) return;
    const ds = $$('[data-i]', box);
    if (e.key === 'ArrowDown') { idx = Math.min(idx + 1, ds.length - 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { idx = Math.max(idx - 1, 0); e.preventDefault(); }
    else if (e.key === 'Enter') { if (idx >= 0) { e.preventDefault(); pick(idx); } return; }
    else return;
    ds.forEach((d, i) => d.classList.toggle('on', i === idx)); if (ds[idx]) ds[idx].scrollIntoView({ block: 'nearest' });
  });
}

/* ======================= Ordenar tablas (impresión y pantallas) =======================

function claveCelda(t) {

  let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return { n: Number(m[3] + m[2].padStart(2, '0') + m[1].padStart(2, '0')) };

function ordenarTablas(root, h, dir) {
  if (!h) return; dir = dir < 0 ? -1 : 1;
  $$('table.pt, table.t', root).forEach(tb => {
    const trs = $$('thead tr', tb); if (trs.length !== 1) return;
    const ths = $$('th', trs[0]); const ci = ths.findIndex(th => th.textContent.trim() === h); if (ci < 0) return;
    const ni = /^(n[°º]|#)$/i.test((ths[0] || {}).textContent ? ths[0].textContent.trim() : '') ? 0 : -1;
    $$('tbody', tb).forEach(tbd => {
      const rows = Array.from(tbd.children); let seg = [];
      const flush = (before) => { if (seg.length > 1) { const s2 = seg.slice().sort((a, b) => dir * cmpClave(claveCelda(a.children[ci].textContent), claveCelda(b.children[ci].textContent)) || (Number(a.dataset.o) - Number(b.dataset.o))); s2.forEach(r => tbd.insertBefore(r, before)); } seg = []; };
      rows.forEach((r, i) => { if (r.dataset.o === undefined) r.dataset.o = i; const ok = r.children.length === ths.length && !r.classList.contains('tot') && ![...r.children].some(td => td.colSpan > 1); if (ok) seg.push(r); else flush(r); });
      flush(null);
      if (ni === 0) { let k = 0; Array.from(tbd.children).forEach(r => { if (r.children.length === ths.length && !r.classList.contains('tot') && ![...r.children].some(td => td.colSpan > 1) && /^\d+$/.test(r.children[0].textContent.trim())) r.children[0].textContent = ++k; }); }

/** Restaura el orden original (como lo generó el reporte) */
function ordenOriginal(root) { $$('table.pt tbody, table.t tbody', root).forEach(tbd => { const rows = Array.from(tbd.children); if (!rows.some(r => r.dataset.o !== undefined)) return; rows.slice().sort((a, b) => Number(a.dataset.o ?? 1e9) - Number(b.dataset.o ?? 1e9)).forEach(r => tbd.appendChild(r)); }); }

  if (st.h && !hs.includes(st.h)) st.h = '';
  const pinta = () => { btn.textContent = st.dir > 0 ? '↑ Menor a mayor' : '↓ Mayor a menor'; btn.style.display = st.h ? '' : 'none'; };
  const aplica = () => { ordenOriginal(root); ordenarTablas(root, st.h, st.dir); pinta(); LS.set('ord_' + key, st); };
  sel.onchange = () => { st.h = sel.value; aplica(); }; btn.onclick = () => { st.dir = -st.dir; aplica(); };

/* Cualquier tabla en pantalla: clic en el encabezado ordena (otro clic invierte). Las listas con orden propio no se tocan. */
document.addEventListener('click', e => {

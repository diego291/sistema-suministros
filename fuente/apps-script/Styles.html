<style>
:root{
  --pri:#1f3864; --acc:#2e75b6; --acc2:#e8f1fb;
  --bg:#f3f5f9; --card:#ffffff; --tx:#1d2433; --tx2:#5b6475; --ln:#e1e5ec;
  --ok:#2e7d32; --okb:#e7f4e8; --warn:#b26a00; --warnb:#fff4dc; --bad:#c62828; --badb:#fdecec;
  --side:#14233f; --sidetx:#c9d3e6; --sideact:#ffffff;
  --r:10px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font: "Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#18202f; --tx:#e6eaf2; --tx2:#9aa5b8; --ln:#2a3447; --acc2:#1c2b44;
  --okb:#15301a; --warnb:#3a2c10; --badb:#3a1616; --side:#0a0f19;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{display:flex;height:100vh;overflow:hidden}
#side{width:250px;flex:0 0 250px;background:var(--side);color:var(--sidetx);display:flex;flex-direction:column;transition:margin .2s}
#side.closed{margin-left:-250px}
.brand{padding:16px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.3px}
.brand small{opacity:.7;font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu{flex:1;overflow:auto;padding:8px 8px 20px}
.mg{margin:2px 0}
.mg>button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--sidetx);padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:600;font-size:13.5px}
.mg>button:hover{background:rgba(255,255,255,.06);color:#fff}
.mg>button .ar{margin-left:auto;transition:transform .2s;opacity:.6;font-size:11px}
.mg.open>button .ar{transform:rotate(90deg)}
.mg .sub{display:none;padding:2px 0 6px 28px}
.mg.open .sub{display:block}
.sub a{display:block;padding:6px 10px;border-radius:6px;color:var(--sidetx);text-decoration:none;font-size:13px;cursor:pointer}
.sub a:hover{background:rgba(255,255,255,.06);color:#fff}
.sub a.act,.mg>button.act{background:var(--acc);color:#fff}
.ico{width:18px;text-align:center}
.side-foot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--ln)}
#top h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sp{flex:1}
.iconbtn{background:none;border:1px solid transparent;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:16px;line-height:1}
.iconbtn:hover{background:var(--acc2)}
#sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);cursor:pointer;padding:5px 9px;border-radius:20px;border:1px solid var(--ln);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa5b8;display:inline-block}
.dot.on{background:#2e7d32}.dot.off{background:#c62828}.dot.busy{background:#e0a100;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
#topclock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--tx2);white-space:nowrap}
#view{flex:1;overflow:auto;padding:18px 20px 40px}

/* ---------- componentes ---------- */
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.card h3 small{font-weight:400;color:var(--tx2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);cursor:default}
.kpi[data-go]{cursor:pointer}
.kpi[data-go]:hover{border-color:var(--acc)}
.kpi .l{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--tx2)}
.kpi.ok .v{color:var(--ok)}.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dark{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
input.in,select.in,textarea.in{border:1px solid var(--ln);background:var(--card);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
.bar input.in,.bar select.in{width:auto}
.search{min-width:220px!important}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--tx2);font-weight:600}
label.f.req>span::after{content:" *";color:var(--bad)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13.5px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.form .wide{grid-column:1/-1}
.sec-t{grid-column:1/-1;font-weight:700;color:var(--acc);border-bottom:1px solid var(--ln);padding-bottom:4px;margin-top:6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--acc2);color:var(--acc);white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.bad{background:var(--badb);color:var(--bad)}.tag.warn{background:var(--warnb);color:var(--warn)}
.muted{color:var(--tx2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.c{text-align:center}
.r{text-align:right}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}

/* ---------- tablas ---------- */
.tw{overflow:auto;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);max-height:calc(100vh - 230px)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--pri);color:#fff;text-align:left;padding:8px 10px;font-weight:600;white-space:nowrap;z-index:1;cursor:pointer;user-select:none}
table.t td{padding:7px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
table.t tr:nth-child(even) td{background:rgba(127,127,127,.035)}
table.t tbody tr:hover td{background:var(--acc2)}
table.t tr.sel td{background:var(--acc2)}
.est-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx2);background:var(--acc2);border-radius:20px;padding:3px 6px 3px 12px;margin-top:-4px}
.est-chip .btn{padding:2px 8px}
.est-edit{border:1px solid var(--acc);border-radius:var(--r);padding:10px 12px;background:var(--acc2)}
.modo-ficha>.bar>:not(.lmode),.modo-ficha #lsum,.modo-ficha #lsel,.modo-ficha #ltw,.modo-ficha #lpg,.modo-ficha>.alert{display:none!important}
#view:not(.modo-ficha) #lficha{display:none}
.busA-fijo{position:sticky;top:-18px;z-index:6;background:var(--bg);padding:18px 0 6px;margin-top:-18px;margin-bottom:8px}
#hBusR:not(:empty){margin-bottom:16px}
.busA-in{position:relative}.busA-x{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:var(--acc2);color:var(--tx);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px}
.busA-res:not(:empty){animation:busIn .18s ease-out;margin-bottom:4px}@keyframes busIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.busA .in.big{padding-right:48px;font-size:16.5px;padding:14px 18px;border:2px solid var(--acc);border-radius:12px}
.busA .hint{font-size:12px;margin:5px 0 10px 4px;color:var(--tx2)}
.busA .resl{display:grid;gap:6px;margin-bottom:10px}
.busA .ri{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;cursor:pointer;background:var(--card)}
.busA .ri.on,.busA .ri:hover{border-color:var(--acc);background:var(--acc2)}
.busA .ri small{color:var(--tx2)}
.ficha{background:var(--card);border:1.5px solid var(--acc);border-radius:14px;padding:16px}
.ficha .fh{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ficha .fn{font-size:19px;font-weight:700}
.ficha .fbadge{display:inline-block;padding:6px 12px;border-radius:9px;font-weight:800;font-size:14px}
.ficha .fbadge.ok{background:var(--okb);color:var(--ok)}.ficha .fbadge.bad{background:var(--badb);color:var(--bad)}.ficha .fbadge.mut{background:var(--acc2);color:var(--tx2)}
.ficha .fgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:14px}
@media (max-width:900px){.ficha .fgrid{grid-template-columns:1fr}}
.ficha .ft{font-size:11.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px;margin:0 0 5px}
.ficha .mchip{display:inline-block;padding:3px 9px;border-radius:14px;font-size:12px;margin:2px 3px 2px 0;font-weight:600}
.ficha .mchip.ok{background:var(--okb);color:var(--ok)}.ficha .mchip.no{background:var(--badb);color:var(--bad)}
.ficha table.t td{padding:6px 8px}.ficha tr.hl td{background:var(--acc2);font-weight:700}
.ficha .rtw{max-height:260px;overflow:auto;border:1px solid var(--ln);border-radius:8px}
mark.hl{background:rgba(79,140,255,.3);color:inherit;border-radius:3px;padding:0 1px}
.rub-mas{border:1px dashed var(--ln);border-radius:10px;padding:8px 12px}
.rub-mas>summary{cursor:pointer;list-style:none;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rub-mas>summary::before{content:'▸ ';color:var(--acc)}.rub-mas[open]>summary::before{content:'▾ '}
.rub-mas>summary .muted{font-size:12px}
/* ---- Libreta ---- */
.nbbtn{position:relative;border:1.5px solid var(--acc);background:var(--acc2);color:var(--tx);border-radius:10px;padding:5px 11px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.nbbtn.on{background:var(--acc);color:#fff}.nbbtn b{position:absolute;top:-7px;right:-7px;background:var(--bad);color:#fff;border-radius:9px;font-size:10.5px;padding:0 5px;line-height:16px}
@media (max-width:700px){.nbbtn .nbl{display:none}}
#nbRoot{display:none}#nbRoot.nb-A,#nbRoot.nb-C,#nbRoot.nb-D{display:flex;flex-direction:column}
#nbRoot.nb-A{position:fixed;right:0;top:56px;bottom:0;width:430px;max-width:100vw;z-index:85;background:var(--card);border-left:1px solid var(--ln);box-shadow:-12px 0 40px rgba(0,0,0,.35);padding:12px;gap:8px;animation:nbIn .18s ease-out}
@keyframes nbIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#nbRoot.nb-C{position:fixed;right:110px;top:60px;width:480px;max-width:calc(100vw - 20px);max-height:calc(100vh - 80px);z-index:85;background:var(--card);border:1px solid var(--ln);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:12px;overflow:auto;animation:busIn .15s ease-out}
@media (max-width:700px){#nbRoot.nb-C{right:10px}}
#nbRoot.nb-D{position:fixed;inset:66px 40px 20px;z-index:85;background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden;animation:busIn .15s ease-out}
.nb-h{display:flex;align-items:center;gap:8px}.nb-h .sp{flex:1}
.nb-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nb-ls{overflow:auto;display:grid;gap:5px;align-content:start}
#nbRoot.nb-A .nb-ls{max-height:32vh;min-height:60px}
.nb-it{border:1px solid var(--ln);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:13px;background:var(--bg)}
.nb-it.on,.nb-it:hover{border-color:var(--acc);background:var(--acc2)}.nb-it small{display:block;color:var(--tx2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-ed{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--ln);padding-top:8px}
.ned{display:flex;flex-direction:column;gap:6px;height:100%}
.ned-t{font-weight:700;font-size:15px}
.ned-bar{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.ned-bar button,.ned-bar select{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer}.ned-bar .sp{flex:1}
.ned-c{flex:1;min-height:150px;overflow:auto;border:1px solid var(--ln);border-radius:9px;padding:10px 12px;background:var(--bg);line-height:1.6;outline:none;font-size:14px}
.ned-c:focus{border-color:var(--acc)}
.ned-c:empty::before{content:'Escriba aquí… se guarda solo';color:var(--tx2)}
.ned-c ul{margin:2px 0;padding-left:22px}
.ned-c .tk,.nprint .tk{position:relative;padding-left:24px;min-height:1.6em}
.ned-c .tk::before,.nprint .tk::before{content:'';position:absolute;left:2px;top:.3em;width:14px;height:14px;border:1.6px solid var(--tx2);border-radius:4px;cursor:pointer}
.ned-c .tk.ok,.nprint .tk.ok{color:var(--tx2);text-decoration:line-through}
.ned-c .tk.ok::before,.nprint .tk.ok::before{background:var(--ok);border-color:var(--ok)}
.nprint .tk::before{border-color:#555}
.ned-c.rayado{min-height:220px;background:repeating-linear-gradient(var(--bg) 0 21.4px,var(--ln) 22.4px);line-height:22.4px;padding-top:2px}
.ned-f{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ned-f .sp{flex:1}
.ned-col{display:inline-flex;gap:3px}.ned-col i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ln);cursor:pointer}.ned-col i.on{outline:2px solid var(--acc)}
.ned-links{display:flex;gap:4px;flex-wrap:wrap}
.nb-tabs{display:flex;gap:2px}.nb-tabs span{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--tx2)}.nb-tabs span.on{background:var(--acc2);color:var(--tx);font-weight:700}
#nbB{margin-top:8px}
.nb-pend{display:grid;gap:3px;margin-bottom:8px}
.nb-pi{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px}.nb-pi:hover{background:var(--acc2)}
.nb-pi i{width:16px;height:16px;border:1.6px solid var(--tx2);border-radius:4px;cursor:pointer;flex:none}.nb-pi.ok i{background:var(--ok);border-color:var(--ok)}
.nb-pi span{flex:1}.nb-pi.ok span{text-decoration:line-through;color:var(--tx2)}.nb-pi .iconbtn{opacity:.5;padding:2px 6px}.nb-pi:hover .iconbtn{opacity:1}
.nb-dw{display:grid;grid-template-columns:200px 250px 1fr;height:100%}
.nb-dw>div{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.nb-dc1{background:var(--bg);border-right:1px solid var(--ln)}.nb-dc2{border-right:1px solid var(--ln)}.nb-dc2 .nb-ls{flex:1}
.nb-sec{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px}.nb-sec.on{background:var(--acc2);color:var(--acc);font-weight:700}.nb-sec:hover{background:var(--acc2)}.nb-sec .sp{flex:1}
.nb-dc3 #nbE{flex:1;min-height:0}.nb-dc3 .ned-t{font-size:20px;border:0;background:transparent;padding-left:0}
@media (max-width:900px){#nbRoot.nb-D{inset:60px 6px 6px}.nb-dw{grid-template-columns:1fr}.nb-dc1,.nb-dc2{max-height:150px}}
@media print{#nbRoot,.nbbtn,#calcRoot,#calcBub{display:none!important}}
/* ---- Calculadora ---- */
#calcRoot{display:none}#calcRoot.calc{display:flex;flex-direction:column;position:fixed;z-index:96;background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);width:560px;max-width:calc(100vw - 16px);max-height:calc(100vh - 70px);overflow:auto;outline:none}
#calcRoot.calc-desp{right:200px;top:60px;animation:busIn .15s ease-out}
@media (max-width:800px){#calcRoot.calc-desp{right:8px}}
.calc-h{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--bg);border-bottom:1px solid var(--ln)}.calc-fija .calc-h{cursor:move}.calc-h .sp{flex:1}.calc-h .iconbtn.on{background:var(--acc2)}
.calc-tabs{display:flex;gap:2px}.calc-tabs span{padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--tx2);white-space:nowrap}.calc-tabs span.on{background:var(--acc2);color:var(--tx);font-weight:700}
.calc-b{padding:10px 12px}
.calc-a{display:grid;grid-template-columns:290px 1fr;gap:12px}@media (max-width:600px){.calc-a{grid-template-columns:1fr}}
.calc-disp{text-align:right;padding:4px 6px 8px}.calc-disp small{display:block;color:var(--tx2);font-size:13px;min-height:18px;word-break:break-all}.calc-disp b{font-size:32px;font-variant-numeric:tabular-nums}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ck{border:0;border-radius:10px;padding:11px 0;font-size:17px;font-weight:600;background:var(--acc2);color:var(--tx);cursor:pointer}.ck:hover{filter:brightness(1.15)}.ck:active{transform:scale(.96)}
.ck.o{color:var(--acc)}.ck.f{color:var(--bad)}.ck.e{background:var(--acc);color:#fff}
.calc-tape{border-left:1px solid var(--ln);padding-left:12px;font-size:12.5px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
.calc-tl{max-height:190px;overflow:auto}.calc-tl div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--ln);cursor:pointer}.calc-tl div:hover{color:var(--acc)}
.calc-sum{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}.calc-sum.big{border-top:2px solid var(--ln);margin-top:6px;padding-top:8px}.calc-sum.big b{font-size:22px}
.calc-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}.calc-chips .chip{cursor:pointer;font-size:12px;padding:3px 9px}
.calc-tb input{width:100%;padding:4px 6px}.calc-tb td{padding:4px 5px}
.calc-lns{display:grid;gap:4px}.calc-ln{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center}.calc-ln b{text-align:right;font-variant-numeric:tabular-nums}
.calc-ln input{font-family:ui-monospace,Consolas,monospace;font-size:14px}
#calcBub{position:fixed;z-index:97;width:58px;height:58px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;user-select:none}
#calcBub small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;font-size:11.5px;border-radius:9px;padding:1px 8px;white-space:nowrap}
.ct-w{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media (max-width:900px){.ct-w{grid-template-columns:1fr}}
.ct-l{position:sticky;top:0;max-height:calc(100vh - 170px);overflow:auto;padding:10px}
.ct-gh{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;margin:12px 4px 4px}

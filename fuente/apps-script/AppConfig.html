<script>
/* =================================================================
   CONFIGURACIÓN · IMPORTAR / EXPORTAR · CONEXIÓN · ARRANQUE
   ================================================================= */
let INFO = {}; // datos del servidor (token, carpeta, url…)

function cfgTabs(el, act) {
  const t = [['cfg:gen', 'General'], ['cfg:firmas', 'Firmantes'], ['cfg:listas', 'Catálogos'], ['cfg:catalogo', 'Catálogo de cobros y productos'], ['cfg:mods', 'Módulos y campos'], ['cfg:anios', 'Años'], ['cfg:import', 'Importar / exportar'], ['cfg:sync', 'Conexión']];
  return `<div class="tabs">${t.map(([v, l]) => `<button data-tab="${v}" class="${v === act ? 'act' : ''}">${l}</button>`).join('')}</div>`;
}
function bindTabs(el) { $$('[data-tab]', el).forEach(b => b.onclick = () => go(b.dataset.tab)); }
const path = (o, p) => p.split('.').reduce((a, k) => a && a[k], o);
const setPath = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k] = a[k] || {}, o)[last] = v; };

/* ---------- GENERAL ---------- */
defView('cfg:gen', 'Configuración general', el => {
  const F = (p, l, t = 'text', extra = '') => { const v = path(CFG, p); return t === 'check' ? `<label class="chk"><input type="checkbox" data-p="${p}" ${v ? 'checked' : ''}> ${l}</label>` : `<label class="f ${extra}"><span>${l}</span><input class="in" type="${t}" ${t === 'number' ? 'step="any"' : ''} data-p="${p}" value="${esc(v ?? '')}"></label>`; };
  el.innerHTML = cfgTabs(el, 'cfg:gen') + `
  <div class="card"><h3>Institución (aparece en todos los impresos)</h3><div class="form">
    ${F('inst.nombre', 'Nombre de la institución', 'text', 'wide')}${F('inst.organismo', 'Organismo')}${F('inst.area', 'Área / dependencia interna')}${F('inst.dependencia', 'Dependencia')}
    ${F('inst.direccion', 'Dirección', 'text', 'wide')}${F('inst.telefono', 'Teléfono')}${F('inst.codigo', 'Código de infraestructura')}${F('inst.municipio', 'Municipio')}${F('inst.departamento', 'Departamento')}${F('inst.distrito', 'Distrito')}${F('inst.lugar', 'Lugar (ciudad para fechas)')}${F('inst.nit', 'NIT del CDE')}
    <label class="f"><span>Logo (PNG/JPG)</span><input class="in" type="file" accept="image/*" id="gLogo"></label><div style="align-self:end">${CFG.inst.logo ? `<img src="${CFG.inst.logo}" style="height:48px;vertical-align:middle"> <button class="btn sm" id="gLogoX">Quitar</button>` : '<span class="muted">Sin logo</span>'}</div></div></div>
  <div class="card"><h3>Firmantes</h3><p class="muted" style="margin:0">${firmantes().filter(f => f.nombre).map(f => `<b>${esc(f.nombre)}</b> · ${esc(f.cargo)}`).join('<br>') || 'Sin firmantes'}</p><div class="bar" style="margin-top:8px"><button class="btn" data-tab="cfg:firmas">✍️ Agregar, quitar o elegir firmantes por documento</button></div></div>
  <div class="grid g2"><div class="card"><h3>Caja chica</h3><div class="form">${F('caja.fondo', 'Monto del fondo $', 'number')}${F('caja.limite', 'Límite por compra $', 'number')}${F('caja.alertaPct', 'Alertar reembolso cuando el saldo sea ≤ (0.20 = 20%)', 'number')}${F('caja.prefijo', 'Prefijo de recibos (RC → RC261001)')}</div></div>
  <div class="card"><h3>Recibos, alimentos y cuadre</h3><div class="form"><div class="sec-t">Series de recibos</div><label class="f"><span>Serie de recibos predeterminada</span><select class="in" data-p="serieDef">${lista('series').map(x => `<option ${x === CFG.serieDef ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label><label class="f"><span>Rangos por serie (una por línea, ej. A: 1-27)</span><textarea class="in" id="gSR" rows="2">${esc((CFG.seriesRangos || []).map(x => `${x.s}: ${x.d}-${x.h}`).join('\n'))}</textarea></label><div style="align-self:end"><button class="btn sm" id="gSRa" type="button">Aplicar series a los recibos</button></div><div class="sec-t">Alimentos</div>${F('alimentos.cuota', 'Cuota mensual de alimentos $', 'number')}<div class="wide"><span class="muted" style="font-size:12.5px;font-weight:600">Meses en que se cobran alimentos <span id="gMc">(${mesesCobro().length})</span></span><div class="chips" id="gMeses" style="margin-top:4px">${MESES.map((m, i) => `<label class="chip ${mesesCobro().includes(i + 1) ? 'on' : ''}"><input type="checkbox" value="${i + 1}" ${mesesCobro().includes(i + 1) ? 'checked' : ''} style="display:none">${cap(m).slice(0, 3)}</label>`).join('')}</div></div>
    <label class="f wide"><span>Pendientes de alimentos en constancias y reportes</span><select class="in" data-p="alimentos.modo"><option value="anual" ${(CFG.alimentos.modo || 'anual') === 'anual' ? 'selected' : ''}>Comparar con todo el año (todos los meses marcados)</option><option value="fecha" ${CFG.alimentos.modo === 'fecha' ? 'selected' : ''}>Comparar solo con los meses que ya pasaron</option></select></label><div class="sec-t">Cuadre de caja</div><div class="wide">${F('cuadre.incluirDonaciones', 'Sumar también el módulo Donaciones al cuadre (solo si las donaciones NO se registran con recibo)', 'check')}</div></div></div></div>
  <div class="grid g2"><div class="card"><h3>Apariencia</h3><div class="form"><label class="f"><span>Color principal</span><input type="color" class="in" data-p="tema.pri" value="${CFG.tema.pri}" style="height:38px"></label><label class="f"><span>Color de acento</span><input type="color" class="in" data-p="tema.acc" value="${CFG.tema.acc}" style="height:38px"></label></div></div>
  <div class="card"><h3>📒 Libreta de notas</h3><p class="muted" style="margin-top:0;font-size:12.5px">Botón de la barra superior (atajo Ctrl+Shift+N). Las notas son las mismas en los tres modos: al cambiar de modo solo cambia cómo se ven.</p>
    <label class="f"><span>Modo</span><select class="in" data-p="notas.modo">${[['A', 'A · Libreta lateral: lista + editor en un panel a la derecha'], ['C', 'C · Bloc rápido: borrador y pendientes en una ventanita'], ['D', 'D · Cuaderno: secciones, páginas y formato en ventana amplia']].map(([v, l]) => `<option value="${v}" ${(CFG.notas.modo || 'A') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="f" style="margin-top:8px"><span>Secciones (una por línea) · se usan en el cuaderno y como filtros</span><textarea class="in" rows="4" id="gNs">${esc((CFG.notas.secciones || []).join('\n'))}</textarea></label></div>
  <div class="card"><h3>Notificaciones</h3>${F('notif.sonido', 'Sonido al avisar una actividad', 'check')}${F('notif.escritorio', 'Notificaciones de escritorio (si el navegador lo permite)', 'check')}
    <div class="form" style="margin-top:8px">${F('notif.correo', 'Correo para recordatorios (vacío = su cuenta)', 'email', 'wide')}</div>
    <div class="bar" style="margin-top:8px"><button class="btn" id="gNP">Probar notificación</button><button class="btn" id="gTr">✉️ Recordatorios por correo…</button></div></div></div>
  <div class="bar"><span class="sp"></span><button class="btn pri" id="gS">💾 Guardar configuración</button></div>`;
  bindTabs(el);
  const leer = () => { $$('[data-p]', el).forEach(i => { let v = i.type === 'checkbox' ? i.checked : i.value; if (i.type === 'number') v = num(v); setPath(CFG, i.dataset.p, v); });
    const gm = $$('#gMeses input', el); if (gm.length) { CFG.alimentos.mesesCobro = gm.filter(i => i.checked).map(i => num(i.value)); CFG.alimentos.meses = CFG.alimentos.mesesCobro.length; CFG.alimentos.mesInicio = CFG.alimentos.mesesCobro[0] || 1; }
    const gns = $('#gNs', el); if (gns) CFG.notas.secciones = gns.value.split('\n').map(x => x.trim()).filter(Boolean); if (window.NB) NB.badge();
    const sr = $('#gSR', el); if (sr) CFG.seriesRangos = sr.value.split('\n').map(l => l.match(/^\s*([^:]+?)\s*:\s*(\d+)\s*-\s*(\d+)/)).filter(Boolean).map(m => ({ s: m[1].trim().toUpperCase(), d: num(m[2]), h: num(m[3]) })); };
  $$('#gMeses input', el).forEach(i => i.onchange = () => { i.parentElement.classList.toggle('on', i.checked); $('#gMc', el).textContent = `(${$$('#gMeses input:checked', el).length})`; });
  const sra = $('#gSRa', el); if (sra) sra.onclick = async () => { leer(); const desc = (CFG.seriesRangos || []).map(x => `Serie ${x.s}: del ${x.d} al ${x.h}`).join('<br>'); if (!(await confirmBox(`Se revisarán todos los recibos del año ${Store.year}:<br>${desc}<br>Resto: Serie ${CFG.serieDef}.<br><br>¿Aplicar?`, 'Aplicar'))) return; CFG.seriesRangos.forEach(x => { if (!lista('series').includes(x.s)) CFG.listas.series.push(x.s); }); await saveCfg(true); const n = await asignarSeries(true); toast(n ? `✔ Serie actualizada en ${n} recibo(s)` : 'Todos los recibos ya tenían la serie correcta', 'ok', 5000); };
  $('#gS', el).onclick = async () => { leer(); await saveCfg(); go('cfg:gen'); };
  $('#gLogo', el).onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { const img = new Image(); img.onload = async () => { const c = document.createElement('canvas'); const h = 140, w = Math.round(img.width * h / img.height); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); leer(); CFG.inst.logo = c.toDataURL('image/png'); await saveCfg(); go('cfg:gen'); }; img.src = rd.result; }; rd.readAsDataURL(f); };
  const lx = $('#gLogoX', el); if (lx) lx.onclick = async () => { leer(); CFG.inst.logo = ''; await saveCfg(); go('cfg:gen'); };
  $('#gNP', el).onclick = () => { Notif.ask(); Notif.fire({ titulo: 'Prueba de notificación', hora: new Date().toTimeString().slice(0, 5), _id: 'test' }, today(), 'test|' + Date.now()); };
  $('#gTr', el).onclick = () => triggersModal();
});
function triggersModal() {
  if (Sync.mode === 'local') return toast('Requiere conexión con Google (Configuración › Conexión)', 'bad');
  const st = INFO.triggers || {};
  modal('Recordatorios por correo', `<p class="muted">El servidor de Google revisa su agenda y le envía correos aunque tenga la computadora apagada.</p>
    <label class="chk"><input type="checkbox" id="trE" ${st.email ? 'checked' : ''}> Enviar correo cuando llegue la hora de aviso de cada actividad (revisa cada 15 min)</label>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="trD" ${st.digest ? 'checked' : ''}> Resumen diario de la agenda a las 6:00 a. m.</label>
    <p class="muted" style="font-size:12px;margin-top:10px">También se activa un respaldo automático de sus archivos cada viernes a las 5:00 p. m.</p>`,
    [{ l: 'Cancelar' }, { l: 'Guardar', pri: 1, fn: async () => { try { INFO.triggers = await Sync.call({ action: 'triggers', email: $('#trE').checked, digest: $('#trD').checked }); toast('Recordatorios actualizados ✔', 'ok'); } catch (e) { toast('No se pudo: ' + (e.error || e), 'bad'); } } }], { sm: true });
}

/* ---------- FIRMANTES ---------- */
defView('cfg:firmas', 'Firmantes', el => {
  let fs = JSON.parse(JSON.stringify(firmantes()));
  let fd = JSON.parse(JSON.stringify(CFG.firmasDoc || {}));
  DOCS_FIRMA.forEach(([k, , def]) => { if (!fd[k]) fd[k] = def.slice(); });
  const draw = () => {
    const opts = sel => `<option value="">—</option>${fs.map(f => `<option value="${f.k}" ${f.k === sel ? 'selected' : ''}>${esc(f.nombre || '(sin nombre)')} · ${esc(f.cargo)}</option>`).join('')}`;
    el.innerHTML = cfgTabs(el, 'cfg:firmas') + `<div class="alert info">Agregue o quite las personas que firman. Luego elija, para cada documento, quiénes firman y en qué orden (de izquierda a derecha). El nombre y el cargo se imprimen tal como los escriba aquí.</div>
    <div class="card"><h3>Firmantes</h3><div class="tw" style="max-height:none"><table class="t"><thead><tr><th>Nombre (como se imprime)</th><th>Cargo (como se imprime)</th><th>Clave para plantillas</th><th></th></tr></thead><tbody>
      ${fs.map((f, i) => `<tr data-i="${i}"><td><input class="in" data-k="nombre" value="${esc(f.nombre)}" placeholder="(escriba el nombre)"></td><td><input class="in" data-k="cargo" value="${esc(f.cargo)}"></td><td class="muted">{{${esc(f.k)}}}</td><td><button class="btn sm danger" data-del title="Quitar firmante">🗑️</button></td></tr>`).join('')}</tbody></table></div>
      <div class="bar" style="margin-top:10px"><button class="btn" id="fA">+ Agregar firmante</button></div></div>
    <div class="card"><h3>Quién firma cada documento</h3><div class="tw" style="max-height:none"><table class="t"><thead><tr><th>Documento</th><th>Firma 1</th><th>Firma 2</th><th>Firma 3</th><th>Firma 4</th></tr></thead><tbody>
      ${DOCS_FIRMA.map(([k, l]) => `<tr data-doc="${k}"><td><b>${esc(l)}</b></td>${[0, 1, 2, 3].map(j => `<td><select class="in" data-j="${j}" style="min-width:150px">${opts((fd[k] || [])[j] || '')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:12px">Los formatos oficiales de compra (cotización, orden y acta) mantienen su diseño y toman el nombre del Presidente y del Concejal encargado de compras.</p></div>
    <div class="card"><h3>Vista previa</h3><select class="in" id="fPv" style="width:auto">${DOCS_FIRMA.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select><div id="fPvOut" style="background:#fff;color:#000;padding:10px 20px 20px;border-radius:8px;margin-top:10px;font-family:Arial"></div></div>
    <div class="bar"><span class="sp"></span><button class="btn pri" id="fS">💾 Guardar firmantes</button></div>`;
    bindTabs(el);
    const leer = () => { $$('tr[data-i]', el).forEach(tr => { const f = fs[tr.dataset.i]; $$('[data-k]', tr).forEach(i => f[i.dataset.k] = i.value.trim()); }); $$('tr[data-doc]', el).forEach(tr => { fd[tr.dataset.doc] = $$('[data-j]', tr).map(s => s.value).filter(Boolean); }); };
    const pv = () => { leer(); const prev = { f: CFG.firmantes, d: CFG.firmasDoc }; CFG.firmantes = fs; CFG.firmasDoc = fd; const k = $('#fPv', el).value; $('#fPvOut', el).innerHTML = firmasDoc(k, k === 'constancia' ? [['', 'Sello']] : k === 'voucher' ? [['(beneficiario)', 'Recibí conforme']] : null) || '<p class="muted">Sin firmas para este documento.</p>'; CFG.firmantes = prev.f; CFG.firmasDoc = prev.d; };
    el.addEventListener('change', pv); $('#fPv', el).onchange = pv; pv();
    $$('[data-del]', el).forEach(b => b.onclick = async () => { leer(); const i = Number(b.closest('tr').dataset.i), f = fs[i]; const usos = DOCS_FIRMA.filter(([k]) => (fd[k] || []).includes(f.k)).map(d => d[1]); if (!(await confirmBox(`¿Quitar a <b>${esc(f.nombre || f.cargo)}</b>?${usos.length ? '<br>Se quitará de: ' + esc(usos.join(', ')) : ''}`, 'Quitar'))) return; fs.splice(i, 1); for (const k in fd) fd[k] = fd[k].filter(x => x !== f.k); draw(); });
    $('#fA', el).onclick = () => { leer(); modal('Agregar firmante', `<div class="form"><label class="f wide"><span>Nombre (como se imprime)</span><input class="in" id="nfN" placeholder="Ej.: Licda. Nombre Apellido"></label><label class="f wide"><span>Cargo (como se imprime)</span><input class="in" id="nfC" placeholder="Ej.: Concejal Representante de los Maestros"></label></div>`,
      [{ l: 'Cancelar' }, { l: '+ Agregar', pri: 1, fn: () => { const nombre = $('#nfN').value.trim(), cargo = $('#nfC').value.trim(); if (!nombre && !cargo) { toast('Escriba nombre y cargo', 'bad'); return false; } let k = norm(cargo || nombre).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 24) || 'firmante'; while (fs.some(f => f.k === k)) k += '_2'; fs.push({ k, nombre, cargo }); setTimeout(draw, 20); } }], { sm: true }); };
    $('#fS', el).onclick = async () => { leer(); CFG.firmantes = fs; CFG.firmasDoc = fd; syncFirmas(); await saveCfg(); draw(); };
  };
  draw();
});

/* ---------- CATÁLOGOS ---------- */
const LISTAS_NOM = { series: 'Series de recibos', unidades_rubro: 'Unidades de los rubros', arr_categorias: 'Categorías de arrendatarios', secciones: 'Secciones', opciones: 'Opciones de bachillerato', estados_est: 'Estados del estudiante', pagador: 'Tipos de pagador', cc_categorias: 'Caja chica · categorías', cc_tipos: 'Caja chica · tipos', cc_comprobantes: 'Caja chica · comprobantes', unidades: 'Unidades de medida', agenda_tipos: 'Agenda · tipos de actividad', prioridades: 'Agenda · prioridades', bod_categorias: 'Bodega · categorías', bod_tipos: 'Bodega · tipos de movimiento', personal_estados: 'Personal · estados', unif_niveles: 'Uniformes · niveles', tallas: 'Tallas', compra_estados: 'Compras · estados', fondos: 'Compras · fuente de fondos', doc_categorias: 'Documentos · categorías', sexo: 'Sexo' };
defView('cfg:listas', 'Catálogos y listas', el => {
  el.innerHTML = cfgTabs(el, 'cfg:listas') + `<div class="alert info">Una opción por línea. Estas listas alimentan los menús desplegables de todo el sistema. ⚠ No cambie "Bodega · tipos de movimiento" ni "Caja chica · tipos" salvo que agregue opciones nuevas: los cálculos usan las palabras ENTRADA, SALIDA, PRÉSTAMO, INICIO y REPOSICIÓN.</div>
    <div class="card"><h3>Grados (GRADO | NIVEL | CICLO) · en orden</h3><textarea class="in" id="lG" rows="10">${CFG.grados.map(g => `${g.g} | ${g.nivel} | ${g.ciclo}`).join('\n')}</textarea></div>
    <div class="grid g3">${Object.keys(LISTAS_NOM).filter(k => CFG.listas[k]).map(k => `<div class="card"><h3>${LISTAS_NOM[k]}</h3><textarea class="in" data-l="${k}" rows="7">${esc(CFG.listas[k].join('\n'))}</textarea></div>`).join('')}</div>
    <div class="bar"><span class="sp"></span><button class="btn pri" id="lS">💾 Guardar catálogos</button></div>`;
  bindTabs(el);
  $('#lS', el).onclick = async () => {
    $$('[data-l]', el).forEach(t => CFG.listas[t.dataset.l] = t.value.split('\n').map(s => s.trim()).filter(Boolean));
    CFG.grados = $('#lG', el).value.split('\n').map(l => l.split('|').map(s => s.trim())).filter(x => x[0]).map(([g, nivel, ciclo]) => ({ g, nivel: (nivel || '').toUpperCase(), ciclo: (ciclo || nivel || '').toUpperCase() }));
    await saveCfg();
  };
});

/* ---------- RUBROS ---------- */
defView('cfg:rubros', 'Rubros y precios', el => {
  let rbs = CFG.rubros.map(r => Object.assign({}, r));
  const draw = () => {
    el.innerHTML = cfgTabs(el, 'cfg:rubros') + `<div class="alert info">Los rubros son las columnas de cobro de los recibos (carnet, alimentos, uniformes…). El precio se usa en el formulario rápido (cantidad × precio). Marque <b>meses</b> en el rubro que se cobra por mes (alimentos). <b>⭐ Frecuente</b> = aparece siempre arriba en el recibo; los demás quedan en <i>Más rubros</i>. <b>Visible en recibo</b> desmarcado = no aparece al digitar, pero <b>sus montos siguen contando</b> en cuadres, arqueos y reportes; 🗑️ lo elimina de la lista (los montos ya guardados se conservan en Drive). Las unidades se administran en Catálogos › Unidades de los rubros.</div>
    <div class="tw" style="max-height:none"><table class="t"><thead><tr><th>Orden</th><th>Nombre</th><th>Precio $</th><th>Unidad</th><th>¿Por meses?</th><th title="Se paga en banco: no entra al efectivo del cuadre">¿Pago en banco?</th><th title="Se muestra arriba en el recibo">⭐ Frecuente</th><th title="Desmarcado = no aparece al digitar recibos. Los montos ya registrados siguen contando en cuadres y reportes.">Visible en recibo</th><th title="Al importar: recibos sin desglose cuyo concepto contenga estas palabras se asignan a este rubro">Palabras clave</th><th>Clave interna</th></tr></thead><tbody>
    ${rbs.map((r, i) => `<tr data-i="${i}"><td class="act"><button class="btn sm" data-up>▲</button><button class="btn sm" data-dn>▼</button></td><td><input class="in" data-k="l" value="${esc(r.l)}"></td><td><input class="in" type="number" step="any" data-k="p" value="${r.p || ''}" style="width:90px"></td><td><select class="in" data-k="u" style="width:105px">${[...new Set([...lista('unidades_rubro'), r.u || ''])].filter(Boolean).map(u => `<option ${u === r.u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></td><td class="c"><input type="checkbox" data-k="meses" ${r.meses ? 'checked' : ''}></td><td class="c"><input type="checkbox" data-k="banco" ${r.banco ? 'checked' : ''}></td><td class="c"><input type="checkbox" data-k="fav" ${r.fav ? 'checked' : ''}></td><td class="c"><input type="checkbox" data-k="on" ${r.off ? '' : 'checked'}></td><td><input class="in" data-k="kw" value="${esc(r.kw || '')}" style="width:130px"></td><td class="muted">r_${esc(r.k)}</td><td><button class="btn sm danger" data-del title="Eliminar rubro">🗑️</button></td></tr>`).join('')}</tbody></table></div>
    <div class="bar" style="margin-top:12px"><button class="btn" id="rA">+ Agregar rubro</button><span class="sp"></span><button class="btn pri" id="rS">💾 Guardar rubros</button></div>`;
    bindTabs(el);
    $$('tr[data-i]', el).forEach(tr => {
      const i = Number(tr.dataset.i);
      $$('[data-k]', tr).forEach(inp => inp.onchange = () => { const k = inp.dataset.k; if (k === 'on') rbs[i].off = !inp.checked; else if (k === 'fav') rbs[i].fav = inp.checked; else if (k === 'meses') rbs[i].meses = inp.checked; else if (k === 'banco') rbs[i].banco = inp.checked; else rbs[i][k] = k === 'p' ? num(inp.value) : inp.value; });
      $('[data-up]', tr).onclick = () => { if (i) { [rbs[i - 1], rbs[i]] = [rbs[i], rbs[i - 1]]; draw(); } };
      $('[data-dn]', tr).onclick = () => { if (i < rbs.length - 1) { [rbs[i + 1], rbs[i]] = [rbs[i], rbs[i + 1]]; draw(); } };
      $('[data-del]', tr).onclick = async () => {

/* ---------- CATÁLOGO UNIFICADO: rubros + productos + tallas + existencias (lista + ficha) ---------- */
function grupoRubro(r, ps) { if (r.grupo) return r.grupo; if (ps.some(p => p.rubro === r.k)) return 'Productos con existencia'; if (/gradu|evento|teatro|acto|tarjeta/i.test(r.l)) return 'Eventos y graduación'; return 'Cuotas y servicios'; }
function vendidoRubro(r) {
  const rs = Store.all('recibos').filter(x => !isTrue(x.nulo) && num(x['r_' + r.k]));
  const dinero = rs.reduce((a, x) => a + num(x['r_' + r.k]), 0);
  const unid = r.meses ? rs.reduce((a, x) => a + (r.k === 'alimentos' ? mesesAlimDe(x) : num(r.p) ? num(x['r_' + r.k]) / num(r.p) : 0), 0) : num(r.p) ? dinero / num(r.p) : null;
  return { dinero: r2(dinero), unid: unid === null ? null : r2(unid), recibos: rs.length };
}

const ALIAS = { 'n° de recibo': 'numero', 'no de recibo': 'numero', 'numero de recibo': 'numero', 'recibo': 'numero', 'n°': '', 'n': '', 'grado01': 'grado', 'seccion2': 'seccion', 'opcion': 'opcion', 'dui de responsable': 'dui_resp', 'dui responsable': 'dui_resp', 'meses que paga': 'meses_alim', 'meses alim': 'meses_alim', 'pago': 'pago', 'total': 'total', 'serie': 'serie', 'observacion': 'obs', 'observaciones': 'obs', 'nombre del docente (apellidos, nombres)': 'nombre', 'nombre del docente': 'nombre', 'proveedor / nombre': 'proveedor', 'debe (+)': 'debe', 'haber (-)': 'haber', 'no. de documento': 'documento', 'saldo (auto)': '', 'n° caja (auto)': '', 'mes (auto)': '', 'alertas (auto)': '', 'cantidad a devolver': 'cantidad', '¿recibo anulado?': 'anulado', 'anexo a': 'anexo', 'no.': 'boleta', 'mes que cancela': 'mes', 'n° recibo': 'recibo', 'n° de comprobante': 'comprobante', 'descripcion': 'articulo', 'n° dui o nit': 'dui_nit', 'nombre (igual que en el registro)': 'nombre' };
let ALIASN = null;
function autoMap(mod, header) {
  if (!ALIASN) { ALIASN = {}; for (const k in ALIAS) ALIASN[norm(k)] = ALIAS[k]; }
  const fs = fieldsOf(mod).filter(f => f.t !== 'calc');
  const ns = header.map(h => norm(String(h || '').replace(/\n/g, ' ')));
  const out = ns.map(() => ''); const taken = new Set();
  // 1) alias conocidos de sus archivos (prioridad)
  ns.forEach((n, i) => { const k = ALIASN[n]; if (k && fs.some(f => f.k === k) && !taken.has(k)) { out[i] = k; taken.add(k); } else if (k === '') out[i] = '-'; });
  // 2) coincidencia exacta con etiqueta o clave
  ns.forEach((n, i) => { if (out[i] || !n) return; const f = fs.find(f => !taken.has(f.k) && (norm(f.l) === n || f.k === n || norm(f.k.replace(/^r_/, '')) === n)); if (f) { out[i] = f.k; taken.add(f.k); } });
  // 3) coincidencia parcial (solo encabezados largos)
  ns.forEach((n, i) => { if (out[i] || n.length < 4) return; const f = fs.find(f => !taken.has(f.k) && norm(f.l).length >= 4 && (norm(f.l).startsWith(n) || n.startsWith(norm(f.l)))); if (f) { out[i] = f.k; taken.add(f.k); } });
  return out.map(x => x === '-' ? '' : x);
}
function parseCSV(t) {
  const sep = (t.split('\n')[0].match(/\t/g) || []).length ? '\t' : (t.split('\n')[0].match(/;/g) || []).length > (t.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === sep) { row.push(cur); cur = ''; } else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

/** Carga un respaldo (.json) en este equipo y lo pone en cola para subir a Drive.
    reemplazar=true: borra antes los datos de este equipo (se usa en el demo). */
async function restaurarRespaldo(d, reemplazar) {
  if (reemplazar) { const keep = { seedVer: await IDB.get('seedVer'), year: await IDB.get('year') }; await IDB.clearAll(); Store.queued = new Set(); for (const k in keep) if (keep[k] !== undefined) await IDB.set(k, keep[k]); }
  const q = d.rows.map(o => ({ k: o.k, b: o.b, mod: o.b.split('|')[1], d: o.d }));
  for (let i = 0; i < d.rows.length; i += 2000) { await IDB.put('rows', d.rows.slice(i, i + 2000)); await IDB.put('queue', q.slice(i, i + 2000)); }
  const ys = LS.get('localYears', []); d.rows.forEach(o => { const y = Number(o.b.split('|')[0]); if (y && !ys.includes(y)) ys.push(y); }); LS.set('localYears', ys);
  if (d.cfg) { CFG = deepMerge(DEFAULT_CFG(), d.cfg); CFG.seeded = true; await saveCfg(true); renderMenu(); }
  await Store.loadAll(); renderYears(); Sync.run();
}
/** Registros idénticos en todos sus campos de datos (por módulo). Devuelve {mod: [copias a eliminar]} */
const CAMPOS_TECNICOS = new Set(['_id', '_upd', '_srv', '_del', 'orden', 'est_id', 'art_id', 'arr_id', 'rec_id', 'per_id', 'grupo', 'mes', 'total']);
function duplicadosExactos() {
  const out = {};
  for (const m of Object.keys(MOD)) {
    const fs = fieldsOf(m).filter(f => f.t !== 'calc' && !CAMPOS_TECNICOS.has(f.k)).map(f => f.k);
    const vistos = new Map(); out[m] = [];
    Store.all(m).slice().sort((a, b) => num(b._upd) - num(a._upd)).forEach(r => {
      const firma = JSON.stringify(fs.map(k => { const v = r[k]; return v === undefined || v === null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v); }));
      if (firma === JSON.stringify(fs.map(() => ''))) return;
      if (vistos.has(firma)) out[m].push(r); else vistos.set(firma, r);
    });
  }
  return out;
}
async function limpiarDuplicados(ejecutar) {
  const r = duplicadosExactos(); let n = 0;
  if (!ejecutar) return Object.values(r).reduce((a, x) => a + x.length, 0);
  for (const m in r) { if (!r[m].length) continue; n += r[m].length; for (let i = 0; i < r[m].length; i += 500) await Store.saveMany(m, r[m].slice(i, i + 500).map(x => Object.assign({}, x, { _del: 1 }))); }
  for (const x of (r.recibos || [])) if ((x.unif || []).length) await syncVentasRecibo(Object.assign({}, x, { _del: 1 }));
  return n;
}

async function importar(mod, datos, map, key, modo) {
  const fm = fieldMap(mod); const def = MOD[mod];
  const exist = new Map(); if (key) Store.all(mod).forEach(r => { const v = norm(r[key]); if (v) exist.set(v, r); });
  const nuevos = []; let omit = 0, upd = 0, incompletas = 0, lastFecha = '';
  const reqs = fieldsOf(mod).filter(f => f.req && f.t !== 'calc').map(f => f.k);
  const canon = {}; fieldsOf(mod).filter(f => f.t === 'select').forEach(f => { const m = {}; optsOf(f).forEach(o => { const v = typeof o === 'object' ? o.v : o; m[norm(v)] = v; }); canon[f.k] = m; });
  datos.forEach(row => {
    let r = {};
    map.forEach((k, i) => { if (!k) return; let v = row[i]; if (v instanceof Date) v = ymd(v); if (v === '' || v === null || v === undefined || /^(none|null|undefined|nan|#n\/a|#value!|#ref!)$/i.test(String(v).trim())) return; if (r[k] !== undefined && r[k] !== '') return; r[k] = typeof v === 'string' ? v.trim() : v; });
    if (!Object.keys(r).length) return;
    coerceRow(mod, r); delete r._upd; delete r._del;
    for (const k in canon) if (r[k] !== undefined && r[k] !== '') { const n = norm(r[k]); const c = canon[k][n] || canon[k][n + '°'] || canon[k][n.replace(/\s*grado$/, '')]; if (c !== undefined) r[k] = c; }
    if (fm.mes && r.mes) r.mes = cap(String(r.mes).toLowerCase());
    if (mod === 'recibos') {
      if (/NULO|ANULAD/i.test([r.concepto, r.nombre, r.grado, r.seccion].join(' '))) { r.nulo = true; if (/NULO/i.test(r.grado || '')) r.grado = ''; }
      if (!r.tipo) { const g = norm(r.grado); r.tipo = !g || gradosList().some(x => norm(x) === g) ? 'Estudiante' : /docente|profesor/.test(g) ? 'Docente' : /padre|madre/.test(g) ? 'Padre/Madre' : 'Externo'; if (r.tipo !== 'Estudiante') r.grado = ''; }
    }
    if (mod === 'recibos') {
      if (!r.serie) r.serie = serieDeNumero(r.numero);
      if (!r.fecha && r.numero && lastFecha) { r.fecha = lastFecha; r.obs = ((r.obs || '') + ' · fecha tomada del recibo anterior').replace(/^ · /, ''); }
      if (r.fecha) lastFecha = r.fecha;
      const suma0 = rubrosOn().reduce((t, rb) => t + num(r['r_' + rb.k]), 0), resto = r2(num(r.pago) - suma0);
      if (!r.nulo && resto > 0.004) { const rb = rubrosOn().find(x => x.kw && new RegExp(x.kw, 'i').test(r.concepto || '')); if (rb) r['r_' + rb.k] = r2(num(r['r_' + rb.k]) + resto); }
    }
    if (reqs.some(k => r[k] === undefined || r[k] === '') && !(mod === 'recibos' && r.nulo && r.numero)) { incompletas++; return; }
    if (mod === 'estudiantes' && !r.estado) r.estado = 'ACTIVO';
    if (mod === 'cajachica') { const t = norm(r.tipo); if (/gasto/.test(t)) r.tipo = 'GASTO'; else if (/inicio/.test(t)) r.tipo = 'INICIO'; else if (/reintegro|reposic/.test(t)) r.tipo = num(r.debe) > 0 && /CHEQUE/i.test(r.comprobante || '') ? 'REPOSICIÓN' : 'REINTEGRO'; if (!r.concepto && (num(r.debe) || num(r.haber))) r.concepto = '(sin concepto)'; }
    if (key && r[key] !== undefined) { const ex = exist.get(norm(r[key])); if (ex) { if (modo === 'upd') { r = Object.assign({}, ex, r); upd++; } else { omit++; return; } } }
    if (def.beforeSave) { try { def.beforeSave(r); } catch (e) { } }
    nuevos.push(r);
    if (key && r[key] !== undefined) exist.set(norm(r[key]), r);
  });
  if (!nuevos.length) return toast(`No hay filas nuevas para importar (${omit} duplicada(s), ${incompletas} sin campos obligatorios).`, 'bad', 6000);
  const t = toast(`Importando ${nuevos.length} registro(s)…`, '', 60000);
  for (let i = 0; i < nuevos.length; i += 500) await Store.saveMany(mod, nuevos.slice(i, i + 500), { noSync: true });
  t.remove(); toast(`✔ ${nuevos.length - upd} nuevo(s), ${upd} actualizado(s), ${omit} duplicado(s) omitido(s)${incompletas ? `, ${incompletas} fila(s) sin datos obligatorios (totales o vacías) omitida(s)` : ''}. Subiendo a Drive…`, 'ok', 9000);
  Sync.run(); go('m:' + mod);
}

/* ---------- DIAGNÓSTICO DE CONEXIÓN (versión offline) ---------- */
async function diagConexion(url, token) {
  const pasos = [];
  const m = modal('🩺 Probar conexión con Google', '<div id="dgOut"><p class="muted">Probando…</p></div>', [{ l: 'Copiar resultado', fn: () => { navigator.clipboard && navigator.clipboard.writeText($('#dgOut').innerText); toast('Copiado'); return false; } }, { l: 'Cerrar', pri: true }]);
  const pintar = (fin) => { const o = $('#dgOut'); if (!o) return; o.innerHTML = `<table class="tbl"><tbody>${pasos.map(p => `<tr><td style="width:28px">${p.ok === true ? '✅' : p.ok === false ? '❌' : '⏳'}</td><td><b>${esc(p.t)}</b><div class="muted" style="font-size:12px">${esc(p.d || '')}</div></td></tr>`).join('')}</tbody></table>` + (fin ? `<div class="card" style="margin-top:10px;background:var(--bg)"><b>${fin.ok ? '✅ ' : '👉 '}${esc(fin.t)}</b><div style="margin-top:4px">${fin.h}</div></div>` : ''); };
  const paso = (t) => { const p = { t, ok: null }; pasos.push(p); pintar(); return p; };
  const fin = (ok, t, h) => pintar({ ok, t, h });
  const timeout = (ms) => { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };
  const post = (req) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token }, req)), redirect: 'follow', credentials: 'omit', signal: timeout(60000) });

  let p = paso('Internet en este equipo');
  p.ok = navigator.onLine; p.d = navigator.onLine ? 'Conectado' : 'El equipo no tiene internet'; pintar();
  if (!p.ok) return fin(false, 'Sin internet', 'Conéctese a internet y vuelva a probar.');

  p = paso('Formato de la URL');
  if (!/^https:\/\/script\.google\.com\/.*macros\/s\/[^/]+\/exec$/.test(url)) {
    p.ok = false; p.d = url || '(vacía)';
    return fin(false, 'La URL no es correcta', /\/dev$/.test(url) ? 'Usó la URL que termina en <b>/dev</b> (es de pruebas y pide iniciar sesión). Copie la que termina en <b>/exec</b>: Implementar › Administrar implementaciones.' : 'Debe ser la URL de la aplicación web y terminar en <b>/exec</b> (Implementar › Administrar implementaciones › copiar URL).');
  }
  p.ok = true; p.d = url.length > 70 ? url.slice(0, 55) + '…' + url.slice(-12) : url; pintar();

  let modo = 'fetch';
  const enviar = async (req) => {
    if (modo === 'jsonp') { try { return { ok: true, data: await jsonpCall(url, Object.assign({ token }, req)) }; } catch (e) { if (e && e.error === 'NET') throw new Error(e.msg); return e; } }
    const r = await post(req); const t = await r.text(); try { return JSON.parse(t); } catch (x) { return { html: t.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 200) }; }
  };
  p = paso('Este archivo puede comunicarse con Google (prueba de lectura)');
  try {
    const r = await fetch(url + '?ping=1', { credentials: 'omit', signal: timeout(30000) });
    const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch (x) {}
    if (!j || !j.ok) { p.ok = false; p.d = t.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 160); pintar(); return fin(false, 'Google no devolvió datos', 'Revise en Implementar › Administrar implementaciones que <b>Quién tiene acceso</b> sea <b>Cualquier usuario</b>.'); }
    p.ok = true; p.d = 'Respondió: ' + (j.app || 'ok'); pintar();
  } catch (e) {
    p.ok = false; p.d = 'Conexión normal bloqueada por el navegador (' + String(e && e.message || e) + ')'; pintar();
    const p2 = paso('Conexión alternativa');
    try {
      const j = await jsonpGet(url, { ping: 1 }, 30000);
      if (!j || !j.ok) throw new Error('sin datos');
      p2.ok = true; p2.d = 'Funciona: el sistema usará esta conexión en este navegador'; modo = 'jsonp'; pintar();
    } catch (e2) {
      p2.ok = false; p2.d = (e2 && (e2.msg || e2.message)) || String(e2); pintar();
      return fin(false, 'El navegador bloquea la conexión desde este archivo', `Puede ser por dos cosas:<ol style="margin:6px 0 0 18px"><li><b>Code.gs no está actualizado</b> en Apps Script (la conexión alternativa necesita la versión nueva). Pegue el Code.gs nuevo y haga <b>Implementar › Administrar implementaciones › ✏️ › Nueva versión</b>. Luego pruebe otra vez.</li><li>Un bloqueador de anuncios/rastreadores, VPN o antivirus está filtrando a Google. Pruebe con <b>Chrome</b> o <b>Edge</b> sin extensiones.</li></ol>Mientras tanto puede trabajar con el <b>link</b> (/exec): guarda en la computadora y sube solo cuando vuelve el internet.`);
    }
  }

  p = paso('Envío de datos y clave de acceso');
  try {
    const j = await enviar({ action: 'ping' });
    if (j.html !== undefined) { p.ok = false; p.d = j.html; pintar(); return fin(false, 'Google respondió con un error del script', 'La implementación no tiene el <b>Code.gs</b> completo o actualizado. Pegue de nuevo Code.gs, guarde y haga <b>Implementar › Administrar implementaciones › ✏️ › Versión: Nueva versión › Implementar</b>.'); }
    if (j.error === 'AUTH') { p.ok = false; p.d = 'Clave rechazada'; pintar(); return fin(false, 'La clave de acceso no coincide', 'Abra el sistema con el <b>link</b> (/exec), vaya a Configuración › Conexión, copie la <b>Clave de acceso</b> y péguela aquí. Luego pulse Guardar y conectar.'); }
    if (!j.ok) { p.ok = false; p.d = j.error || 'Error'; pintar(); return fin(false, 'Error del servidor', esc(j.msg || j.error || '')); }
    p.ok = true; p.d = 'Clave correcta'; pintar();
  } catch (e) {
    p.ok = false; p.d = String(e && e.message || e); pintar();
    return fin(false, 'La lectura funciona pero el envío falla', 'Casi siempre es porque la implementación es una versión vieja o el script lanzó un error. Pegue de nuevo <b>Code.gs</b>, guarde y haga <b>Implementar › Administrar implementaciones › ✏️ › Versión: Nueva versión › Implementar</b>. Si sigue igual, ejecute <b>instalar</b> otra vez desde el editor.');
  }

  p = paso('Lectura de la información en Drive');
  try {
    const j = await enviar({ action: 'init' });
    if (!j.ok) throw new Error(j.msg || j.error || j.html);
    p.ok = true; p.d = 'Años en Drive: ' + ((j.data && j.data.years) || []).join(', '); pintar();
  } catch (e) { p.ok = false; p.d = String(e && e.message || e); pintar(); return fin(false, 'No se pudo leer Drive', 'Ejecute <b>instalar</b> desde el editor de Apps Script y vuelva a implementar con <b>Nueva versión</b>.'); }

  Sync.transport = modo; LS.set('transport', modo);
  if (url !== Sync.url || token !== Sync.token) { LS.set('apiUrl', url); LS.set('token', token); Sync.configure(); }
  Sync.lastErr = ''; Sync.online = true;
  fin(true, 'Conexión correcta', 'Todo funciona. Se sincronizará ahora mismo.');
  Sync.run(true).then(() => { if (CUR.v === 'cfg:sync') go('cfg:sync'); });
}

  const n = Sync.queued();
  const modoTxt = { gas: 'En línea (Google Apps Script)', http: BOOT.mode === 'web' ? 'Aplicación web (GitHub Pages) conectada a Google' : 'Archivo offline conectado a Google', local: 'Solo local (sin conexión configurada)' }[Sync.mode];
  el.innerHTML = cfgTabs(el, 'cfg:sync') + `<div class="kpis"><div class="kpi"><div class="l">Modo</div><div class="v" style="font-size:15px">${modoTxt}</div></div><div class="kpi ${navigator.onLine ? 'ok' : 'bad'}"><div class="l">Internet</div><div class="v">${navigator.onLine ? 'Conectado' : 'Sin conexión'}</div></div><div class="kpi ${n ? 'warn' : 'ok'}"><div class="l">Cambios sin subir</div><div class="v">${n}</div></div><div class="kpi"><div class="l">Última sincronización</div><div class="v" style="font-size:16px">${Sync.lastOk ? new Date(Sync.lastOk).toLocaleTimeString() : '—'}</div><div class="s">${esc(Sync.lastErr || '')}</div></div></div>
  <div class="bar"><button class="btn pri" id="sN">🔄 Sincronizar ahora</button>${INFO.folderUrl ? `<a class="btn" href="${INFO.folderUrl}" target="_blank">📁 Abrir carpeta en Drive</a>` : ''}<button class="btn" id="sB">🗄️ Respaldo en Drive</button><button class="btn" id="sC">🧹 Compactar eliminados</button><button class="btn" id="sT">✉️ Recordatorios por correo</button><span class="sp"></span><button class="btn danger" id="sR">Reiniciar datos de este equipo</button></div>
  <div class="grid g2">
    <div class="card"><h3>💻 Trabajar sin internet (versión offline)</h3>
      <p>La app <b>siempre</b> guarda primero en este equipo y sube los cambios a Drive cuando hay conexión. Si se cae el internet mientras la tiene abierta, siga trabajando normalmente.</p>
      <p>Para <b>abrir</b> el sistema sin internet, descargue la versión offline: es un archivo .html que guarda en su PC (por ejemplo, en el Escritorio) y abre con Chrome o Edge. Se sincroniza con el mismo Drive cuando vuelve la conexión.</p>
      ${BOOT.mode === 'gas' ? `<button class="btn pri" id="sO">⬇️ Descargar versión offline</button>` : (BOOT.mode === 'web' ? '<div class="alert info">Está usando la aplicación web: se puede instalar desde el navegador (ícono ⊕ de la barra de direcciones) y abre sin internet.</div>' : '<div class="alert info">Usted está usando la versión offline.</div>')}
      <p class="muted" style="font-size:12px;margin-top:8px">Requisito: la implementación web debe tener acceso "Cualquier usuario" (ver guía de instalación). Los datos viajan protegidos por la clave de acceso.</p></div>
    <div class="card"><h3>🔑 Conexión</h3>
      ${BOOT.mode === 'gas' ? `<label class="f"><span>Clave de acceso (para la versión offline y otros equipos)</span><div class="bar" style="margin:0"><input class="in" readonly value="${esc(INFO.token || '(sincronice para verla)')}" id="sTk"><button class="btn" id="sCp">Copiar</button><button class="btn" id="sNt">Generar nueva</button></div></label>
        <label class="f" style="margin-top:10px"><span>Otros usuarios con acceso (correos separados por coma)</span><div class="bar" style="margin:0"><input class="in" id="sU" value="${esc(INFO.users || '')}"><button class="btn" id="sUs">Guardar</button></div></label>
        <p class="muted" style="font-size:12px">Dirección de la app: ${esc(INFO.webAppUrl || '')}</p>`
      : `<label class="f"><span>URL de la aplicación web (termina en /exec)</span><input class="in" id="sUrl" value="${esc(Sync.url)}"></label><label class="f" style="margin-top:8px"><span>Clave de acceso</span><input class="in" id="sTok" value="${esc(Sync.token)}"></label><div class="bar" style="margin-top:10px"><button class="btn pri" id="sSv">Guardar y conectar</button><button class="btn" id="sDg">🩺 Probar conexión</button></div>`}
      <label class="f" style="margin-top:10px"><span>Sincronizar automáticamente cada (segundos)</span><input class="in" type="number" id="sE" value="${CFG.sync.cada}" style="width:120px"></label></div></div>`;
  bindTabs(el);
  $('#sN', el).onclick = async () => { await Sync.run(true); go('cfg:sync'); };
  $('#sB', el).onclick = async () => { try { const r = await Sync.call({ action: 'backup' }); toast(`Respaldo creado (${r.files} archivos) · <a href="${r.url}" target="_blank" style="color:#fff">abrir</a>`, 'ok', 8000); } catch (e) { toast('Requiere conexión', 'bad'); } };
  $('#sC', el).onclick = async () => { if (!(await confirmBox('Borra definitivamente de Drive las filas marcadas como eliminadas (año actual y globales). ¿Continuar?'))) return; try { await Sync.run(); const r = await Sync.call({ action: 'compact', year: Store.year }); toast('Compactado: ' + (Object.entries(r).map(([k, v]) => `${k}: ${v}`).join(', ') || 'nada que borrar'), 'ok', 7000); } catch (e) { toast('Requiere conexión', 'bad'); } };
  $('#sT', el).onclick = triggersModal;
  $('#sE', el).onchange = async e => { CFG.sync.cada = Math.max(15, num(e.target.value)); await saveCfg(true); startAutoSync(); };
  $('#sR', el).onclick = async () => { const n = Sync.queued(); if (!(await confirmBox(`Se borrarán los datos guardados en ESTE equipo y se volverán a descargar de Drive.${n ? ` ⚠ Hay ${n} cambio(s) sin subir que se PERDERÁN.` : ''}`, 'Reiniciar'))) return; await IDB.clearAll(); location.reload(); };
  const so = $('#sO', el); if (so) so.onclick = async () => { const t = toast('Preparando versión offline…', '', 30000); try { const r = await Sync.call({ action: 'offlineHtml' }); t.remove(); downloadBlob(r.html, 'Suministros_Offline.html', 'text/html'); toast(`Descargada. También quedó una copia en su carpeta de Drive. <a href="${r.url}" target="_blank" style="color:#fff">ver</a>`, 'ok', 9000); } catch (e) { t.remove(); toast('No se pudo generar: ' + (e.error || e), 'bad'); } };
  const cp = $('#sCp', el); if (cp) cp.onclick = () => { navigator.clipboard && navigator.clipboard.writeText($('#sTk', el).value); toast('Clave copiada'); };
  const nt = $('#sNt', el); if (nt) nt.onclick = async () => { if (!(await confirmBox('Los equipos con la clave anterior dejarán de sincronizar hasta que ingresen la nueva. ¿Continuar?'))) return; const r = await Sync.call({ action: 'newToken' }); INFO.token = r.token; go('cfg:sync'); };
  const us = $('#sUs', el); if (us) us.onclick = async () => { await Sync.call({ action: 'users', users: $('#sU', el).value }); INFO.users = $('#sU', el).value; toast('Guardado ✔', 'ok'); };
  const sv = $('#sSv', el); if (sv) sv.onclick = async () => { LS.set('apiUrl', limpiarUrl($('#sUrl', el).value)); LS.set('token', $('#sTok', el).value.trim()); Sync.configure(); await Sync.run(true); go('cfg:sync'); };
  const dg = $('#sDg', el); if (dg) dg.onclick = () => diagConexion(limpiarUrl($('#sUrl', el).value), $('#sTok', el).value.trim());
});

/* ======================= ARRANQUE ======================= */
let autoTimer = null;
function startAutoSync() { clearInterval(autoTimer); autoTimer = setInterval(() => { if (Sync.queued() || Date.now() - Sync.lastOk > num(CFG.sync.cada) * 1000) Sync.run(); }, Math.max(15, num(CFG.sync.cada)) * 1000); }

/** Revisa que todos los archivos se hayan copiado completos en Apps Script */
function revisarArchivos() {
  const falta = ['AppCore', 'AppModules', 'AppHome', 'AppReports', 'AppOps', 'AppConfig'].filter(f => !(window.__OK || []).includes(f));
  if (!falta.length) return;
  const d = document.createElement('div'); d.className = 'alert bad'; d.style.cssText = 'position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:99;max-width:640px;box-shadow:0 10px 30px rgba(0,0,0,.4)';
  d.innerHTML = `<b>⚠ El sistema no cargó completo:</b> ${falta.map(f => `<b>${f}</b>`).join(', ')}.<br>En Apps Script, abra ${falta.length > 1 ? 'esos archivos' : 'ese archivo'}, borre todo, vuelva a pegar el contenido completo (debe terminar en <code>&lt;/script&gt;</code>), guarde y haga <b>Implementar › Administrar implementaciones › ✏️ › Nueva versión</b>.${(window.__ERRS || []).length ? `<div style="font-size:12px;margin-top:6px;opacity:.85">Detalle técnico: ${esc(window.__ERRS.join(' · '))}</div>` : ''} <button class="btn sm" style="margin-left:6px">Cerrar</button>`;
  d.querySelector('button').onclick = () => d.remove(); document.body.appendChild(d);
}
/** Primer uso de la aplicación web: pide la dirección de la API (ya puesta) y la clave de acceso de este equipo */
function bienvenidaWeb() {
  modal('👋 Conectar este equipo', `<p style="margin-top:0">Para ver y guardar los datos, este equipo necesita conectarse a su sistema en Google. Solo se hace una vez por equipo y navegador.</p>
    <label class="f"><span>Dirección de la API (Apps Script, termina en /exec)</span><input class="in" id="bwU" value="${esc(Sync.url || BOOT.apiUrl || '')}" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="f" style="margin-top:8px"><span>Clave de acceso · la ve en el sistema actual en Configuración › Conexión</span><input class="in" id="bwT" value="${esc(Sync.token || '')}" placeholder="Pegue aquí la clave" autocomplete="off"></label>
    <p class="muted" style="font-size:12px">La clave se guarda solo en este navegador; nunca se publica.</p>`,
    [{ l: '🩺 Probar conexión', left: 1, fn: () => { diagConexion(limpiarUrl($('#bwU').value), $('#bwT').value.trim()); return false; } }, { l: 'Conectar', pri: 1, fn: () => { const u = limpiarUrl($('#bwU').value), t = $('#bwT').value.trim(); if (!u || !t) { toast('Escriba la dirección y la clave', 'bad'); return false; } LS.set('apiUrl', u); LS.set('token', t); location.reload(); return true; } }], { nofocus: false });
}
async function boot() {
  setTimeout(revisarArchivos, 50);
  await IDB.open() || toast('Este navegador no permite guardar datos locales; se trabajará solo en memoria.', 'bad', 8000);
  CFG = deepMerge(DEFAULT_CFG(), (await IDB.get('cfg')) || {});
  Store.year = Number(await IDB.get('year')) || new Date().getFullYear();
  if (LS.get('dark', false)) document.documentElement.dataset.theme = 'dark';
  Sync.configure(); applyTheme();
  await Store.loadAll();
  renderMenu(); renderYears();
  // eventos de la interfaz
  $('#menu').addEventListener('click', e => {
    const tg = e.target.closest('[data-tg]'); if (tg) { const mg = tg.parentElement; mg.classList.toggle('open'); LS.set('menuOpen', $$('.mg.open').map(x => x.dataset.g)); return; }
    const a = e.target.closest('[data-v]'); if (a) go(a.dataset.v);
  });
  $('#btnMenu').onclick = () => $('#side').classList.toggle('closed');
  $('#yearSel').onchange = async e => { if (e.target.value === 'new') { e.target.value = Store.year; go('cfg:anios'); return; } await switchYear(Number(e.target.value)); };
  $('#sync').onclick = () => Sync.run(true);
  $('#btnTheme').onclick = () => { LS.set('dark', !LS.get('dark', false)); applyTheme(); };
  $('#pvPrint').onclick = () => window.print(); $('#pvCols').onclick = () => Print.chooseCols(); $('#pvClose').onclick = () => Print.close(); $('#pvDrive').onclick = () => Print.drive();
  window.addEventListener('online', () => { Sync.online = true; Sync.updateUI(); Sync.run(); });
  window.addEventListener('offline', () => { Sync.online = false; Sync.updateUI(); });
  window.addEventListener('beforeunload', e => { if (Sync.queued() && Sync.mode !== 'local' && navigator.onLine) { Sync.run(); } });
  /* Cambios que llegan de otro equipo: se muestran solos, sin botones. Si en ese momento está
     escribiendo, tiene un formulario abierto o cambios sin guardar en la pantalla, se espera a que termine. */
  Bus.on('remote', () => { remotoPendiente = true; aplicarRemoto(); });
  Bus.on('remote', () => { NB.badge(); });
  setInterval(aplicarRemoto, 1500);
  $('#view').addEventListener('input', e => { if (!e.target.closest('.bar') && !e.target.closest('#lsel') && !e.target.matches('#lq,[data-ck],#lckAll')) vistaSucia = true; });
  if (window.__SEED && (!(await IDB.all('rows')).length || (window.__SEED.ver && (await IDB.get('seedVer')) !== window.__SEED.ver))) { await IDB.set('seedVer', window.__SEED.ver || ''); await restaurarRespaldo(window.__SEED, true); toast('Datos de demostración cargados (versión ' + (window.__SEED.ver || '') + ')', 'ok', 5000); }
  { const n = await asignarSeries(false); if (n) toast(`Se asignó serie a ${n} recibo(s) (A: 1–27, resto B)`, 'ok', 6000); }
  NB.boton(); CALCU.boton();
  go('home');
  setInterval(tickClock, 1000); tickClock();
  setInterval(() => Notif.check(), 20000); setTimeout(() => Notif.check(), 1500);
  Sync.updateUI();
  if (BOOT.mode === 'web' && (!Sync.url || !Sync.token)) { bienvenidaWeb(); }
  if (Sync.mode !== 'local') {
    try {
      INFO = await Sync.call({ action: 'init' });
      Store.years = INFO.years || []; renderYears();
      if (INFO.config && num(INFO.config._upd) > num(CFG._upd)) { CFG = deepMerge(DEFAULT_CFG(), INFO.config); await IDB.set('cfg', CFG); invalidateFields(); applyTheme(); renderMenu(); go(CUR.v, CUR.p); }
      else if (!INFO.config) await IDB.set('cfgDirty', true);
      $('#sideUser').textContent = INFO.email || '';
    } catch (e) { if (e && e.error === 'AUTH') askToken(); }
    await Sync.run();
  }
  startAutoSync();
  seedPlantillas();
}
document.addEventListener('DOMContentLoaded', boot);

window.__OK = (window.__OK || []).concat('AppConfig');
</script>

<script>
/* =================================================================
   CAJA CHICA · COMPRAS · BODEGA · UNIFORMES · DOCUMENTOS
   ================================================================= */

/* ---------- CAJA CHICA: PANEL ---------- */
defView('c:panel', 'Caja chica · panel de control', el => {
  const rows = Store.all('cajachica'); const x = prepCaja(rows);
  const fondo = num(CFG.caja.fondo);
  const act = rows.filter(r => cv(r, 'cajaN') === x.caja);
  const gastAct = act.reduce((s, r) => s + num(r.haber), 0);
  const fechas = act.map(r => toYMD(r.fecha)).filter(Boolean).sort();
  const dias = fechas.length ? Math.max(1, Math.round((dobj(today()) - dobj(fechas[0])) / 86400000) + 1) : 0;
  const ritmo = dias ? gastAct / dias : 0; const agota = ritmo ? Math.floor(x.saldo / ritmo) : 0;
  const totAnio = rows.reduce((s, r) => s + num(r.haber), 0);
  const cerradas = Math.max(0, x.caja - 1);
  const porCat = {}; rows.forEach(r => { if (!num(r.haber)) return; const c = r.categoria || 'Sin categoría'; (porCat[c] = porCat[c] || { act: 0, tot: 0 }); porCat[c].tot += num(r.haber); if (cv(r, 'cajaN') === x.caja) porCat[c].act += num(r.haber); });
  const prov = {}; rows.forEach(r => { if (!num(r.haber) || !r.proveedor) return; (prov[r.proveedor] = prov[r.proveedor] || { t: 0, n: 0 }); prov[r.proveedor].t += num(r.haber); prov[r.proveedor].n++; });
  const alertas = rows.filter(r => cv(r, 'alertas'));
  const bajo = fondo && x.saldo <= fondo * num(CFG.caja.alertaPct);
  const k = (l, v, s, cls) => `<div class="kpi ${cls || ''}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s || ''}</div></div>`;
  el.innerHTML = `<div class="bar"><button class="btn pri" id="ccN">+ Registrar gasto</button><button class="btn" id="ccR">🧾 Generar recibo</button><button class="btn" id="ccE">📤 Solicitud de reembolso</button><button class="btn" id="ccA">🪙 Arqueo</button><span class="sp"></span><span class="muted">Fondo ${money(fondo)} · Límite por compra ${money(CFG.caja.limite)}</span></div>
  ${bajo ? `<div class="alert bad">⚠ Saldo bajo: quedan ${money(x.saldo)} (${pct(x.saldo, fondo)} del fondo). Es momento de solicitar el reembolso de la caja C${x.caja}.</div>` : ''}
  <div class="kpis">${k('Caja actual', 'C' + x.caja, fechas.length ? 'desde el ' + flong(fechas[0]) : '')}${k('Saldo en caja', money(x.saldo), 'efectivo que debe haber', bajo ? 'bad' : 'ok')}${k('Gastado en esta caja', money(gastAct), pct(gastAct, fondo) + ' del fondo')}
    ${k('A solicitar en reembolso', money(fondo - x.saldo), 'para volver a ' + money(fondo))}${k('Próximo N° de recibo', siguienteReciboCC(), 'recibos sin factura')}
    ${k('Gasto diario promedio', money(ritmo), dias + ' día(s) de esta caja')}${k('Días para agotar saldo', agota || '—', agota ? 'aprox. ' + fdate(addDays(today(), agota)) : '')}
    ${k('Gasto total del año', money(totAnio), Store.year)}${k('Cajas reembolsadas', cerradas, cerradas ? 'prom. ' + money(rows.filter(r => cv(r, 'cajaN') < x.caja).reduce((s, r) => s + num(r.haber), 0) / cerradas) + ' por caja' : '')}</div>
  <div class="grid g2"><div class="card"><h3>Gasto por categoría</h3><table class="t"><thead><tr><th>Categoría</th><th class="r">Caja actual</th><th class="r">Acumulado</th><th class="r">%</th></tr></thead><tbody>
    ${Object.entries(porCat).sort((a, b) => b[1].tot - a[1].tot).map(([c, v]) => `<tr><td>${esc(c)}</td><td class="num">${money(v.act)}</td><td class="num">${money(v.tot)}</td><td class="num">${pct(v.tot, totAnio)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin gastos</td></tr>'}</tbody></table></div>
  <div class="card"><h3>Top 5 proveedores</h3><table class="t"><thead><tr><th>Proveedor</th><th class="r">Total</th><th class="r">Compras</th></tr></thead><tbody>
    ${Object.entries(prov).sort((a, b) => b[1].t - a[1].t).slice(0, 5).map(([p, v]) => `<tr><td>${esc(p)}</td><td class="num">${money(v.t)}</td><td class="num">${v.n}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Sin datos</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3>Registros con alertas <small>(${alertas.length})</small></h3>${alertas.length ? `<table class="t"><tbody>${alertas.slice(0, 50).map(r => `<tr data-id="${r._id}" style="cursor:pointer"><td>${fdate(r.fecha)}</td><td>${esc(r.concepto)}</td><td>${esc(r.proveedor || '')}</td><td class="num">${money(r.haber)}</td><td><span class="tag warn">${esc(cv(r, 'alertas'))}</span></td></tr>`).join('')}</tbody></table>` : '<div class="alert ok" style="margin:0">✔ Sin alertas</div>'}</div>`;
  $('#ccN', el).onclick = () => openForm('cajachica', null, { onDone: () => go('c:panel') });
  $('#ccR', el).onclick = () => go('c:recibo'); $('#ccE', el).onclick = () => go('c:reembolso'); $('#ccA', el).onclick = () => go('c:arqueo');
  $$('tr[data-id]', el).forEach(tr => tr.onclick = () => openForm('cajachica', Store.get('cajachica', tr.dataset.id), { onDone: () => go('c:panel') }));
});

/* ---------- CAJA CHICA: REEMBOLSO ---------- */
defView('c:reembolso', 'Solicitud de reembolso de caja chica', el => {
  const rows = Store.all('cajachica'); const x = prepCaja(rows);
  let caja = x.caja;
  const draw = () => {
    const gs = rows.filter(r => cv(r, 'cajaN') === caja && num(r.haber)).sort((a, b) => String(a.fecha).localeCompare(b.fecha));
    const tot = gs.reduce((s, r) => s + num(r.haber), 0);
    const f = gs.map(r => toYMD(r.fecha));
    const cat = {}; gs.forEach(r => cat[r.categoria || 'Sin categoría'] = (cat[r.categoria || 'Sin categoría'] || 0) + num(r.haber));
    el.innerHTML = `<div class="bar"><label class="f"><span>Caja</span><select class="in" id="rC">${Array.from({ length: x.caja }, (_, i) => i + 1).map(n => `<option value="${n}" ${n === caja ? 'selected' : ''}>C${n}${n === x.caja ? ' (actual)' : ''}</option>`).join('')}</select></label>
      <label class="f"><span>Fecha de solicitud</span><input class="in" type="date" id="rF" value="${today()}"></label><span class="sp"></span><button class="btn pri" id="rP">🖨️ Imprimir solicitud</button></div>
      <div class="alert info">Caja C${caja} · ${gs.length} comprobante(s) · Período ${fdate(f[0]) || '—'} al ${fdate(f[f.length - 1]) || '—'} · <b>Total a reembolsar: ${money(tot)}</b></div>
      <div class="tw"><table class="t"><thead><tr><th>N°</th><th>Fecha</th><th>Comprobante</th><th>N° documento</th><th>Concepto</th><th>Proveedor</th><th>Categoría</th><th class="r">Valor</th></tr></thead><tbody>
      ${gs.map((r, i) => `<tr><td>${i + 1}</td><td>${fdate(r.fecha)}</td><td>${esc(r.comprobante || '')}</td><td>${esc(r.documento || '')}</td><td>${esc(r.concepto)}</td><td>${esc(r.proveedor || '')}</td><td>${esc(r.categoria || '')}</td><td class="num">${money(r.haber)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="7">TOTAL</td><td class="num">${money(tot)}</td></tr></tfoot></table></div>`;
    $('#rC', el).onchange = e => { caja = Number(e.target.value); draw(); };
    $('#rP', el).onclick = () => Print.show('Reembolso caja chica C' + caja, `<div class="page">${membrete()}<div class="ptitle">SOLICITUD DE REEMBOLSO DE CAJA CHICA</div>
      <table style="font-size:11.5px;margin:6px 0 10px"><tr><td><b>Caja:</b> C${caja}</td><td><b>Solicitud N°:</b> ${caja}</td><td><b>Fecha de solicitud:</b> ${fdate($('#rF', el).value)}</td></tr><tr><td colspan="3"><b>Período:</b> Del ${fdate(f[0])} al ${fdate(f[f.length - 1])}</td></tr></table>
      ${ptable([{ l: 'N°', w: '24px' }, { l: 'Fecha', w: '62px' }, 'Comprobante', 'N° documento', 'Concepto', 'Proveedor / nombre', 'Categoría', { l: 'Valor', w: '60px' }], gs.map((r, i) => `<tr><td class="c">${i + 1}</td><td>${fdate(r.fecha)}</td><td>${esc(r.comprobante || '')}</td><td style="font-size:9px">${esc(r.documento || '')}</td><td>${esc(r.concepto)}</td><td>${esc(r.proveedor || '')}</td><td>${esc(r.categoria || '')}</td><td class="r">${money(r.haber)}</td></tr>`), { foot: `<tr class="tot"><td colspan="7">TOTAL A REEMBOLSAR</td><td class="r">${money(tot)}</td></tr>` })}
      <p><b>Son:</b> ${numLetras(tot)}</p>
      <div style="width:55%"><b>Resumen por categoría</b>${ptable(['Categoría', 'Monto'], Object.entries(cat).map(([c, v]) => `<tr><td>${esc(c)}</td><td class="r">${money(v)}</td></tr>`))}</div>
      ${firmasDoc('reembolso')}</div>`);
  };
  draw();
});

/* ---------- CAJA CHICA: RECIBO SIN FACTURA ---------- */
function siguienteReciboCC(fecha) {
  const d = dobj(fecha || today()); const pre = (CFG.caja.prefijo || 'RC') + String(d.getFullYear()).slice(2) + pad2(d.getMonth() + 1);
  const usados = Store.all('cajachica').map(r => String(r.documento || '')).filter(s => s.startsWith(pre)).map(s => num(s.slice(pre.length)));
  const loc = LS.get('rcEmitidos', []).filter(s => s.startsWith(pre)).map(s => num(s.slice(pre.length)));
  return pre + pad2(Math.max(0, ...usados, ...loc) + 1);
}
/* Recibo RC con el formato oficial de caja chica (igual al Excel A01 CAJA CHICA) */
const tituloCase = t => String(t || '').toLowerCase().replace(/(^|\s)(\p{L})/gu, (m, a, c) => a + c.toUpperCase());
function firmantesRecibo() {
  const ks = (CFG.firmasDoc && CFG.firmasDoc.recibocc && CFG.firmasDoc.recibocc.length) ? CFG.firmasDoc.recibocc : ['concejal_maestros', 'presidente', 'tesorero'];
  return ks.map(firmante).filter(Boolean);
}
function reciboRCHtml(d, marca) {
  const i = CFG.inst, bruto = num(d.bruto), isss = num(d.isss), afp = num(d.afp), renta = d.renta ? r2(bruto * num(CFG.caja.renta || 0.1)) : 0;
  const liq = r2(bruto - isss - afp - renta), dash = v => v ? money(v) : '-';
  const ln = 'border-bottom:1px solid #000';
  const fs = firmantesRecibo();
  return `<div class="page rcpage" style="font:11px/1.35 Arial,Helvetica,sans-serif;padding-top:16mm">
    ${marca ? `<div style="position:absolute;top:9mm;right:14mm;font-size:9px;font-weight:700;letter-spacing:2px;color:#666;border:1px solid #999;padding:2px 8px;border-radius:3px">${marca}</div>` : ''}
    <div style="text-align:center;line-height:1.75">${i.dependencia ? `<div style="font-weight:700;font-size:11.5px">${esc(i.dependencia)}</div>` : ''}
      <div style="font-weight:700;font-size:13.5px">${esc(i.nombre)}</div>
      <div style="font-size:9.5px">${esc(String(i.lugar || '').toUpperCase())}${i.telefono ? ', TEL. ' + esc(i.telefono) : ''}</div>
      <div style="font-size:9.5px">${esc(i.direccion || '')}</div>
      ${i.codigo ? `<div style="font-size:9.5px">Código de Infraestructura: ${esc(i.codigo)}</div>` : ''}</div>
    <div style="border-bottom:2px solid #1f4e9c;margin:6px 0 18px"></div>
    <table style="margin-left:auto;border-collapse:collapse;font-size:12.5px"><tr><td style="text-align:right;font-weight:700;padding:10px 6px 2px">RECIBO N°</td><td style="border:1px solid #bbb;width:190px;text-align:center;font-weight:700;color:#d00000;font-size:14px;padding:6px">${esc(d.numero || '')}</td></tr>
      <tr><td style="text-align:right;font-weight:700;padding:2px 6px">RECIBO POR:</td><td style="border:1px solid #bbb;text-align:center;font-weight:700;padding:3px">${money(bruto)}</td></tr></table>
    <p style="margin:18px 0 0">Recibí del ${esc(tituloCase(i.organismo || 'Consejo Directivo Escolar'))} del: ${esc(i.nombre)}</p>
    <p style="margin:12px 0 0">Ubicado en: ${esc(i.lugar || '')}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Departamento de: ${esc(tituloCase(i.departamento || ''))}.</p>
    <div style="display:flex;margin-top:46px;align-items:flex-end"><b style="width:125px;flex:none">La cantidad de:</b><b style="flex:1;${ln};padding-bottom:1px">${bruto ? (bruto >= 1000000 ? '(escribir a mano)' : numLetras(bruto)) : '&nbsp;'}</b></div>
    <p style="margin:26px 0 0"><b>En concepto de:</b></p>
    <div style="min-height:52px;${ln};white-space:pre-wrap">${esc(d.concepto || '')}</div>
    <p style="margin:18px 0 4px">De dicho monto se han realizado las siguientes deducciones:</p>
    <table style="width:85%;margin-left:62px;border-collapse:collapse;font-size:11px">
      <tr><td style="padding:1px 0">Monto:</td><td style="width:120px;text-align:right;${ln}">${money(bruto)}</td></tr>
      <tr><td style="padding:1px 0">ISSS:</td><td style="text-align:right;${ln}">${dash(isss)}</td></tr>
      <tr><td style="padding:1px 0">AFP:</td><td style="text-align:right;${ln}">${dash(afp)}</td></tr>
      <tr><td style="padding:1px 0;${ln}">(En caso de que aplique) Menos 10% de renta:</td><td style="text-align:right;${ln}">${dash(renta)}</td></tr>
      <tr><td style="padding:1px 0"><b>LÍQUIDO RECIBIDO:</b></td><td style="text-align:right"><b>${money(liq)}</b></td></tr></table>
    <div style="display:flex;margin-top:20px;align-items:flex-end"><b style="width:125px;flex:none">Lugar y Fecha:</b><span style="flex:1;${ln}">${d.fecha ? esc(CFG.inst.lugar) + ', ' + flong(d.fecha) : '&nbsp;'}</span></div>
    <div style="display:flex;margin-top:62px;gap:20px">
      <div style="flex:1.1"><div>F. ______________________________</div><div style="font-weight:700;margin-top:4px">${esc(String(d.nombre || '').toUpperCase()) || '&nbsp;'}</div><div style="font-size:9px;color:#666">Firma y nombre del Suministrante</div></div>
      <div style="flex:1"><div style="display:flex;align-items:flex-end"><span style="width:118px;flex:none">N° DUI o NIT:</span><span style="flex:1;${ln};text-align:center">${esc(d.dui || '') || '&nbsp;'}</span></div>
        <div style="display:flex;align-items:flex-end;margin-top:4px"><span style="width:118px;flex:none">Fecha de emisión:</span><span style="flex:1;${ln};text-align:center">${d.emision ? fdate(d.emision) : '&nbsp;'}</span></div></div></div>
    <div style="display:flex;margin-top:22px;align-items:flex-end"><span style="width:125px;flex:none">Dirección y teléfono:</span><span style="flex:1;${ln}">${esc(d.direccion || '') || '&nbsp;'}</span></div>
    <div style="display:flex;justify-content:space-around;margin-top:70px;text-align:center;font-size:9.5px;gap:14px">${fs.map(f => `<div style="flex:1"><div style="font-size:10.5px">F. ____________________</div><div style="font-weight:700;margin-top:4px">${esc(f.nombre || '')}</div><div>${esc(f.cargo || '')}</div></div>`).join('')}</div>
  </div>`;
}
/** Original y copia en páginas separadas */
function reciboRCPaginas(d, copias) { return copias === 'ambos' ? reciboRCHtml(d, 'ORIGINAL') + reciboRCHtml(d, 'COPIA') : reciboRCHtml(d, ''); }
/** Arma los datos del recibo a partir de una fila del registro de caja chica */
function datosReciboDeFila(r) {
  let x = {}; try { x = typeof r.rc === 'string' ? JSON.parse(r.rc || '{}') : (r.rc || {}); } catch (e) { }
  const p = Store.all('proveedores').find(q => norm(q.nombre) === norm(r.proveedor)) || {};
  return { id: r._id, numero: r.documento || '', fecha: toYMD(r.fecha) || today(), nombre: r.proveedor || '', concepto: x.concepto || r.concepto || '',
    bruto: x.bruto !== undefined && x.bruto !== '' ? x.bruto : num(r.haber), isss: x.isss || '', afp: x.afp || '', renta: !!x.renta,
    dui: x.dui || p.dui_nit || '', emision: toYMD(x.emision || p.fecha_emision) || '', direccion: x.direccion || [p.direccion, p.telefono].filter(Boolean).join(' · ') };
}
const esReciboRC = r => /RECIBO/i.test(r.comprobante || '') || String(r.documento || '').toUpperCase().startsWith(String(CFG.caja.prefijo || 'RC').toUpperCase());
function imprimirReciboRC(r) {
  const d = datosReciboDeFila(r);
  const sel = LS.get('rcCopias', 'ambos');
  modal(`🧾 Recibo ${esc(d.numero)}`, `<p style="margin-top:0"><b>${esc(d.nombre)}</b> · ${money(d.bruto)} · ${fdate(d.fecha)}<br><span class="muted">${esc(d.concepto)}</span></p>
    <label class="f"><span>Imprimir</span><select class="in" id="rcC"><option value="orig" ${sel === 'orig' ? 'selected' : ''}>Solo original (1 página)</option><option value="ambos" ${sel === 'ambos' ? 'selected' : ''}>Original y copia (2 páginas)</option></select></label>
    ${!d.dui || !d.direccion ? `<p class="muted" style="font-size:12px">Faltan datos del suministrante (DUI, dirección). Use <b>Editar recibo</b> para completarlos; se guardan en el directorio.</p>` : ''}`,
    [{ l: '✎ Editar recibo', left: 1, fn: () => { closeModal(); go('c:recibo', { id: r._id }); return false; } }, { l: 'Cancelar' },
     { l: '🖨️ Generar recibo', pri: 1, fn: () => { const c = $('#rcC').value; LS.set('rcCopias', c); Print.show('Recibo ' + d.numero, reciboRCPaginas(d, c)); return true; } }]);
}
defView('c:recibo', 'Recibo (transporte o sin factura)', (el, p = {}) => {
  const fila = p.id ? Store.get('cajachica', p.id) : null;
  const st = fila ? datosReciboDeFila(fila) : { id: '', numero: siguienteReciboCC(), fecha: today(), nombre: '', dui: '', emision: '', direccion: '', concepto: '', bruto: '', isss: '', afp: '', renta: false };
  st.categoria = (fila && fila.categoria) || '07 VIÁTICOS'; st.copias = LS.get('rcCopias', 'ambos');
  el.innerHTML = `<div class="grid g2"><div class="card"><h3>Datos del recibo</h3>
    <div id="kEst" class="alert ${fila ? 'ok' : 'info'}" style="margin:0 0 10px"></div><div class="form">
    <label class="f"><span>N° de recibo · escriba uno existente para reimprimir</span><input class="in" id="k_numero" value="${esc(st.numero)}" style="font-weight:700;color:#c00"></label><label class="f"><span>Fecha</span><input class="in" type="date" id="k_fecha" value="${esc(st.fecha)}"></label>
    <label class="f wide"><span>Nombre del suministrante (busca en el directorio)</span><input class="in" id="k_nombre" value="${esc(st.nombre)}"></label>
    <label class="f"><span>N° DUI o NIT</span><input class="in" id="k_dui" value="${esc(st.dui)}"></label><label class="f"><span>Fecha de emisión DUI/NIT</span><input class="in" type="date" id="k_emision" value="${esc(st.emision)}"></label>
    <label class="f wide"><span>Dirección y teléfono</span><input class="in" id="k_direccion" value="${esc(st.direccion)}"></label>
    <label class="f wide"><span>En concepto de</span><textarea class="in" id="k_concepto" rows="3">${esc(st.concepto)}</textarea></label>
    <label class="f"><span>Monto $</span><input class="in" type="number" step="any" id="k_bruto" value="${esc(st.bruto)}"></label>
    <label class="f"><span>ISSS $</span><input class="in" type="number" step="any" id="k_isss" value="${esc(st.isss)}"></label><label class="f"><span>AFP $</span><input class="in" type="number" step="any" id="k_afp" value="${esc(st.afp)}"></label>
    <div style="align-self:end"><label class="chk" title="Aplica a pagos por SERVICIOS a personas naturales sin factura (mano de obra, ayuda en cocina, transporte contratado). La compra de bienes no lleva retención."><input type="checkbox" id="k_renta" ${st.renta ? 'checked' : ''}> Retener 10% de renta ⓘ</label></div>
    <label class="f"><span>Categoría (al registrar)</span><select class="in" id="k_categoria">${lista('cc_categorias').map(c => `<option ${c === st.categoria ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
    <label class="f"><span>Imprimir</span><select class="in" id="k_copias"><option value="orig" ${st.copias === 'orig' ? 'selected' : ''}>Solo original (1 página)</option><option value="ambos" ${st.copias === 'ambos' ? 'selected' : ''}>Original y copia (2 páginas)</option></select></label>
    </div><div class="alert info" id="kTot" style="margin-top:12px"></div>
    <div class="bar"><span class="sp"></span><button class="btn" id="kP">🖨️ Generar recibo</button><button class="btn pri" id="kS"></button></div></div>
    <div><div class="pv-mini" id="kPrev"></div></div></div>`;
  const leer = () => { ['numero', 'fecha', 'nombre', 'dui', 'emision', 'direccion', 'concepto', 'bruto', 'isss', 'afp', 'categoria', 'copias'].forEach(k => st[k] = $('#k_' + k, el).value); st.renta = $('#k_renta', el).checked; };
  const neto = () => r2(num(st.bruto) - num(st.isss) - num(st.afp) - (st.renta ? r2(num(st.bruto) * num(CFG.caja.renta || 0.1)) : 0));
  const estado = () => {
    $('#kEst', el).className = 'alert ' + (st.id ? 'ok' : 'info');
    $('#kEst', el).innerHTML = st.id ? '✔ Encontrado en el registro de caja chica: los datos se cargaron solos. Puede corregirlos antes de imprimir.' : `✎ Recibo nuevo. Siguiente disponible: <b>${siguienteReciboCC(st.fecha)}</b>. Al registrarlo queda en caja chica con este número.`;
    $('#kS', el).textContent = st.id ? '💾 Guardar cambios en el registro' : '💾 Registrar en caja chica';
  };
  const upd = () => { leer(); const r = st.renta ? r2(num(st.bruto) * num(CFG.caja.renta || 0.1)) : 0; $('#kTot', el).innerHTML = `Líquido a entregar: <b>${money(neto())}</b>${r ? ` · renta retenida ${money(r)}` : ''} · ${numLetras(num(st.bruto))}`; $('#kPrev', el).innerHTML = reciboRCHtml(st, st.copias === 'ambos' ? 'ORIGINAL' : ''); estado(); };
  const cargar = d => { Object.assign(st, d); ['fecha', 'nombre', 'dui', 'emision', 'direccion', 'concepto', 'bruto', 'isss', 'afp'].forEach(k => $('#k_' + k, el).value = st[k] ?? ''); $('#k_renta', el).checked = !!st.renta; upd(); };
  attachAC($('#k_nombre', el), REF.proveedores, it => { const q = it.row; $('#k_dui', el).value = q.dui_nit || ''; $('#k_emision', el).value = toYMD(q.fecha_emision); $('#k_direccion', el).value = [q.direccion, q.telefono].filter(Boolean).join(' · '); upd(); });
  el.addEventListener('input', debounce(upd, 120)); el.addEventListener('change', upd);
  $('#k_numero', el).addEventListener('change', () => {
    const n = $('#k_numero', el).value.trim().toUpperCase(); $('#k_numero', el).value = n;
    const r = Store.all('cajachica').find(x => String(x.documento || '').toUpperCase() === n);
    if (r) cargar(datosReciboDeFila(r)); else if (st.id) { st.id = ''; upd(); }
  });
  $('#k_fecha', el).addEventListener('change', () => { if (!st.id) $('#k_numero', el).value = siguienteReciboCC($('#k_fecha', el).value); upd(); });
  $('#kP', el).onclick = () => { upd(); LS.set('rcCopias', st.copias); const e = LS.get('rcEmitidos', []); if (!e.includes(st.numero)) { e.push(st.numero); LS.set('rcEmitidos', e.slice(-200)); } Print.show('Recibo ' + st.numero, reciboRCPaginas(st, st.copias)); };
  $('#kS', el).onclick = async () => {
    upd(); if (!st.nombre || !num(st.bruto)) return toast('Complete nombre y monto', 'bad');
    const rc = JSON.stringify({ bruto: num(st.bruto), isss: num(st.isss), afp: num(st.afp), renta: st.renta, dui: st.dui, emision: st.emision, direccion: st.direccion });
    const base = { fecha: st.fecha, documento: st.numero, concepto: String(st.concepto).toUpperCase(), proveedor: st.nombre, haber: neto(), rc };
    if (st.id) {
      const old = Store.get('cajachica', st.id); await Store.save('cajachica', Object.assign({}, old, base, { categoria: st.categoria || old.categoria }));
      toast(`Recibo ${st.numero} actualizado ✔`, 'ok');
    } else {
      if (Store.all('cajachica').some(r => r.documento === st.numero) && !(await confirmBox(`El recibo ${st.numero} ya está en el registro. ¿Registrar otra vez?`))) return;
      const s = await Store.save('cajachica', Object.assign({ orden: nuevoOrden(), tipo: 'GASTO', categoria: st.categoria, comprobante: '03 RECIBO', notas: num(st.bruto) !== neto() ? `Bruto ${money(st.bruto)}; deducciones ${money(num(st.bruto) - neto())}` : '' }, base));
      st.id = s._id; toast(`Recibo ${st.numero} registrado en caja chica ✔`, 'ok');
    }
    const pv = Store.all('proveedores').find(q => norm(q.nombre) === norm(st.nombre));
    if (!pv) await Store.save('proveedores', { nombre: st.nombre, dui_nit: st.dui, fecha_emision: st.emision, direccion: st.direccion });
    else if ((!pv.dui_nit && st.dui) || (!pv.fecha_emision && st.emision) || (!pv.direccion && st.direccion)) await Store.save('proveedores', Object.assign({}, pv, { dui_nit: pv.dui_nit || st.dui, fecha_emision: pv.fecha_emision || st.emision, direccion: pv.direccion || st.direccion }));
    upd();
  };
  upd();
});

function kardex(a) {

function filasStock(soloCon) {
  const g = stockUniformes(), out = [];
  const ps = productos(), vistos = new Set();
  ps.forEach(p => p.tallas.forEach(t => { const k = norm(p.l) + '|' + norm(t.t); vistos.add(k); const x = g[k] || { sinDatos: true, tipo: p.l, talla: t.t, ev: [], fisica: 0, entradas: 0, salidas: 0, porEntregar: 0, vendidoDesde: 0, disp: 0, costo: num(t.c), precio: num(t.p) }; out.push(x); }));
  Object.keys(g).forEach(k => { if (!vistos.has(k)) out.push(g[k]); });
  return soloCon ? out.filter(x => x.fisica || x.porEntregar || x.ev.length) : out;
}

function kardexUniforme(tipo, talla, done) {
  const x = stockUniformes()[norm(tipo) + '|' + norm(talla)];
  const ev = x ? x.ev : [];
  modal(`Kardex · ${esc(tipo)} talla ${esc(talla)}`, `${ev.length ? `<div class="tw" style="max-height:55vh"><table class="t"><thead><tr><th>Fecha</th><th>Movimiento</th><th>Documento</th><th class="r">Entra</th><th class="r">Sale</th><th class="r">Saldo</th></tr></thead><tbody>
    ${ev.map(e => `<tr ${e.mod === 'unif_inv' ? `data-mid="${e.id}" style="cursor:pointer" title="Editar"` : ''}><td>${fdate(e.fecha)}</td><td>${e.s === '=' ? '📋 ' : ''}${esc(e.que)}</td><td>${esc(e.doc)}</td><td class="num">${e.s === '+' ? nfmt(e.q) : e.s === '=' ? `<span class="muted">conteo: ${nfmt(e.q)}</span>` : ''}</td><td class="num">${e.s === '-' ? nfmt(e.q) : ''}</td><td class="num"><b>${nfmt(e.saldo)}</b></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Sin movimientos todavía.</div>'}
    ${x && x.porEntregar ? `<p class="warn-t" style="margin-top:8px">Además hay ${x.porEntregar} unidad(es) vendidas sin entregar → disponible ${x.disp}.</p>` : ''}`,
    [{ l: '+ Movimiento', left: 1, fn: () => { closeModal(); openForm('unif_inv', { tipo, talla, fecha: today() }, { onDone: done }); return false; } }, { l: 'Cerrar', pri: 1 }]);
  $$('#modal tr[data-mid]').forEach(tr => tr.onclick = () => { const r = Store.get('unif_inv', tr.dataset.mid); if (r) { closeModal(); openForm('unif_inv', r, { onDone: done }); } });
}
function conteoUniformes(done) {
  const g = stockUniformes(), ps = productos();
  if (!ps.length) return toast('Primero configure los productos en Configuración › Uniformes y tallas', 'bad');
  modal('📋 Registrar existencia actual (conteo físico)', `<p class="muted" style="margin-top:0">Escriba cuántas unidades hay <b>físicamente</b> de cada talla. Deje vacío lo que no contó. Lo que escriba reemplaza la existencia de esa talla desde la fecha indicada; las ventas posteriores se descuentan solas.</p>
    <label class="f" style="max-width:200px"><span>Fecha del conteo</span><input type="date" class="in" id="cfF" value="${today()}"></label>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:10px">${ps.map((p, pi) => `<div class="card" style="padding:10px"><b>${esc(p.l)}</b><table class="t" style="margin-top:6px"><thead><tr><th>Talla</th><th class="r">Sistema</th><th style="width:90px">Contado</th></tr></thead><tbody>
      ${p.tallas.map(t => { const x = g[norm(p.l) + '|' + norm(t.t)]; return `<tr><td>${esc(t.t)}</td><td class="num muted">${x && (x.hayConteo || x.entradas) ? nfmt(x.fisica) : '—'}</td><td><input type="number" min="0" step="1" class="in" style="padding:4px 6px" data-p="${esc(p.l)}" data-t="${esc(t.t)}"></td></tr>`; }).join('')}</tbody></table></div>`).join('')}</div>`,
    [{ l: 'Cancelar' }, { l: '💾 Guardar conteo', pri: 1, fn: async () => {
      const f = $('#cfF').value || today(), rows = [];
      $$('#modal input[data-p]').forEach(i => { if (i.value === '') return; const x = g[norm(i.dataset.p) + '|' + norm(i.dataset.t)]; const q = num(i.value); if (x && x.hayConteo && x.fisica === q) return; rows.push({ fecha: f, mov: 'CONTEO FÍSICO', tipo: i.dataset.p, talla: i.dataset.t, cantidad: q, doc: 'Conteo ' + fdate(f) }); });
      if (!rows.length) { toast('No escribió ninguna cantidad nueva'); return false; }
      rows.forEach(r => { const p = precioDe(r.tipo, r.talla); if (p) r.costo = p.costo; });
      await Store.saveMany('unif_inv', rows); toast(`Conteo guardado: ${rows.length} talla(s) ✔`, 'ok'); done && done(); return true; } }]);

      <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center"><span class="muted" style="font-size:12px">Insertar campo:</span>${camposStd.map(c => `<button type="button" class="btn sm" data-ins="${c}">{{${c}}}</button>`).join('')}<input class="in" data-nuevo placeholder="campo nuevo…" style="width:130px;padding:4px 8px"><button type="button" class="btn sm" data-insn>+ insertar</button></div>
      <label class="f" style="margin-top:8px"><span>Firmas al pie (una por línea: Nombre | Cargo)</span><textarea class="in" data-k="firmas" rows="3">${esc(x.firmas)}</textarea></label></div>`).join('');
    $$('[data-ii]', L).forEach(c => {
      const ta = $('[data-k=contenido]', c);
      const ins = v => { const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a; ta.value = ta.value.slice(0, a) + `{{${v}}}` + ta.value.slice(b); ta.focus(); ta.selectionStart = ta.selectionEnd = a + v.length + 4; };
      $$('[data-ins]', c).forEach(b => b.onmousedown = e => { e.preventDefault(); ins(b.dataset.ins); });
      $('[data-insn]', c).onmousedown = e => { e.preventDefault(); const v = norm($('[data-nuevo]', c).value).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); if (v) ins(v); };
    });
  };
  $('#ipF').onchange = async e => {
    leerEd(); items = items.filter(x => x.contenido.trim());
    for (const f of Array.from(e.target.files)) {
      try {
        let txt = /\.docx$/i.test(f.name) ? await docxTexto(await f.arrayBuffer()) : await f.text();
        if (/\.html?$/i.test(f.name)) { const d = new DOMParser().parseFromString(txt, 'text/html'); d.querySelectorAll('p,div,br,li,h1,h2,h3,tr').forEach(x => x.append('\n')); txt = d.body.textContent.replace(/\n{3,}/g, '\n\n'); }
        const r = $('#ipA').checked ? textoAPlantilla(txt) : { contenido: txt.trim(), firmas: '', cambios: [] };
        const nombre = f.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim();
        items.push(Object.assign({ nombre, categoria: /constancia/i.test(nombre) ? 'Constancia' : /solicitud/i.test(nombre) ? 'Solicitud' : /acta/i.test(nombre) && lista('doc_categorias').includes('Acta') ? 'Acta' : 'Carta' }, r));
      } catch (x) { toast(`${f.name}: ${x.message || x}`, 'bad', 7000); }
    }
    e.target.value = ''; pintar();
  };
  L.addEventListener('paste', e => {
    const ta = e.target.closest('[data-k=contenido]'); if (!ta || ta.value.trim() || !$('#ipA').checked) return;
    const txt = (e.clipboardData || window.clipboardData).getData('text'); if (!txt) return;
    e.preventDefault(); leerEd(); const i = num(ta.closest('[data-ii]').dataset.ii); const r = textoAPlantilla(txt); Object.assign(items[i], r); pintar();
  });
  pintar();
}
defView('d:generar', 'Generar documento', (el, p) => {
  const doc = p.doc ? Store.get('documentos', p.doc) : null;
  let datos = {}; try { datos = doc && doc.datos ? JSON.parse(doc.datos) : {}; } catch (e) { }
  if (p.datos) datos = Object.assign({}, p.datos);
  let pl = doc ? Store.all('plantillas').find(x => x.nombre === doc.plantilla) : p.id ? Store.get('plantillas', p.id) : Store.all('plantillas')[0];
  const auto = () => Object.assign({ fecha_larga: flong(datos.fecha || today()), lugar: CFG.inst.lugar, institucion: CFG.inst.nombre, organismo: CFG.inst.organismo, anio: Store.year }, Object.fromEntries(firmantes().map(f => [f.k, f.nombre])), Object.fromEntries(firmantes().map(f => ['cargo_' + f.k, f.cargo])));
  const vars = () => { const s = (pl ? pl.contenido + '\n' + (pl.firmas || '') : ''); return [...new Set([...s.matchAll(/\{\{\s*([\w_]+)\s*\}\}/g)].map(m => m[1]))]; };
  const fill = s => String(s || '').replace(/\{\{\s*([\w_]+)\s*\}\}/g, (m, k) => { const a = auto(); const v = datos[k] !== undefined && datos[k] !== '' ? datos[k] : a[k]; return v !== undefined && v !== '' ? v : '________'; });
  const diseno = () => ({ alin: datos._alin || pl.f_alin || 'centro', esp: datos._esp || pl.f_esp || 'amplio', sello: datos._sello || pl.f_sello || 'no', ref: datos._ref || pl.f_ref || 'si', titulo: datos._titulo !== undefined ? datos._titulo : (pl.f_titulo || '') });
  const numDoc = () => doc ? doc.numero : `${Store.year}-${String(Store.all('documentos').length + 1).padStart(3, '0')}`;
  const sel = (k, arr, v) => `<select class="in" data-d="${k}">${arr.map(o => `<option value="${o.v}" ${o.v === v ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
  const html = () => {
    const body = fill(pl.contenido).split(/\n{2,}/).map(par => `<p>${esc(par).replace(/\n/g, '<br>')}</p>`).join('');
    const fs = String(pl.firmas || '').split('\n').map(l => l.split('|').map(x => fill(x.trim()))).filter(x => x[0] || x[1]);
    const op = diseno();
    const fechaArriba = !/\{\{\s*fecha_larga\s*\}\}/.test(pl.contenido) ? `${CFG.inst.lugar || ''}${CFG.inst.lugar ? ', ' : ''}${flong(datos.fecha || today())}` : '';
    const cab = (op.ref === 'si' ? pref(numDoc(), fechaArriba) : (fechaArriba ? pref('', fechaArriba) : '')) + (op.titulo ? `<div class="ptitle" style="margin:4px 0 14px">${esc(fill(op.titulo).toUpperCase())}</div>` : '');
    return `<div class="page">${membrete()}${cab}<div class="ptxt" style="margin-top:${cab ? 4 : 20}px">${body}</div>${fs.length || op.sello !== 'no' ? bloqueFirmas(fs.map(([n, c]) => [n === '________' ? '' : n, c || '']), op) : ''}</div>`;
  };
  const draw = () => {
    const ps = Store.all('plantillas').sort((a, b) => String(a.nombre).localeCompare(b.nombre));
    if (!pl) { el.innerHTML = `<div class="empty">No hay plantillas. <button class="btn pri" id="dN">+ Crear plantilla</button> <button class="btn" id="dI2">📥 Importar de Word</button></div>`; $('#dN', el).onclick = () => openForm('plantillas', null, { onDone: () => go('d:generar') }); $('#dI2', el).onclick = () => importarPlantillas(() => go('d:generar')); return; }
    const a = auto();
    el.innerHTML = `<div class="grid g2"><div class="card"><div class="bar"><select class="in" id="dP" style="flex:1">${ps.map(x => `<option value="${x._id}" ${x._id === pl._id ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select><button class="btn" id="dE">✎ Editar plantilla</button><button class="btn" id="dNw">+ Nueva</button><button class="btn" id="dIm" title="Importar desde Word o texto">📥 Importar</button></div>
      <div class="form"><label class="f"><span>Fecha del documento</span><input class="in" type="date" data-v="fecha" value="${esc(datos.fecha || today())}"></label>
      ${vars().filter(v => !(v in a)).map(v => `<label class="f ${/cuerpo|detalle/.test(v) ? 'wide' : ''}"><span>${esc(cap(v.replace(/_/g, ' ')))}</span>${/cuerpo|detalle/.test(v) ? `<textarea class="in" rows="4" data-v="${v}">${esc(datos[v] || '')}</textarea>` : `<input class="in" data-v="${v}" value="${esc(datos[v] || '')}">`}</label>`).join('')}</div>
      ${vars().some(v => v in a && v !== 'fecha_larga') ? `<details style="margin-top:10px"><summary class="muted" style="cursor:pointer">Datos automáticos (institución, firmantes…) · cambiar solo para este documento</summary><div class="form" style="margin-top:8px">${vars().filter(v => v in a && v !== 'fecha_larga').map(v => `<label class="f"><span>${esc(cap(v.replace(/_/g, ' ')))}</span><input class="in" data-v="${v}" value="${esc(datos[v] || '')}" placeholder="${esc(a[v] || '')}"></label>`).join('')}</div></details>` : ''}
      <div style="margin-top:12px;padding:10px;border:1px solid var(--ln);border-radius:var(--r)"><b style="font-size:13px">✍️ Formato, firmas y sello</b>
        <div class="form" style="margin-top:6px"><label class="f"><span>Título del documento (opcional)</span><input class="in" data-d="_titulo" value="${esc(diseno().titulo)}" placeholder="Ej.: Solicitud de autorización de compra"></label><label class="f"><span>Número de referencia arriba</span>${sel('_ref', [{ v: 'si', l: 'Mostrar (Ref.: ' + numDoc() + ')' }, { v: 'no', l: 'No mostrar' }], diseno().ref)}</label><label class="f"><span>Posición de las firmas</span>${sel('_alin', FIRMA_ALIN, diseno().alin)}</label><label class="f"><span>Espacio para firmar</span>${sel('_esp', FIRMA_ESP, diseno().esp)}</label><label class="f"><span>Recuadro para sello</span>${sel('_sello', FIRMA_SELLO, diseno().sello)}</label></div>
        <div class="bar" style="margin-top:6px"><span class="muted" style="font-size:12px">Aplica a este documento.</span><span class="sp"></span><button class="btn sm" id="dDf">Guardar como predeterminado de la plantilla</button></div></div>
      <div class="bar" style="margin-top:12px"><span class="sp"></span><button class="btn" id="dS">💾 Guardar en emitidos</button><button class="btn pri" id="dPr">🖨️ Imprimir</button></div></div>
      <div class="pv-mini" id="dPrev"></div></div>`;
    $('#dPrev', el).innerHTML = html();
    $('#dP', el).onchange = e => { pl = Store.get('plantillas', e.target.value); draw(); };
    $('#dE', el).onclick = () => openForm('plantillas', pl, { onDone: s => { pl = s && s._id ? Store.get('plantillas', s._id) : pl; draw(); } });
    $('#dNw', el).onclick = () => openForm('plantillas', null, { onDone: s => { if (s) pl = Store.get('plantillas', s._id); draw(); } });
    $('#dIm', el).onclick = () => importarPlantillas(() => { const ps = Store.all('plantillas').sort((a, b) => num(b._upd) - num(a._upd)); if (ps[0]) pl = ps[0]; draw(); });
    $$('[data-v]', el).forEach(i => i.oninput = () => { datos[i.dataset.v] = i.value; $('#dPrev', el).innerHTML = html(); });
    $$('[data-d]', el).forEach(i => i.onchange = i.oninput = () => { datos[i.dataset.d] = i.value; $('#dPrev', el).innerHTML = html(); });
    $('#dDf', el).onclick = async () => { const d = diseno(); await Store.save('plantillas', Object.assign({}, pl, { f_alin: d.alin, f_esp: d.esp, f_sello: d.sello, f_ref: d.ref, f_titulo: d.titulo })); pl = Store.get('plantillas', pl._id); toast('Formato y firmas guardados en la plantilla “' + pl.nombre + '” ✔', 'ok'); };
    $('#dPr', el).onclick = () => Print.show(pl.nombre, html());
    $('#dS', el).onclick = async () => {
      const n = numDoc();
      const r = await Store.save('documentos', Object.assign({}, doc || {}, { fecha: datos.fecha || today(), numero: n, plantilla: pl.nombre, destinatario: datos.destinatario || datos.nombre || '', asunto: datos.concepto || datos.asunto || pl.nombre, contenido: fill(pl.contenido), datos: JSON.stringify(datos) }));
      toast('Documento guardado como ' + r.numero, 'ok');
    };
  };
  draw();
});

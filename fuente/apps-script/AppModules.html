<script>
/* =================================================================
   DEFINICIÓN DE MÓDULOS (campos, tablas, filtros) Y MENÚ
   ================================================================= */
const CALC = new WeakMap(); // valores calculados por fila (saldo, caja, alertas…)
const cv = (r, k) => (CALC.get(r) || {})[k];
const RECORDAR = [{ v: '', l: 'Sin aviso' }, { v: 0, l: 'A la hora' }, { v: 5, l: '5 min antes' }, { v: 15, l: '15 min antes' }, { v: 30, l: '30 min antes' }, { v: 60, l: '1 hora antes' }, { v: 120, l: '2 horas antes' }, { v: 1440, l: '1 día antes' }, { v: 2880, l: '2 días antes' }];
const recLabel = v => (RECORDAR.find(x => String(x.v) === String(v)) || {}).l || '';
const nextNum = (mod, k) => Store.all(mod).reduce((m, r) => Math.max(m, num(r[k])), 0) + 1;
const est = { fill: { grado: 'grado', seccion: 'seccion', opcion: 'opcion', nie: 'nie' } };

/* ---------------- ESTUDIANTES ---------------- */
defMod({
  key: 'estudiantes', label: 'Estudiantes', scope: 'y',
  ficha: true,
  intro: 'Base de estudiantes del año. Puede importarla desde su Excel (Configuración › Importar) pegando las columnas Nombre, NIE, Grado, Sección, Opción, Estado, Responsable, DUI.',
  fields: [
    { k: 'nombre', l: 'Nombre del estudiante', t: 'text', req: 1, ph: 'Apellidos, Nombres' },
    { k: 'nie', l: 'NIE', t: 'text' },
    { k: 'sexo', l: 'Sexo', t: 'select', o: 'sexo' },
    { k: 'grado', l: 'Grado', t: 'select', o: 'grados', req: 1 },
    { k: 'seccion', l: 'Sección', t: 'select', o: 'secciones', req: 1 },
    { k: 'opcion', l: 'Opción (bachillerato)', t: 'select', o: 'opciones' },
    { k: 'estado', l: 'Estado', t: 'select', o: 'estados_est', def: 'ACTIVO', badge: v => v === 'RETIRADO' ? 'bad' : v === 'NUEVO' ? 'ok' : v === 'DUPLICADO' ? 'warn' : '' },
    { k: 'nivel', l: 'Nivel', t: 'calc', fn: r => nivelDe(r.grado) },
    { k: 'responsable', l: 'Responsable', t: 'text', sec: 'Responsable' },
    { k: 'dui_resp', l: 'DUI del responsable', t: 'text' },
    { k: 'telefono', l: 'Teléfono', t: 'text' },
    { k: 'notas', l: 'Observaciones', t: 'textarea', rows: 2 }
  ],
  table: ['nie', 'nombre', 'grado', 'seccion', 'opcion', 'estado', 'responsable'],
  filters: ['grado', 'seccion', 'opcion', 'estado'], sort: { k: 'nombre', dir: 1 },
  validate: (r, isNew) => { const n = norm(r.nombre); const d = Store.all('estudiantes').find(x => x._id !== r._id && (norm(x.nombre) === n || (r.nie && x.nie && String(x.nie) === String(r.nie)))); return d ? `?Ya existe un estudiante parecido: ${d.nombre} (${d.grado} ${d.seccion}, NIE ${d.nie || '—'}).` : ''; },
  actions: [{ l: '🎓 Ficha', t: 'Ver estado de pagos', fn: r => verFicha(r) }, { l: '📄', t: 'Constancia de pagos', fn: r => go('r:constancia', { est: r._id }) }]
});

/* ---------------- RECIBOS DE INGRESO ---------------- */
/* Todos los rubros cuentan en cálculos (aunque estén ocultos); "off" solo los oculta al digitar recibos */
const rubrosOn = () => CFG.rubros;
const rubrosVisibles = () => CFG.rubros.filter(x => !x.off);
/** Rubros frecuentes (⭐). Si no se ha marcado ninguno, se toman los 6 más usados del año */
function rubrosFrecuentes() {
  const vis = rubrosVisibles(); const fav = vis.filter(x => x.fav); if (fav.length) return fav;
  const uso = {}; Store.all('recibos').forEach(r => vis.forEach(x => { if (num(r['r_' + x.k])) uso[x.k] = (uso[x.k] || 0) + 1; }));
  return vis.slice().sort((a, b) => (uso[b.k] || 0) - (uso[a.k] || 0)).slice(0, 6).sort((a, b) => vis.indexOf(a) - vis.indexOf(b));
}
defMod({
  key: 'recibos', label: 'Recibos de ingreso', scope: 'y',
  fieldsFn: () => [
    { k: 'serie', l: 'Serie', t: 'select', o: 'series', def: () => CFG.serieDef || 'B', req: 1 },
    { k: 'numero', l: 'N° de recibo', t: 'number', req: 1, plain: 1 },
    { k: 'fecha', l: 'Fecha', t: 'date', req: 1, def: today },
    { k: 'tipo', l: 'Tipo de pagador', t: 'select', o: 'pagador', def: 'Estudiante' },
    { k: 'nombre', l: 'Nombre', t: 'ref', ref: 'estudiantes', fill: est.fill, idk: 'est_id', req: 1 },
    { k: 'nie', l: 'NIE', t: 'text' },
    { k: 'grado', l: 'Grado', t: 'select', o: 'grados' },
    { k: 'seccion', l: 'Sección', t: 'select', o: 'secciones' },
    { k: 'opcion', l: 'Opción', t: 'select', o: 'opciones' },
    { k: 'concepto', l: 'Concepto', t: 'text', wide: 1 },
    ...rubrosOn().map(rb => ({ k: 'r_' + rb.k, l: rb.l, t: 'money', sec: 'Detalle por rubro', rubro: rb.k })),
    { k: 'meses_alim', l: 'Meses de alimentos', t: 'number', sec: 'Detalle por rubro' },
    { k: 'total', l: 'Suma de rubros', t: 'money', sec: 'Totales' },
    { k: 'pago', l: 'Pago recibido', t: 'money', sec: 'Totales' },
    { k: 'nulo', l: 'Recibo ANULADO', t: 'check', sec: 'Totales' },
    { k: 'mes', l: 'Mes', t: 'select', o: 'meses', hide: 1 },
    { k: 'est_id', l: 'id estudiante', t: 'text', hide: 1 },
    { k: 'unif', l: 'Detalle de uniformes por talla', t: 'json', hide: 1 },
    { k: 'obs', l: 'Observaciones', t: 'textarea', rows: 2 }
  ],
  table: ['serie', 'numero', 'fecha', 'nombre', 'grado', 'seccion', 'opcion', 'concepto', 'pago', 'nulo'],
  serieBar: st => `<div class="chips"><span class="chip ${!st.f.serie ? 'on' : ''}" data-serie="">Todas las series</span>${lista('series').map(x => `<span class="chip ${st.f.serie === x ? 'on' : ''}" data-serie="${esc(x)}">Serie ${esc(x)}</span>`).join('')}</div>`,
  quick: [{ l: '📝 Con observación', fn: r => !!String(r.obs || '').trim() }, { l: '🚫 Anulados', fn: r => isTrue(r.nulo) }, { l: '👕 Con uniformes por talla', fn: r => (r.unif || []).length > 0 }, { l: '⚠ Pago distinto a rubros', fn: r => !isTrue(r.nulo) && Math.abs(num(r.pago) - num(r.total)) > 0.004 }],
  rowIcon: r => (String(r.obs || '').trim() ? `<span title="Observación: ${esc(r.obs)}" style="cursor:help">📝</span> ` : '') + (isTrue(r.nulo) ? '<span title="Recibo anulado">🚫</span> ' : '') + ((r.unif || []).length ? `<span title="${esc((r.unif || []).map(l => l.cant + ' ' + l.prod + ' T-' + l.talla).join(', '))}">👕</span> ` : ''),
  filters: ['grado', 'seccion', 'mes', 'tipo'], dateField: 'fecha', sums: ['pago'], sort: { k: 'numero', dir: -1 },
  rowClass: r => isTrue(r.nulo) ? 'muted' : '', sumFilter: r => !isTrue(r.nulo),
  beforeSave: r => {
    r.total = r2(rubrosOn().reduce((s, rb) => s + num(r['r_' + rb.k]), 0));
    if (r.pago === '' || r.pago === undefined) r.pago = r.total;
    r.mes = cap(mesDe(r.fecha));
    if (!r.concepto) r.concepto = conceptoAuto(r);
  },
  validate: r => {
    const dup = Store.all('recibos').find(x => x._id !== r._id && num(x.numero) === num(r.numero) && (x.serie || '') === (r.serie || ''));
    if (dup) return `?El recibo ${recNum(r)} ya está registrado (${dup.nombre}, ${fdate(dup.fecha)}).`;
    return '';
  },
  ficha: true,
  onNew: done => openRecibo(null, done), onRow: (r, done) => openRecibo(r, done),
  listButtons: [{ l: '📊 Control de digitación', fn: () => go('r:control') }]
});

const recNum = r => (r.serie ? r.serie + '-' : '') + (r.numero ?? '');
/** Serie que corresponde a un N° según los rangos configurados (ej. A: 1–27); si no cae en ninguno, la serie predeterminada */
const serieDeNumero = n => { n = num(n); const r = (CFG.seriesRangos || []).find(x => n >= num(x.d) && n <= num(x.h)); return r ? r.s : (CFG.serieDef || 'B'); };
/** Asigna serie a los recibos que no la tienen (o a todos, si todos=true) */
async function asignarSeries(todos) {
  const cambia = Store.all('recibos').filter(r => todos ? (r.serie || '') !== serieDeNumero(r.numero) : !r.serie).map(r => Object.assign({}, r, { serie: serieDeNumero(r.numero) }));
  if (!cambia.length) return 0;
  for (let i = 0; i < cambia.length; i += 500) await Store.saveMany('recibos', cambia.slice(i, i + 500));
  // las ventas enlazadas muestran el N° con serie
  for (const r of cambia) if ((r.unif || []).length) await syncVentasRecibo(r);
  return cambia.length;
}
const nextNumSerie = s => Store.all('recibos').reduce((m, r) => (r.serie || '') === (s || '') ? Math.max(m, num(r.numero)) : m, 0) + 1;
function conceptoAuto(r) {
  const parts = [];
  const lines = (r.unif || []).filter(l => l.prod && num(l.cant));
  const lock = new Set(lines.map(l => (prodDe(l.prod) || {}).rubro).filter(Boolean));
  lines.forEach(l => { const p = prodDe(l.prod); parts.push(`${num(l.cant) > 1 ? num(l.cant) + ' ' : ''}${((p && p.concepto) || l.prod).toUpperCase()}${l.talla && norm(l.talla) !== 'unica' ? ' TALLA ' + l.talla : ''}`); });
  rubrosOn().forEach(rb => {
    const v = num(r['r_' + rb.k]); if (!v || lock.has(rb.k)) return;
    if (rb.meses) { const m = num(r.meses_alim) || (rb.p ? Math.round(v / rb.p) : 0); parts.push(m ? `${m} ${m === 1 ? 'MES' : 'MESES'} DE ${rb.l.toUpperCase()}` : rb.l.toUpperCase()); }
    else { const q = rb.p ? v / rb.p : 0; parts.push(q && Number.isInteger(r2(q)) && q > 1 ? `${q} ${rb.l.toUpperCase()}` : rb.l.toUpperCase()); }
  });
  return parts.join(', ');
}

/** Formulario rápido de recibo (digitación ágil desde el talonario) */
/** Fecha sugerida para un recibo nuevo: la última usada HOY (para digitar recibos atrasados en lote); si es otro día, la de hoy */
function fechaRecDefault() { const x = LS.get('lastFechaRec', null); return x && typeof x === 'object' && x.dia === today() && x.f ? x.f : today(); }
/** Guarda cambios de un estudiante y los aplica a todos sus recibos (y ventas de uniformes) del año */
async function actualizarEstudiante(e, v) {
  await Store.save('estudiantes', Object.assign({}, e, v));
  return propagarEstudiante(e, v);
}
async function propagarEstudiante(e, v) {
  const viejo = norm(e.nombre), nie0 = String(e.nie || '');
  const recs = Store.all('recibos').filter(r => r.est_id === e._id || (nie0 && String(r.nie || '') === nie0) || (viejo && norm(r.nombre) === viejo));
  const cambia = recs.map(r => Object.assign({}, r, { est_id: e._id, nombre: v.nombre ?? r.nombre, nie: v.nie ?? r.nie, grado: v.grado, seccion: v.seccion, opcion: v.opcion }));
  if (cambia.length) await Store.saveMany('recibos', cambia);
  const ids = new Set(recs.map(r => r._id));
  const vs = Store.all('unif_ventas').filter(x => ids.has(x.rec_id)).map(x => Object.assign({}, x, { estudiante: v.nombre ?? x.estudiante, grado: v.grado, seccion: v.seccion }));
  if (vs.length) await Store.saveMany('unif_ventas', vs);
  return cambia.length;
}
/* Si se edita un estudiante desde su módulo, los cambios también pasan a sus recibos */
let _estAntes = null;
setTimeout(() => {
  const d = MOD.estudiantes; const bs = d.beforeSave, as = d.afterSave;
  d.beforeSave = r => { _estAntes = r._id ? Object.assign({}, Store.get('estudiantes', r._id)) : null; if (bs) bs(r); };
  d.afterSave = async (saved, isNew) => { if (as) as(saved, isNew); const o = _estAntes; _estAntes = null; if (!o || isNew) return;
    if (['nombre', 'nie', 'grado', 'seccion', 'opcion'].some(k => String(o[k] || '') !== String(saved[k] || ''))) { const n = await propagarEstudiante(o, { nombre: saved.nombre, nie: saved.nie, grado: saved.grado, seccion: saved.seccion, opcion: saved.opcion }); if (n) toast(`Cambios aplicados a ${n} recibo(s) del estudiante`, 'ok', 4000); } };
}, 0);
function openRecibo(row, done, pre) {
  const isNew = !row;
  const serie0 = (row && row.serie) || LS.get('lastSerie', CFG.serieDef || 'B');
  row = Object.assign({ serie: serie0, numero: nextNumSerie(serie0), fecha: fechaRecDefault(), tipo: 'Estudiante' }, pre || {}, row || {});
  const rbs = rubrosOn();
  let lines = (row.unif || []).map(l => Object.assign({}, l));
  let pagoAuto = row.pago === '' || row.pago === undefined || Math.abs(num(row.pago) - num(row.total)) < 0.005;
  const html = `<div class="form">
    <div class="wide rec-top">
    <label class="f req"><span>Serie</span><select class="in" id="r_serie">${lista('series').map(o => `<option ${o === row.serie ? 'selected' : ''}>${esc(o)}</option>`).join('')}${lista('series').includes(row.serie) ? '' : `<option selected>${esc(row.serie || '')}</option>`}</select></label>
    <label class="f req"><span>N° de recibo</span><input class="in" type="number" id="r_numero" value="${esc(row.numero)}"></label>
      <div></div>
    <label class="f"><span>Tipo de pagador</span><select class="in" id="r_tipo">${lista('pagador').map(o => `<option ${o === row.tipo ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>
    <label class="f"><span>NIE</span><input class="in" id="r_nie" value="${esc(row.nie || '')}"></label>
      <div></div>
    <label class="f req"><span>Fecha</span><input class="in" type="date" id="r_fecha" value="${esc(toYMD(row.fecha))}"><small id="r_fchk" style="font-size:11.5px;margin-top:3px"></small></label>
    </div>
    <label class="f req wide"><span>Nombre (escriba para buscar en la base de estudiantes)</span><input class="in" id="r_nombre" value="${esc(row.nombre || '')}"></label>
    <div class="wide" id="r_estc"></div>
    <div hidden><select class="in" id="r_grado"><option></option>${gradosList().map(o => `<option ${o === row.grado ? 'selected' : ''}>${esc(o)}</option>`).join('')}${row.grado && !gradosList().includes(row.grado) ? `<option selected>${esc(row.grado)}</option>` : ''}</select>
      <select class="in" id="r_seccion"><option></option>${lista('secciones').map(o => `<option ${o === row.seccion ? 'selected' : ''}>${esc(o)}</option>`).join('')}${row.seccion && !lista('secciones').includes(row.seccion) ? `<option selected>${esc(row.seccion)}</option>` : ''}</select>
      <select class="in" id="r_opcion"><option></option>${lista('opciones').map(o => `<option ${o === row.opcion ? 'selected' : ''}>${esc(o)}</option>`).join('')}${row.opcion && !lista('opciones').includes(row.opcion) ? `<option selected>${esc(row.opcion)}</option>` : ''}</select></div>
    <div class="wide" id="r_info"></div>
    ${productos().length ? `<div class="sec-t">Uniformes, chumpas y camisas · por talla (el precio sale de la configuración)</div><div class="wide" id="r_unif"></div>` : ''}
    <div class="sec-t">Rubros · cantidad × precio (puede escribir el monto directamente)</div>
    ${(() => {
      const celda = rb => { const v = num(row['r_' + rb.k]); const q = rb.meses ? (num(row.meses_alim) || (rb.p && v ? r2(v / rb.p) : '')) : (rb.p && v ? r2(v / rb.p) : '');
        return `<div class="rub ${v ? 'on' : ''}" data-rk="${rb.k}"><span>${esc(rb.l)}${rb.off ? ' <small class="warn-t" style="display:inline">(oculto)</small>' : ''}<small>${rb.p ? money(rb.p) + ' / ' + esc(rb.u || 'unid.') : 'monto libre'}</small></span>
        <input class="in" type="number" step="any" data-q placeholder="${rb.meses ? 'meses' : 'cant.'}" value="${q || ''}" ${rb.p ? '' : 'disabled'}><input class="in" type="number" step="any" data-m placeholder="$" value="${v || ''}"></div>`; };
      const freq = new Set(rubrosFrecuentes().map(x => x.k));
      const arriba = rbs.filter(rb => freq.has(rb.k) || num(row['r_' + rb.k]));
      const resto = rbs.filter(rb => !arriba.includes(rb) && !rb.off);
      const abierto = LS.get('rubMas', false);
      return `<div class="wide rub-grid">${arriba.map(celda).join('')}</div>
      ${resto.length ? `<details class="wide rub-mas" id="r_mas" ${abierto ? 'open' : ''}><summary><b>Más rubros (${resto.length})</b> <span class="muted">· ${esc(resto.map(x => x.l).join(' · '))}</span></summary><div class="rub-grid" style="margin-top:8px">${resto.map(celda).join('')}</div></details>` : ''}`;
    })()}
    <label class="f wide"><span>Concepto <label class="chk" style="display:inline-flex;font-weight:400"><input type="checkbox" id="r_auto" ${row.concepto && row.concepto !== conceptoAuto(row) ? '' : 'checked'}> automático</label></span><input class="in" id="r_concepto" value="${esc(row.concepto || '')}"></label>
    <div><span class="muted" style="font-size:12px">SUMA DE RUBROS</span><div class="total-box" id="r_total">$0.00</div></div>
    <label class="f"><span>Pago recibido (lo que dice el recibo)</span><input class="in" type="number" step="any" id="r_pago" value="${row.pago ?? ''}"></label>
    <div style="align-self:end"><label class="chk"><input type="checkbox" id="r_nulo" ${isTrue(row.nulo) ? 'checked' : ''}> Recibo ANULADO</label></div>
    <label class="f wide"><span>📝 Observaciones (el recibo quedará marcado con un ícono)</span><input class="in" id="r_obs" value="${esc(row.obs || '')}"></label>
  </div>`;
  const leer = () => {
    const r = Object.assign({}, row);
    ['serie', 'numero', 'fecha', 'tipo', 'nie', 'nombre', 'grado', 'seccion', 'opcion', 'concepto', 'obs'].forEach(k => r[k] = $('#r_' + k).value.trim());
    r.numero = num(r.numero); r.nulo = $('#r_nulo').checked;
    r.meses_alim = '';
    $$('.rub').forEach(d => { const rb = rbs.find(x => x.k === d.dataset.rk); const m = $('[data-m]', d).value; r['r_' + rb.k] = m === '' ? '' : num(m); if (rb.meses && m !== '') r.meses_alim = num($('[data-q]', d).value) || (rb.p ? r2(num(m) / rb.p) : ''); });
    r.unif = lines.filter(l => l.prod && num(l.cant)).map(l => ({ prod: l.prod, talla: l.talla || '', cant: num(l.cant), precio: num(l.precio) }));
    const porRubro = {}; r.unif.forEach(l => { const rk = (prodDe(l.prod) || {}).rubro; if (rk) porRubro[rk] = r2((porRubro[rk] || 0) + l.cant * l.precio); });
    for (const rk in porRubro) r['r_' + rk] = porRubro[rk];
    $$('.rub').forEach(d => { const mi = $('[data-m]', d); if (mi.dataset.lock && !(d.dataset.rk in porRubro)) r['r_' + d.dataset.rk] = ''; });
    r.total = r2(rbs.reduce((s, rb) => s + num(r['r_' + rb.k]), 0));
    const p = $('#r_pago').value; r.pago = p === '' ? r.total : num(p);
    return r;
  };
  const drawLines = () => {
    const host = $('#r_unif'); if (!host) return;
    const ps = productos();
    host.innerHTML = `<table class="t items-t"><thead><tr><th>Producto</th><th style="width:110px">Talla</th><th style="width:80px">Cant.</th><th style="width:100px">Precio $</th><th style="width:90px" class="r">Subtotal</th><th></th></tr></thead><tbody>
      ${lines.map((l, i) => { const p = prodDe(l.prod); return `<tr data-li="${i}"><td><select data-lk="prod"><option value=""></option>${ps.filter(x => !x.sinTallas || x.l === l.prod).map(x => `<option ${x.l === l.prod ? 'selected' : ''}>${esc(x.l)}</option>`).join('')}</select></td>
        <td><select data-lk="talla">${(p ? p.tallas : []).map(t => { const d = dispTalla(p.l, t.t); return `<option value="${esc(t.t)}" ${norm(t.t) === norm(l.talla) ? 'selected' : ''}>${esc(t.t)}${d === null ? '' : ` (disp. ${d})`}</option>`; }).join('')}</select></td>
        <td><input type="number" min="0" step="1" data-lk="cant" value="${esc(l.cant)}"></td><td><input type="number" step="any" data-lk="precio" value="${esc(l.precio)}"></td>
        <td class="num">${money(num(l.cant) * num(l.precio))}</td><td><button type="button" class="btn sm danger" data-ldel="${i}">✕</button></td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">Sin productos por talla. Use “+ Agregar fila”.</td></tr>'}</tbody></table>
      <div style="margin-top:6px"><button type="button" class="btn sm" id="r_ladd">+ Agregar fila</button> <span class="muted" style="font-size:12px">Cada fila suma al rubro del producto (uniforme deportivo, chumpas…) y se registra en Ventas y entregas.</span></div>`;
  };
  const refresh = () => {
    const r = leer();
    $('#r_total').textContent = money(r.total);
    if (pagoAuto && $('#r_pago').value !== '') $('#r_pago').value = r.total ? r.total : '';
    if ($('#r_auto').checked) $('#r_concepto').value = conceptoAuto(r);
    $('#r_pago').placeholder = r.total ? r.total.toFixed(2) : '';
    const lock = new Set(r.unif.map(l => (prodDe(l.prod) || {}).rubro));
    $$('.rub').forEach(d => {
      const rk = d.dataset.rk, mi = $('[data-m]', d), qi = $('[data-q]', d);

    const grupo = ms.length > 1 ? 'g' + uid() : '';

    toast(`✔ ${ms.length} pago(s) registrado(s) · ${money(ms.reduce((t, x) => t + num(montos[x]), 0))}`, 'ok'); done && done(); return true; } }]);
  attachAC($('#pa_nombre'), REF.arrendatarios, it => { arr = it.row; $('#pa_cat').value = arr.categoria || 'Cafetín'; $('#pa_cuota').value = arr.cuota || ''; $('#pa_conc').value = 'Alquiler de ' + String(arr.categoria || 'local').toLowerCase() + (arr.espacio ? ' (' + arr.espacio + ')' : ''); montos = {}; draw(); });

/* ---------------- CAJA CHICA ---------------- */
let _ordSeq = 0;
const nuevoOrden = () => Date.now() + (++_ordSeq % 1000) / 1000;
/** Calcula saldo, N° de caja y alertas en el orden de registro (igual que su libro de caja chica).
    Inicia caja nueva: tipo INICIO/REPOSICIÓN o un ingreso (Debe) con comprobante CHEQUE. */
function prepCaja(rows) {
  const lim = num(CFG.caja.limite);
  let s = 0, caja = 0, rcs = {};
  rows.slice().sort((a, b) => (num(a.orden) || num(a._upd)) - (num(b.orden) || num(b._upd))).forEach(r => {
    const nueva = r.tipo === 'INICIO' || r.tipo === 'REPOSICIÓN' || (num(r.debe) > 0 && /CHEQUE/i.test(r.comprobante || ''));
    if (nueva || caja === 0) caja++;
    s = r2(s + num(r.debe) - num(r.haber));
    const al = [];
    if (num(r.haber) > lim && lim) al.push('Excede límite');
    if (!r.documento && num(r.haber)) al.push('Sin N° doc.');
    if (!r.proveedor && num(r.haber)) al.push('Sin proveedor');
    if (!r.fecha) al.push('Sin fecha');
    else if (toYMD(r.fecha) > today()) al.push('Fecha futura');
    if (s < 0) al.push('Saldo negativo');
    if (r.documento && num(r.haber)) { const k = norm(r.documento); if (rcs[k]) al.push('Doc. repetido'); rcs[k] = 1; }
    CALC.set(r, { saldo: s, caja: 'C' + caja, cajaN: caja, alertas: al.join(' · ') });
  });
  return { saldo: s, caja: Math.max(1, caja) };
}

/** Existencias por artículo (año actual) */
function existencias() {
  const ex = {};

}

/* ---------------- INVENTARIO DE UNIFORMES POR TALLA ----------------
   Existencia física = último conteo + entradas (movimientos y pedidos recibidos) − salidas − ventas entregadas después del conteo.
   Disponible = existencia física − vendido sin entregar. */
const INV_MOV = [
  { v: 'CONTEO FÍSICO', s: '=', l: 'Conteo físico / existencia inicial' },
  { v: 'ENTRADA', s: '+', l: 'Entrada (compra o producción)' },

  { v: 'AJUSTE +', s: '+', l: 'Ajuste a favor' },
  { v: 'AJUSTE −', s: '-', l: 'Ajuste en contra' },
  { v: 'BAJA', s: '-', l: 'Baja (dañado o perdido)' },
  { v: 'SALIDA', s: '-', l: 'Salida sin venta (donación, cambio, otro)' }];

/** Calcula existencias por producto y talla, con su kardex */
function stockUniformes() {
  const g = {}, K = (t, s) => norm(t) + '|' + norm(s);
  const it = (t, s) => { const k = K(t, s); return g[k] = g[k] || { tipo: t, talla: s, ev: [], conteo: null }; };
  const ts = (d, u) => toYMD(d) + '|' + String(Math.round(num(u))).padStart(15, '0');
  Store.all('unif_inv').forEach(m => { if (!m.tipo || !m.talla) return; const s = invSigno(m.mov); it(m.tipo, m.talla).ev.push({ t: ts(m.fecha, m._upd), fecha: m.fecha, que: m.mov, doc: m.doc || '', s, q: num(m.cantidad), id: m._id, mod: 'unif_inv' }); });
  Store.all('unif_pedidos').filter(p => isTrue(p.recibido)).forEach(p => { if (!p.tipo || !p.talla) return; const f = p.f_recibido || p.fecha; it(p.tipo, p.talla).ev.push({ t: ts(f, p._upd), fecha: f, que: 'PEDIDO #' + (p.pedido || '') + ' RECIBIDO', doc: '', s: '+', q: num(p.cantidad), id: p._id, mod: 'unif_pedidos' }); });
  // productos sin tallas (ej. insignias): las ventas salen de la cantidad cobrada en el rubro del recibo
  const pseudo = [];
  productos().filter(pr => pr.sinTallas && pr.rubro).forEach(pr => { const rb = CFG.rubros.find(r => r.k === pr.rubro), t0 = (pr.tallas[0] || {}), pu = num(rb && rb.p) || num(t0.p); if (!pu) return;
    Store.all('recibos').forEach(r => { if (isTrue(r.nulo)) return; const v = num(r['r_' + pr.rubro]); if (!v) return; pseudo.push({ _id: 'rv_' + r._id, _upd: r._upd, tipo: pr.l, talla: t0.t || 'ÚNICA', cantidad: Math.round(v / pu * 100) / 100, precio: pu, entregado: true, fecha: r.fecha, recibo: recNum(r), estudiante: r.nombre }); }); });
  Store.all('unif_ventas').concat(pseudo).forEach(v => {
    if (!v.tipo || !v.talla) return; const x = it(v.tipo, v.talla);
    x.ventas = (x.ventas || []); x.ventas.push(v);
    if (isTrue(v.entregado)) { const f = v.f_entrega || v.fecha; x.ev.push({ t: ts(f, v._upd), fecha: f, que: 'ENTREGA A ' + String(v.estudiante || '').toUpperCase(), doc: v.recibo ? 'Recibo ' + v.recibo : '', s: '-', q: num(v.cantidad), id: v._id, mod: 'unif_ventas' }); }
  });
  Object.values(g).forEach(x => {
    x.ev.sort((a, b) => a.t < b.t ? -1 : a.t > b.t ? 1 : 0);
    let saldo = 0, ent = 0, sal = 0, ultimo = -1;
    x.ev.forEach((e, i) => { if (e.s === '=') ultimo = i; });
    x.ev.forEach((e, i) => {
      if (e.s === '=') { e.antes = saldo; saldo = e.q; if (i === ultimo) { x.conteo = e; ent = 0; sal = 0; } }
      else if (e.s === '+') { saldo += e.q; if (i > ultimo) ent += e.q; }
      else { saldo -= e.q; if (i > ultimo) sal += e.q; }
      e.saldo = saldo;
    });
    x.hayConteo = ultimo >= 0;
    x.sinDatos = !x.hayConteo && !x.ev.some(e => e.s === '+');
    x.fisica = saldo; x.entradas = ent; x.salidas = sal;
    const vs = x.ventas || [];
    x.porEntregar = vs.filter(v => !isTrue(v.entregado)).reduce((a, v) => a + num(v.cantidad), 0);
    x.vendidoDesde = vs.filter(v => !x.conteo || ts(v.fecha, v._upd) > x.conteo.t).reduce((a, v) => a + num(v.cantidad), 0);
    x.disp = x.fisica - x.porEntregar;
    const pr = precioDe(x.tipo, x.talla) || { costo: 0, precio: 0 };
    x.costo = num(pr.costo); x.precio = num(pr.precio);
  });
  return g;
}
/** Disponible de una talla (null si nunca se ha registrado inventario de ese producto) */
let _stkC = null, _stkT = 0;
function dispTalla(prod, talla) {
  if (!_stkC || Date.now() - _stkT > 800) { _stkC = stockUniformes(); _stkT = Date.now(); }
  const g = _stkC; const x = g[norm(prod) + '|' + norm(talla)];
  if (!Object.values(g).some(y => norm(y.tipo) === norm(prod) && !y.sinDatos)) return null;
  return x && !x.sinDatos ? x.disp : 0;
}

<script>
/* =================================================================
   REPORTES DE COBRO · CONTROL DE DIGITACIÓN · CUADRE · ARQUEO
   ================================================================= */

/* ---------- índice de pagos por estudiante ---------- */
function indicePagos(desde, hasta) {
  const ests = Store.all('estudiantes');
  const byId = new Map(), byNie = new Map(), byName = new Map();
  ests.forEach(e => { byId.set(e._id, e); if (e.nie) byNie.set(String(e.nie).trim(), e); byName.set(norm(e.nombre), e); });
  const pag = new Map(); const sinBD = [];
  for (const r of Store.all('recibos')) {
    if (isTrue(r.nulo)) continue;
    const f = toYMD(r.fecha); if (desde && f < desde) continue; if (hasta && f > hasta) continue;
    const e = (r.est_id && byId.get(r.est_id)) || (r.nie && byNie.get(String(r.nie).trim())) || byName.get(norm(r.nombre));
    if (!e) { sinBD.push(r); continue; }
    (pag.get(e._id) || pag.set(e._id, []).get(e._id)).push(r);
  }
  return { pag, sinBD, ests };
}
const secKey = (g, s, o) => `${g}|${s}|${o || ''}`;
function seccionesDe(ests) {
  const m = new Map();
  (ests || Store.all('estudiantes')).forEach(e => {
    if (/^DUPLICADO/.test(e.estado || '')) return;
    const o = nivelDe(e.grado) === 'BACHILLERATO' ? (e.opcion || '') : '';
    const k = secKey(e.grado, e.seccion, o);
    if (!m.has(k)) m.set(k, { g: e.grado, s: e.seccion, o, n: 0, nivel: nivelDe(e.grado) });
    if (e.estado !== 'RETIRADO') m.get(k).n++;
  });
  return [...m.values()].sort((a, b) => ordenGrado(a.g) - ordenGrado(b.g) || String(a.s).localeCompare(b.s) || String(a.o).localeCompare(b.o));
}
const tituloSec = s => `${s.g} – Sección ${s.s}${s.o ? ' – ' + cap(s.o.toLowerCase()) : ''}`;
const estDeSec = (ests, s) => ests.filter(e => norm(e.grado) === norm(s.g) && norm(e.seccion) === norm(s.s) && (!s.o || norm(e.opcion) === norm(s.o)) && !/^DUPLICADO/.test(e.estado || '')).sort((a, b) => String(a.nombre).localeCompare(b.nombre, 'es'));

/** Filtros comunes: rango de fechas + grado/sección/opción */
function filtrosHtml(st, opts = {}) {
  return `<div class="bar">
    <label class="f"><span>Desde</span><input type="date" class="in" id="fD" value="${st.desde}"></label>
    <label class="f"><span>Hasta</span><input type="date" class="in" id="fH" value="${st.hasta}"></label>
    ${opts.sec ? `<label class="f"><span>Grado</span><select class="in" id="fG">${gradosList().map(g => `<option ${g === st.g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></label>
    <label class="f"><span>Sección</span><select class="in" id="fS">${lista('secciones').map(g => `<option ${g === st.s ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></label>
    <label class="f"><span>Opción</span><select class="in" id="fO"><option value="">(TODAS)</option>${lista('opciones').map(g => `<option ${g === st.o ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></label>` : ''}
    ${opts.extra || ''}<span class="sp"></span>${opts.btns || ''}</div>`;
}
function leerFiltros(el, st) {
  ['fD:desde', 'fH:hasta', 'fG:g', 'fS:s', 'fO:o'].forEach(p => { const [id, k] = p.split(':'); const x = $('#' + id, el); if (x) st[k] = x.value; });
  return st;
}
const stDef = () => ({ desde: Store.year + '-01-01', hasta: String(Store.year) === today().slice(0, 4) ? today() : Store.year + '-12-31', g: '', s: '', o: '' });

/* ---------- CONTROL DE DIGITACIÓN ---------- */
function controlRecibos(serie) {
  const all = Store.all('recibos').filter(r => serie === undefined || serie === '' || (r.serie || '') === serie);
  // cada serie tiene su propia numeración: saltados y repetidos se calculan por serie
  const grupos = {}; all.forEach(r => { const n = num(r.numero); if (n) (grupos[r.serie || ''] = grupos[r.serie || ''] || []).push(n); });
  const saltados = [], talonarios = [], repetidos = [], series = {};
  const et = (g, n) => (g ? g + '-' : '') + n;
  Object.keys(grupos).sort().forEach(g => {
    const set = new Map(); grupos[g].forEach(n => set.set(n, (set.get(n) || 0) + 1));
    const u = [...set.keys()].sort((a, b) => a - b);
    for (let i = 1; i < u.length; i++) { const d = u[i] - u[i - 1]; if (d > 1 && d <= 51) for (let n = u[i - 1] + 1; n < u[i]; n++) saltados.push(et(g, n)); else if (d > 51) talonarios.push(`${et(g, u[i - 1])} → ${et(g, u[i])}`); }
    [...set].filter(([, c]) => c > 1).forEach(([n]) => repetidos.push(et(g, n)));
    series[g] = { min: u[0], max: u[u.length - 1], n: grupos[g].length };
  });
  const ks = Object.keys(series).sort();
  const min = ks.length === 1 ? series[ks[0]].min : 0, max = ks.length === 1 ? series[ks[0]].max : 0;
  const ests = Store.all('estudiantes'); const nomSet = new Set(ests.map(e => norm(e.nombre))), nieSet = new Set(ests.map(e => String(e.nie || '').trim()).filter(Boolean)), idSet = new Set(ests.map(e => e._id));
  const alertas = [];
  const t = today();
  all.forEach(r => {
    if (isTrue(r.nulo)) return;
    const suma = rubrosOn().reduce((s, rb) => s + num(r['r_' + rb.k]), 0);
    const a = [];
    if ((r.tipo === 'Estudiante' || !r.tipo) && (!r.grado || gradosList().includes(r.grado))) if (!idSet.has(r.est_id) && !nieSet.has(String(r.nie || '').trim()) && !nomSet.has(norm(r.nombre))) a.push('NOMBRE NO ESTÁ EN BD');
    if (num(r.pago) && !suma) a.push('INGRESO SIN DESGLOSE POR RUBRO');
    else if (Math.abs(num(r.pago) - suma) > 0.004) a.push(num(r.pago) < suma ? 'PAGO MENOR QUE RUBROS' : 'PAGO MAYOR QUE RUBROS');
    if (toYMD(r.fecha) > t) a.push('FECHA FUTURA');
    if (!toYMD(r.fecha).startsWith(String(Store.year))) a.push('FECHA FUERA DEL AÑO');
    if (a.length) alertas.push({ r, suma, a: a.join(' · ') });
  });
  return { all, min, max, series, saltados, talonarios, repetidos, alertas, nulos: all.filter(r => isTrue(r.nulo)).length };
}
defView('r:control', 'Control de digitación de recibos', el => {
  let serie = LS.get('ctrlSerie', '');
  const draw = () => {
    const c = controlRecibos(serie); const t = today(), mes = t.slice(0, 7);
    const sk = Object.keys(c.series).sort();
    const rango = sk.map(g => `${g ? 'Serie ' + g + ': ' : ''}${c.series[g].min} / ${c.series[g].max}`).join(' · ') || '—';
    const prox = sk.map(g => `${g ? g + '-' : ''}${c.series[g].max + 1}`).join(' · ') || '—';
    const v = c.all.filter(r => !isTrue(r.nulo));
    const hoy = v.filter(r => toYMD(r.fecha) === t);
    const fmax = v.map(r => toYMD(r.fecha)).sort().pop();
    const k = (l, val, s, cls) => `<div class="kpi ${cls || ''}"><div class="l">${l}</div><div class="v">${val}</div><div class="s">${s || ''}</div></div>`;
    el.innerHTML = `<div class="bar"><div class="chips"><span class="chip ${!serie ? 'on' : ''}" data-se="">Todas las series</span>${lista('series').map(x => `<span class="chip ${serie === x ? 'on' : ''}" data-se="${esc(x)}">Serie ${esc(x)}</span>`).join('')}</div><button class="btn pri" id="cNew">+ Digitar recibo</button><span class="sp"></span><button class="btn" id="cPr">🖨️ Imprimir control</button></div>
    <div class="kpis">${k('Recibos digitados', c.all.length, `${c.nulos} anulados`)}${k('Primer / último', `<span style="font-size:${sk.length > 1 ? '14px' : 'inherit'}">${rango}</span>`)}${k('Próximo correlativo', `<span style="font-size:${sk.length > 1 ? '14px' : 'inherit'}">${prox}</span>`, 'a digitar', 'ok')}
      ${k('Saltados', c.saltados.length, 'sin digitar', c.saltados.length ? 'bad' : 'ok')}${k('Repetidos', c.repetidos.length, 'N° duplicados', c.repetidos.length ? 'bad' : 'ok')}
      ${k('Recaudado hoy', money(hoy.reduce((s, r) => s + num(r.pago), 0)), hoy.length + ' recibo(s)')}${k('Este mes', money(v.filter(r => toYMD(r.fecha).startsWith(mes)).reduce((s, r) => s + num(r.pago), 0)))}
      ${k('Acumulado del año', money(v.reduce((s, r) => s + num(r.pago), 0)), 'fecha más reciente: ' + (fdate(fmax) || '—'))}</div>
    ${c.saltados.length ? `<div class="alert bad"><b>N° saltados:</b> ${c.saltados.slice(0, 300).join(', ')}${c.saltados.length > 300 ? '…' : ''}</div>` : ''}
    ${c.repetidos.length ? `<div class="alert bad"><b>N° repetidos (${c.repetidos.length}):</b> ${c.repetidos.slice(0, 200).join(', ')}${c.repetidos.length > 200 ? '…' : ''}${(duplicadosExactos().recibos || []).length ? `<div style="margin-top:8px"><b>${duplicadosExactos().recibos.length} son copias idénticas</b> (mismo nombre, fecha, concepto y montos). <button class="btn sm" id="cDup">🧹 Eliminar copias idénticas</button></div>` : ''}</div>` : ''}
    ${c.talonarios.length ? `<div class="alert info"><b>Saltos grandes de numeración</b> (cambio de talonario o número mal digitado): ${c.talonarios.join(' · ')}</div>` : ''}
    <div class="card"><h3>Lista de alertas <small>(${c.alertas.length}) · clic para corregir</small></h3>
    ${c.alertas.length ? `<div class="tw"><table class="t"><thead><tr><th>N° recibo</th><th>Fecha</th><th>Nombre</th><th>Grado</th><th>Concepto</th><th class="r">Pago</th><th class="r">Suma rubros</th><th class="r">Diferencia</th><th>Alerta</th></tr></thead><tbody>
    ${c.alertas.sort((a, b) => String(a.r.serie || '').localeCompare(b.r.serie || '') || num(a.r.numero) - num(b.r.numero)).map(x => `<tr data-id="${x.r._id}" style="cursor:pointer"><td>${MOD.recibos.rowIcon(x.r)}${recNum(x.r)}</td><td>${fdate(x.r.fecha)}</td><td>${esc(x.r.nombre)}</td><td>${esc((x.r.grado || '') + ' ' + (x.r.seccion || ''))}</td><td>${esc(x.r.concepto)}</td><td class="num">${money(x.r.pago)}</td><td class="num">${money(x.suma)}</td><td class="num">${money(num(x.r.pago) - x.suma)}</td><td><span class="tag warn">${esc(x.a)}</span></td></tr>`).join('')}</tbody></table></div>` : '<div class="alert ok">✔ Sin alertas.</div>'}</div>`;
    $$('[data-se]', el).forEach(ch => ch.onclick = () => { serie = ch.dataset.se; LS.set('ctrlSerie', serie); draw(); });
    $('#cNew', el).onclick = () => openRecibo(null, draw);
    const cd = $('#cDup', el); if (cd) cd.onclick = async () => { const d = duplicadosExactos().recibos; if (!(await confirmBox(`Se eliminarán ${d.length} recibo(s) duplicado(s) idénticos; se conserva uno de cada uno.`, 'Eliminar'))) return; await Store.saveMany('recibos', d.map(x => Object.assign({}, x, { _del: 1 }))); toast(`✔ ${d.length} duplicado(s) eliminado(s)`, 'ok'); draw(); };
    $$('tr[data-id]', el).forEach(tr => tr.onclick = () => openRecibo(Store.get('recibos', tr.dataset.id), draw));
    $('#cPr', el).onclick = () => Print.show('Control de digitación', `<div class="page">${membrete()}<div class="ptitle">CONTROL DE DIGITACIÓN DE RECIBOS</div><div class="psub">Al ${flong(today())}</div>
      <div class="pkpi"><div><small>Digitados${serie ? ' · Serie ' + esc(serie) : ''}</small><b>${c.all.length}</b></div><div><small>Primer / último</small><b style="font-size:11px">${rango}</b></div><div><small>Saltados</small><b>${c.saltados.length}</b></div><div><small>Repetidos</small><b>${c.repetidos.length}</b></div><div><small>Anulados</small><b>${c.nulos}</b></div><div><small>Acumulado</small><b>${money(v.reduce((s, r) => s + num(r.pago), 0))}</b></div></div>
      ${c.saltados.length ? `<p class="pnote"><b>Saltados:</b> ${c.saltados.join(', ')}</p>` : ''}${c.repetidos.length ? `<p class="pnote"><b>Repetidos:</b> ${c.repetidos.join(', ')}</p>` : ''}
      ${ptable(['N°', 'Fecha', 'Nombre', 'Concepto', 'Pago', 'Rubros', 'Alerta'], c.alertas.map(x => `<tr><td>${recNum(x.r)}</td><td>${fdate(x.r.fecha)}</td><td>${esc(x.r.nombre)}</td><td>${esc(x.r.concepto)}</td><td class="r">${money(x.r.pago)}</td><td class="r">${money(x.suma)}</td><td>${esc(x.a)}</td></tr>`))}${pfoot()}</div>`);
  };
  draw(); return draw;
});

/* ---------- REPORTE POR GRADO Y SECCIÓN ---------- */
defView('r:grado', 'Reporte de aportes por grado y sección', el => {
  const st = Object.assign(stDef(), LS.get('rg', {}));
  if (!st.g) { const s0 = seccionesDe()[0]; if (s0) { st.g = s0.g; st.s = s0.s; st.o = s0.o; } }
  const draw = () => {
    const rbs = rubrosOn();
    el.innerHTML = filtrosHtml(st, { sec: 1, extra: `<label class="f"><span>Verificar rubro</span><select class="in" id="fV">${rbs.map(r => `<option value="${r.k}" ${r.k === st.v ? 'selected' : ''}>${esc(r.l)}</option>`).join('')}</select></label>
      <label class="f"><span>Meses requeridos</span><input class="in" type="number" id="fM" value="${st.m || mesesRequeridos(st.hasta)}" style="width:80px" title="Por defecto: ${(CFG.alimentos.modo || 'anual') === 'anual' ? 'todo el año' : 'hasta la fecha'} (Configuración › General)"></label>`, btns: `<button class="btn" id="bLote">🖨️ Lote (un solo PDF)</button><button class="btn" id="bInd">📑 PDF individuales</button><button class="btn pri" id="bPr">🖨️ Imprimir</button>` }) + '<div id="rgOut"></div>';
    const calc = s => reporteGrado(s, st);
    const s = { g: st.g, s: st.s, o: st.o };
    const R = calc(s);
    $('#rgOut', el).innerHTML = R.n ? `<div class="kpis">
      <div class="kpi"><div class="l">Estudiantes</div><div class="v">${R.n}</div></div><div class="kpi ok"><div class="l">Con algún pago</div><div class="v">${R.conPago}</div></div>
      <div class="kpi bad"><div class="l">Sin ningún pago</div><div class="v">${R.n - R.conPago}</div></div><div class="kpi"><div class="l">Total recaudado</div><div class="v">${money(R.total)}</div></div>
      <div class="kpi ok"><div class="l">Pagaron ${esc(R.vLabel)}</div><div class="v">${R.pagV}</div></div><div class="kpi bad"><div class="l">Pendientes</div><div class="v">${R.n - R.pagV}</div></div>
      <div class="kpi"><div class="l">Cumplimiento</div><div class="v">${pct(R.pagV, R.n)}</div></div></div>
      <div class="tw">${R.tabla}</div>` : '<div class="empty">No hay estudiantes en esta sección. Revise grado, sección y opción (para básica y parvularia use "(TODAS)").</div>';
    $$('select,input', el).forEach(x => x.onchange = () => { leerFiltros(el, st); st.v = $('#fV', el).value; st.m = num($('#fM', el).value); LS.set('rg', st); draw(); });
    $('#bPr', el).onclick = () => Print.show('Reporte ' + tituloSec(s), paginaGrado(R, s, st));
    $('#bLote', el).onclick = () => elegirLote(lst => Print.show('Reporte de aportes por lote', lst.map(x => paginaGrado(calc(x), x, st)).join('')));
    $('#bInd', el).onclick = () => elegirLote(lst => pdfIndividuales('Reporte de aportes', lst, x => paginaGrado(calc(x), x, st)));
  };
  draw(); return draw;
});
function reporteGrado(s, st) {
  const { pag, ests } = indicePagos(st.desde, st.hasta);
  const rbs = rubrosOn(); const vrb = rbs.find(r => r.k === st.v) || rbs.find(r => r.meses) || rbs[0];
  const mReq = num(st.m || mesesRequeridos(st.hasta));
  const lista = estDeSec(ests, s).filter(e => e.estado !== 'RETIRADO' || pag.has(e._id));
  const filas = lista.map(e => {
    const rs = pag.get(e._id) || [];
    const t = {}; rbs.forEach(rb => t[rb.k] = rs.reduce((a, r) => a + num(r['r_' + rb.k]), 0));
    const meses = r2(rs.reduce((a, r) => a + mesesAlimDe(r), 0));
    const tot = rs.reduce((a, r) => a + num(r.pago), 0);
    const ok = vrb.meses ? meses >= mReq : t[vrb.k] > 0;
    return { e, rs, t, meses, tot, ok, ult: rs.map(r => toYMD(r.fecha)).sort().pop() || '' };
  });
  const usados = rbs.filter(rb => filas.some(f => f.t[rb.k]) || rb.k === vrb.k);
  const sumR = k => filas.reduce((a, f) => a + f.t[k], 0);
  const head = ['N°', 'Nombre del estudiante', 'NIE', ...usados.map(r => r.l), ...(usados.some(r => r.meses) ? ['Meses alim.'] : []), 'TOTAL $', '# Rec.', 'N° de recibos', 'Último pago', 'Estado'];
  const conMeses = usados.some(r => r.meses);
  const tabla = `<table class="t"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${filas.map((f, i) => `<tr><td>${i + 1}</td><td>${esc(f.e.nombre)}${f.e.estado === 'RETIRADO' ? ' <span class="tag bad">RETIRADO</span>' : ''}</td><td>${esc(f.e.nie || '')}</td>${usados.map(rb => `<td class="num">${f.t[rb.k] ? money(f.t[rb.k]) : ''}</td>`).join('')}${conMeses ? `<td class="num">${f.meses || ''}</td>` : ''}<td class="num"><b>${f.tot ? money(f.tot) : ''}</b></td><td class="num">${f.rs.length || ''}</td><td style="font-size:11.5px">${esc(f.rs.map(recNum).join(', '))}</td><td>${fdate(f.ult)}</td><td><span class="tag ${f.ok ? 'ok' : 'bad'}">${f.ok ? 'PAGADO' : 'PENDIENTE'}</span></td></tr>`).join('')}</tbody>
    <tfoot><tr><td></td><td>TOTALES (${filas.filter(f => f.tot).length} con pago)</td><td></td>${usados.map(rb => `<td class="num">${money(sumR(rb.k))}</td>`).join('')}${conMeses ? `<td class="num">${filas.reduce((a, f) => a + f.meses, 0)}</td>` : ''}<td class="num">${money(filas.reduce((a, f) => a + f.tot, 0))}</td><td class="num">${filas.reduce((a, f) => a + f.rs.length, 0)}</td><td colspan="3"></td></tr></tfoot></table>`;
  return { n: filas.length, filas, usados, conMeses, tabla, total: filas.reduce((a, f) => a + f.tot, 0), conPago: filas.filter(f => f.tot).length, pagV: filas.filter(f => f.ok).length, vLabel: vrb.l + (vrb.meses ? ` (${mReq} meses)` : ''), sumR };
}
function paginaGrado(R, s, st) {
  const u = R.usados;
  const rows = R.filas.map((f, i) => `<tr><td class="c">${i + 1}</td><td>${esc(f.e.nombre)}</td><td>${esc(f.e.nie || '')}</td>${u.map(rb => `<td class="r">${f.t[rb.k] ? nfmt(f.t[rb.k]) : ''}</td>`).join('')}${R.conMeses ? `<td class="c">${f.meses || ''}</td>` : ''}<td class="r"><b>${f.tot ? nfmt(f.tot) : ''}</b></td><td style="font-size:9px">${esc(f.rs.map(recNum).join(', '))}</td><td>${fdate(f.ult)}</td><td style="color:${f.ok ? '#2e7d32' : '#c00'}"><b>${f.ok ? 'PAGADO' : 'PENDIENTE'}</b></td></tr>`);
  const foot = `<tr class="tot"><td></td><td>TOTALES</td><td></td>${u.map(rb => `<td class="r">${nfmt(R.sumR(rb.k))}</td>`).join('')}${R.conMeses ? `<td class="c">${R.filas.reduce((a, f) => a + f.meses, 0)}</td>` : ''}<td class="r">${money(R.total)}</td><td colspan="3"></td></tr>`;
  return `<div class="page land">${membrete()}<div class="ptitle">REPORTE DE APORTES POR GRADO Y SECCIÓN</div><div class="psub">${esc(tituloSec(s))} · Del ${fdate(st.desde)} al ${fdate(st.hasta)}</div>
    <div class="pkpi"><div><small>Estudiantes</small><b>${R.n}</b></div><div><small>Con algún pago</small><b>${R.conPago}</b></div><div><small>Sin pago</small><b>${R.n - R.conPago}</b></div><div><small>Recaudado</small><b>${money(R.total)}</b></div><div><small>Pagaron ${esc(R.vLabel)}</small><b>${R.pagV}</b></div><div><small>Cumplimiento</small><b>${pct(R.pagV, R.n)}</b></div></div>
    ${ptable(['N°', 'Nombre del estudiante', 'NIE', ...u.map(r => r.l), ...(R.conMeses ? ['Meses'] : []), 'TOTAL $', 'N° recibos', 'Último pago', 'Estado'], rows, { foot })}
    ${firmasDoc('grado')}</div>`;
}

/** Selector de lote de secciones (todas / por nivel / marcadas) */
function elegirLote(cb, opts = {}) {
  const secs = seccionesDe(); const marc = new Set(LS.get('loteMarcadas', []));
  const niveles = [...new Set(CFG.grados.map(g => g.nivel))];
  modal('Elegir secciones para imprimir', `<div class="chips" style="margin-bottom:10px"><span class="chip" data-n="*">Todas</span>${niveles.map(n => `<span class="chip" data-n="${esc(n)}">${esc(n)}</span>`).join('')}<span class="chip" data-n="-">Quitar todas</span></div>
    ${opts.soloPagos ? `<label class="chk" style="margin-bottom:8px"><input type="checkbox" id="lSP" checked> Incluir solo secciones con pagos del rubro</label>` : ''}

async function generarLote(titulo, filas, htmlDe, send, sub, body) {
  const css = Array.from(document.querySelectorAll('style')).map(x => x.textContent).join('\n');
  const stamp = new Date().toISOString().slice(0, 16).replace('T', ' ').replace(':', '');
  const t = toast(`Generando PDF 0 de ${filas.length}…`, '', 600000);
  let folderId = '', folderUrl = '', files = [];
  try {
    for (let i = 0; i < filas.length; i += 4) {
      const items = filas.slice(i, i + 4).map(f => { const p = Store.get('personal', f.pid); const sec = tituloSec(f.x); const doc = p ? p.nombre : ''; const rep = s => String(s).replace(/\{seccion\}/g, sec).replace(/\{docente\}/g, doc || 'docente');
        return { name: `${sec}${doc ? ' - ' + doc : ''} - ${titulo}`, html: htmlDe(f.x), email: send && p ? p.email || '' : '', subject: rep(sub || ''), body: rep(body || '') }; });
      const r = await Sync.call({ action: 'pdfBatch', year: Store.year, folderId, folderName: `${titulo} ${stamp}`, css, items, send, sender: CFG.inst.area || 'Suministros' });
      folderId = r.folderId; folderUrl = r.folderUrl; files = files.concat(r.files);
      t.innerHTML = `Generando PDF ${files.length} de ${filas.length}…`;
    }
    t.innerHTML = 'Comprimiendo en .zip…';
    const z = await Sync.call({ action: 'pdfZip', folderId, name: titulo });
    t.remove();
    const env = files.filter(f => f.sent).length, err = files.filter(f => f.error);
    modal('PDF individuales listos ✔', `<div class="alert ok">${files.length} PDF creado(s)${send ? ` · ${env} enviado(s) por correo` : ''}.</div>${err.length ? `<div class="alert bad">No se pudieron enviar: ${err.map(f => esc(f.name) + ' (' + esc(f.error) + ')').join('<br>')}</div>` : ''}
      <div class="bar"><a class="btn pri" href="${z.download}" target="_blank">⬇️ Descargar todos (.zip)</a><a class="btn" href="${folderUrl}" target="_blank">📁 Abrir carpeta en Drive</a></div>
      <div class="tw" style="max-height:340px"><table class="t"><tbody>${files.map(f => `<tr><td>📄 <a href="${f.url}" target="_blank">${esc(f.name)}</a></td><td>${f.sent ? '<span class="tag ok">✉️ enviado</span>' : ''}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:12px">Cada enlace se puede compartir desde Drive. Límite de Google: unos 100 correos por día en cuentas gratuitas.</p>`, [{ l: 'Cerrar', pri: 1 }]);
  } catch (e) {
    t.remove();
    toast('No se pudieron generar los PDF: ' + esc((e && (e.msg || e.error)) || e) + (files.length ? ` (${files.length} ya creados en Drive)` : ''), 'bad', 9000);
  }
}

/* ---------- REPORTE POR RUBRO (pagaron / pendientes + lotes) ---------- */
function calcRubro(s, rk, ix) {
  const pag = [], pen = [], notas = [], retir = [];
  let n = 0;
  estDeSec(ix.ests, s).forEach(e => {
    n++;
    const rs = (ix.pag.get(e._id) || []).filter(r => num(r['r_' + rk]));
    const monto = rs.reduce((a, r) => a + num(r['r_' + rk]), 0);
    const nie = e.nie || 'Sin NIE';
    if (monto > 0) { pag.push({ n, e, nie, monto, recs: [...new Set(rs.map(recNum))].join(', '), ult: rs.map(r => toYMD(r.fecha)).sort().pop() }); if (!e.nie) notas.push(`${e.nombre} no tiene NIE registrado.`); if (e.estado === 'RETIRADO') notas.push(`${e.nombre} aparece como RETIRADO, pero tiene pago registrado.`); }
    else if (e.estado === 'RETIRADO') retir.push(e.nombre);
    else { pen.push({ n, e, nie }); if (!e.nie) notas.push(`${e.nombre} no tiene NIE registrado.`); }
  });
  if (pag.length >= 3) {
    const cnt = {}; let moda = 0, mx = 0; pag.forEach(p => { const k = p.monto.toFixed(2); cnt[k] = (cnt[k] || 0) + 1; if (cnt[k] > mx) { mx = cnt[k]; moda = p.monto; } });
    const dif = pag.filter(p => Math.abs(p.monto - moda) > 0.004);
    if (dif.length && dif.length <= Math.max(1, Math.floor(pag.length / 5))) dif.forEach(p => notas.push(`${p.e.nombre} registra ${money(p.monto)} (distinto a los ${money(moda)} que pagó la mayoría). Verificar.`));
  }
  if (retir.length) notas.push('Retirados sin pago de este rubro (no cuentan como pendientes): ' + retir.join('; ') + '.');
  return { s, titulo: tituloSec(s), est: pag.length + pen.length, pag, pen, notas, monto: pag.reduce((a, p) => a + p.monto, 0) };
}

function paginaCobroGrado(rb, s, ix, o) {
  const valor = num(o.valor), np = Math.max(1, Math.min(4, num(o.pagos) || 3)); let n = 0, porCobrar = 0, completos = 0;
  const ests = estDeSec(ix.ests, s).filter(e => e.estado !== 'RETIRADO');
  const rows = ests.map(e => {
    const pagado = r2((ix.pag.get(e._id) || []).reduce((a, r) => a + num(r['r_' + rb.k]), 0));
    const debe = valor ? Math.max(0, r2(valor - pagado)) : 0; if (valor && !debe) completos++; porCobrar += debe;
    const dtxt = !valor ? (pagado ? `<span style="color:#38761d">pagó ${money(pagado)}</span>` : '') : debe ? `${pagado ? `<span style="font-size:8.5px;color:#666">abonó ${money(pagado)} · </span>` : ''}${money(debe)}` : '<span style="color:#38761d">✔ pagado</span>';
    return `<tr><td class="c">${++n}</td><td>${esc(e.nombre)}</td><td class="r">${dtxt}</td>${'<td></td><td></td>'.repeat(np)}<td></td></tr>`;
  });

  const foot = `<tr class="tot"><td colspan="2">TOTALES</td><td class="r">${valor ? money(porCobrar) : ''}</td>${'<td></td><td></td>'.repeat(np)}<td></td></tr>`;

    <div class="pkpi"><div><small>Estudiantes</small><b>${ests.length}</b></div>${valor ? `<div><small>Ya pagaron completo</small><b>${completos}</b></div><div><small>Por cobrar</small><b>${money(porCobrar)}</b></div>` : ''}</div>
    <table class="pt">${head}<tbody>${rows.join('')}${foot}</tbody></table>

    ${firmas([[o.docente || '', 'Docente / presidente de grado'], ['', 'Encargado de Suministros']])}</div>`;

function constanciaHtml(e, o) {

  const tot = rs.reduce((a, r) => a + num(r.pago), 0); const falta = r2(Math.max(0, o.meses - meses));

    <tr><td><b>Estado:</b></td><td>${esc(e.estado || '')}</td><td><b>Último pago:</b></td><td>${fdate(rs.length ? rs[rs.length - 1].fecha : '') || '—'}</td></tr></table>
    <p class="ptxt">La Tesorería del ${esc(CFG.inst.organismo)} del ${esc(CFG.inst.nombre)} hace constar que el/la estudiante arriba mencionado(a) registra los pagos que se detallan en el anexo, con un total de <b>${money(tot)}</b>, de los cuales <b>${meses}</b> mes(es) corresponden a alimentos (${money(alim)}).</p>
    <div style="border:2px solid ${solv ? '#2e7d32' : '#c62828'};color:${solv ? '#2e7d32' : '#c62828'};padding:8px;text-align:center;font-weight:700;font-size:14px;margin:10px 0">${solv ? `✔ SOLVENTE — ${nfmt(meses)} de ${o.meses} mes(es) de alimentos cancelados` : `✘ NO SOLVENTE — pendiente(s) ${nfmt(falta)} mes(es): ${money(falta * o.cuota)}`}</div>
    <table style="font-size:11.5px;margin:-2px 0 10px;width:100%"><tr><td style="width:50%"><b>Meses de alimentos del año:</b> ${mesesCobro().length} (${esc(listaMeses(mesesCobro()))}) · cuota ${money(o.cuota)}</td><td><b>Pagados:</b> ${nfmt(meses)} de ${o.meses}${dm.cub.length ? ` — cubre ${esc(listaMeses(dm.cub))}` : ''}${dm.extra ? ` (+${nfmt(dm.extra)} adelantado)` : ''}</td></tr>
    ${pend.length ? `<tr><td colspan="2" style="color:#c62828"><b>Meses pendientes:</b> ${esc(listaMeses(pend))}</td></tr>` : ''}</table>
    <p class="ptxt">Y para los usos que estime conveniente, se extiende la presente en ${esc(CFG.inst.lugar)}, ${flong(o.fecha)}.</p>

/* ---------- INGRESOS Y CUADRE ---------- */
function totalesIngreso(desde, hasta) {
  const inR = (r, k = 'fecha') => { const f = toYMD(r[k]); return (!desde || f >= desde) && (!hasta || f <= hasta); };
  const v = Store.all('recibos').filter(r => !isTrue(r.nulo) && inR(r));
  const rb = {}; rubrosOn().forEach(x => rb[x.k] = v.reduce((a, r) => a + num(r['r_' + x.k]), 0));
  const pago = v.reduce((a, r) => a + num(r.pago), 0), suma = Object.values(rb).reduce((a, b) => a + b, 0);
  const enBanco = rubrosOn().filter(x => x.banco).reduce((a, x) => a + rb[x.k], 0);
  const efectivo = suma - enBanco;
  const don = Store.all('donaciones').filter(r => inR(r)).reduce((a, r) => a + num(r.cantidad), 0);

const MESES_CAP = MESES.map(cap);
function estadoCuentaArr() {
  const y = Store.year, hoy = dobj(today());
  const ultimo = y < hoy.getFullYear() ? 12 : y > hoy.getFullYear() ? 0 : hoy.getMonth() + 1;
  const pagos = Store.all('cafetines');
  const out = {};
  Store.all('arrendatarios').forEach(a => {
    const ini = dobj(a.inicio), fin = dobj(a.fin);
    let desde = 1, hasta = ultimo;
    if (ini) { if (ini.getFullYear() > y) desde = 13; else if (ini.getFullYear() === y) desde = ini.getMonth() + 1; }
    if (fin) { if (fin.getFullYear() < y) hasta = 0; else if (fin.getFullYear() === y) hasta = Math.min(hasta, fin.getMonth() + 1); }
    if (a.estado === 'INACTIVO' && !a.fin) hasta = 0;
    const meses = Array(12).fill(0); let pag = 0; const lista = [];
    pagos.forEach(pg => {
      if (!(pg.arr_id === a._id || (!pg.arr_id && norm(pg.nombre) === norm(a.nombre)))) return;
      let m = MESES.indexOf(norm(pg.mes)); if (m < 0) { const d = dobj(pg.fecha); m = d ? d.getMonth() : -1; }
      if (m >= 0) meses[m] += num(pg.cantidad);
      pag += num(pg.cantidad); lista.push(pg);
    });
    const due = Math.max(0, hasta - desde + 1);
    const esp = r2(due * num(a.cuota));
    const pend = []; for (let m = desde; m <= hasta; m++) if (meses[m - 1] + 0.004 < num(a.cuota)) pend.push(m);
    out[a._id] = { a, meses, desde, hasta, esp, pag: r2(pag), saldo: r2(esp - pag), pend, lista: lista.sort((x, z) => String(x.fecha).localeCompare(z.fecha)) };
  });
  return out;
}

/** Informe impreso del estado de cuenta: resumen, cuadro por meses y detalle de cada arrendatario */
function estadoArrImpreso(filas, cat) {
  const T = k => r2(filas.reduce((s, x) => s + num(x[k]), 0));
  const alDia = filas.filter(x => x.saldo <= 0.004).length, conSaldo = filas.length - alDia;
  const pctCob = T('esp') ? Math.min(100, T('pag') / T('esp') * 100) : 100;
  const estMes = (x, m) => { const v = x.meses[m - 1], c = num(x.a.cuota), due = m >= x.desde && m <= x.hasta; return !due && !v ? 'no' : v + 0.004 >= c && v ? 'ok' : v ? 'abono' : 'pend'; };
  const mark = { ok: '<b style="color:#2e7d32">✔</b>', abono: '<b style="color:#b26a00">◐</b>', pend: '<b style="color:#c00">✘</b>', no: '' };
  const cuadro = ptable(['Arrendatario', 'Categoría', 'Cuota', ...MESES_CAP.map(m => m.slice(0, 3)), 'Esperado', 'Pagado', 'Saldo'], filas.map(x => `<tr><td>${esc(x.a.nombre)}${x.a.espacio ? '<br><small>' + esc(x.a.espacio) + '</small>' : ''}</td><td>${esc(x.a.categoria || '')}</td><td class="r">${money(x.a.cuota)}</td>${Array.from({ length: 12 }, (_, i) => { const m = i + 1, v = x.meses[i], e = estMes(x, m); return `<td class="c" style="${e === 'pend' ? 'background:#fdecea' : e === 'abono' ? 'background:#fff4e0' : ''}">${v ? nfmt(v) : mark[e]}</td>`; }).join('')}<td class="r">${money(x.esp)}</td><td class="r">${money(x.pag)}</td><td class="r"><b style="color:${x.saldo > 0.004 ? '#c00' : '#2e7d32'}">${money(x.saldo)}</b></td></tr>`).concat([`<tr class="tot"><td colspan="15">TOTAL</td><td class="r">${money(T('esp'))}</td><td class="r">${money(T('pag'))}</td><td class="r">${money(T('saldo'))}</td></tr>`]));
  const ordMes = pg => { const m = MESES.indexOf(norm(pg.mes)); return m < 0 ? 99 : m; };
  const detalle = x => {
    const a = x.a, c = num(a.cuota), ult = x.lista.length ? x.lista[x.lista.length - 1] : null;
    const mesesDue = []; for (let m = x.desde; m <= x.hasta; m++) mesesDue.push(m);
    let acum = 0;
    const filasMes = mesesDue.map(m => { const v = r2(x.meses[m - 1]), sal = r2(Math.max(0, c - v)); acum = r2(acum + sal); const e = estMes(x, m); return `<tr style="${e === 'pend' ? 'background:#fdecea' : e === 'abono' ? 'background:#fff4e0' : ''}"><td>${MESES_CAP[m - 1]}</td><td class="r">${money(c)}</td><td class="r">${v ? money(v) : '—'}</td><td class="r">${sal ? money(sal) : '—'}</td><td class="r">${money(acum)}</td><td class="c">${{ ok: 'Pagado', abono: 'Abono parcial', pend: 'Pendiente' }[e] || ''}</td></tr>`; });
    const pagosFuera = x.meses.reduce((s, v, i) => s + (i + 1 < x.desde || i + 1 > x.hasta ? v : 0), 0);
    const pagos = x.lista.slice().sort((p, q) => ordMes(p) - ordMes(q) || String(p.fecha).localeCompare(q.fecha));
    return `<div class="arr-det" style="margin-top:16px;border:1px solid #9bc2e6;border-radius:4px;padding:8px 10px">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #9bc2e6;padding-bottom:5px;margin-bottom:6px">
        <div><b style="font-size:13px">${esc(a.nombre)}</b> · ${esc(a.categoria || '')}${a.espacio ? ' · ' + esc(a.espacio) : ''} · <b style="color:${a.estado === 'INACTIVO' ? '#c00' : '#2e7d32'}">${esc(a.estado || 'ACTIVO')}</b></div>
        <div style="font-size:10.5px">Cuota mensual <b>${money(c)}</b>${a.dia_pago ? ` · pagar antes del día <b>${esc(a.dia_pago)}</b>` : ''}${a.forma ? ' · ' + esc(a.forma) : ''}</div></div>
      <table style="width:100%;font-size:10.5px;margin-bottom:6px"><tr><td><b>Contrato:</b> ${a.inicio ? fdate(a.inicio) : '—'} al ${a.fin ? fdate(a.fin) : 'indefinido'}</td><td><b>DUI:</b> ${esc(a.dui || '—')}</td><td><b>Teléfono:</b> ${esc(a.telefono || '—')}</td><td><b>Último pago:</b> ${ult ? fdate(ult.fecha) + (ult.mes ? ' (' + esc(ult.mes) + ')' : '') : '—'}</td></tr>
        <tr><td><b>Meses a cobrar en ${Store.year}:</b> ${mesesDue.length ? `${MESES[x.desde - 1]} a ${MESES[x.hasta - 1]} (${mesesDue.length})` : 'ninguno'}</td><td><b>Esperado:</b> ${money(x.esp)}</td><td><b>Pagado:</b> ${money(x.pag)}</td><td><b>Saldo:</b> <b style="color:${x.saldo > 0.004 ? '#c00' : '#2e7d32'}">${money(x.saldo)}</b></td></tr></table>
      ${x.pend.length ? `<div style="background:#fdecea;border-left:4px solid #c00;padding:4px 8px;font-size:11px;margin-bottom:6px"><b>Meses pendientes (${x.pend.length}):</b> ${esc(listaMeses(x.pend))} · <b>${money(x.saldo)}</b></div>` : `<div style="background:#e8f5e9;border-left:4px solid #2e7d32;padding:4px 8px;font-size:11px;margin-bottom:6px"><b>✔ Al día</b> con sus pagos${x.saldo < -0.004 ? ` · pagado por adelantado ${money(-x.saldo)}` : ''}.</div>`}
      <div style="display:flex;gap:14px;align-items:flex-start">
        <div style="flex:1">${ptable(['Mes', 'Cuota', 'Pagado', 'Saldo del mes', 'Saldo acumulado', 'Estado'], filasMes.length ? filasMes : ['<tr><td colspan="6" class="c">Sin meses a cobrar</td></tr>'])}${pagosFuera ? `<div style="font-size:10px;margin-top:3px">Incluye ${money(pagosFuera)} pagados por meses fuera del periodo a cobrar (adelantos).</div>` : ''}</div>
        <div style="flex:1.25">${ptable(['Mes que cancela', 'Fecha recibido', 'Fecha en banco', 'Recibo', 'Comprobante', 'Cantidad'], (pagos.length ? pagos.map(pg => `<tr><td>${esc(pg.mes || '')}</td><td class="c">${fdate(pg.fecha)}</td><td class="c">${fdate(pg.fecha_banco)}</td><td class="c">${esc(pg.recibo || '')}</td><td class="c">${esc(pg.comprobante || '')}</td><td class="r">${money(pg.cantidad)}</td></tr>${pg.obs ? `<tr><td colspan="6" style="font-size:9.5px;color:#555">↳ ${esc(pg.obs)}</td></tr>` : ''}`) : ['<tr><td colspan="6" class="c">Sin pagos registrados</td></tr>']).concat([`<tr class="tot"><td colspan="5">TOTAL PAGADO (${pagos.length} pago(s))</td><td class="r">${money(x.pag)}</td></tr>`]))}</div></div>
      ${a.notas ? `<div style="font-size:10.5px;margin-top:5px"><b>Acuerdos / notas:</b> ${esc(a.notas)}</div>` : ''}</div>`;
  };
  return `<div class="page land">${membrete()}<div class="ptitle">ESTADO DE CUENTA DE ARRENDATARIOS ${Store.year}${cat ? ' · ' + esc(cat).toUpperCase() : ''}${filas.length === 1 ? ' · ' + esc(String(filas[0].a.nombre).toUpperCase()) : ''}</div><div class="psub">Al ${flong(today())}</div>
    <div class="pkpi"><div><small>Arrendatarios</small><b>${filas.length}</b></div><div><small>Al día</small><b style="color:#2e7d32">${alDia}</b></div><div><small>Con saldo</small><b style="color:#c00">${conSaldo}</b></div><div><small>Esperado a la fecha</small><b>${money(T('esp'))}</b></div><div><small>Pagado</small><b>${money(T('pag'))}</b></div><div><small>Saldo pendiente</small><b style="color:#c00">${money(T('saldo'))}</b></div><div><small>% cobrado</small><b>${pctCob.toFixed(0)}%</b></div></div>
    <b style="font-size:12px">1. RESUMEN POR MES</b>${cuadro}
    <div style="font-size:10px;margin-top:3px">Montos = pagado en ese mes · ✘ pendiente · ◐ abono parcial · celda vacía = mes fuera del contrato o aún no vence. Se cobra desde el inicio del contrato hasta el mes actual (o el fin del contrato).</div>
    <div style="margin-top:14px"><b style="font-size:12px">2. DETALLE POR ARRENDATARIO</b></div>
    ${filas.map(detalle).join('')}
    ${firmasDoc('arrend')}</div>`;
}

  const kp = arr => `<div class="pkpi" style="flex-wrap:wrap">${arr.map(([l, v]) => `<div style="min-width:23%"><small>${l}</small><b>${v}</b></div>`).join('')}</div>`;

    ingresos_rubro: () => { const xs = rbs.map(x => [x.l, T.rb[x.k] || 0]).filter(x => x[1]).sort((a, b) => b[1] - a[1]); if (!xs.length) return ''; const mx = xs[0][1];
      return ptable(['Concepto', 'Monto', '%', ...(c.graficos ? [{ l: '', w: '30%' }] : [])], xs.map(([l, v]) => `<tr><td>${esc(l)}</td><td class="r">${money(v)}</td><td class="r">${pct(v, T.suma)}</td>${c.graficos ? `<td>${barra(v, mx)}</td>` : ''}</tr>`).concat([`<tr class="tot"><td>TOTAL</td><td class="r">${money(T.suma)}</td><td class="r">100%</td>${c.graficos ? '<td></td>' : ''}</tr>`]))
        + (T.enBanco ? nota(`Incluye ${money(T.enBanco)} de rubros que se pagan directamente en banco.`) : ''); },

    ingresos_nivel: () => { const xs = Object.entries(T.niv).sort((a, b) => b[1] - a[1]); if (!xs.length) return ''; const mx = xs[0][1];

    alimentos: () => { const ix = indicePagos(de, ha); const ests = ix.ests.filter(e => !/RETIRADO|INACTIVO/i.test(e.estado || '')); if (!ests.length) return ''; const req = mesesRequeridos(ha || today());
      let solv = 0, meses = 0, alim = 0; ests.forEach(e => { const rs = ix.pag.get(e._id) || []; const m = rs.reduce((a, r) => a + mesesAlimDe(r), 0); meses += m; alim += rs.reduce((a, r) => a + num(r.r_alimentos), 0); if (m + 0.001 >= req) solv++; });

/** Personas que pagan: estudiantes de la base + nombres de recibos que no están en la base */
function personasPago() {
  const ix = indicePagos(), out = [], vistos = new Set();
  ix.ests.forEach(e => { out.push({ k: e._id, nombre: e.nombre, est: e, recs: ix.pag.get(e._id) || [] }); vistos.add(norm(e.nombre)); });
  const otros = new Map();
  ix.sinBD.forEach(r => { const n = norm(r.nombre); if (!n || vistos.has(n)) return; (otros.get(n) || otros.set(n, { k: 'n:' + n, nombre: r.nombre, est: null, recs: [] }).get(n)).recs.push(r); });
  otros.forEach(x => out.push(x));
  return out;
}
function recibosDePersona(p) {
  const n = norm(p.nombre), nie = p.est && p.est.nie ? String(p.est.nie) : '';
  return Store.all('recibos').filter(r => (p.est && r.est_id === p.est._id) || (nie && String(r.nie || '') === nie) || norm(r.nombre) === n);
}
function estadoAlimentos(recs) {
  const val = recs.filter(r => !isTrue(r.nulo));
  const meses = r2(val.reduce((a, r) => a + mesesAlimDe(r), 0)), req = mesesRequeridos(today()), falta = r2(Math.max(0, req - meses));
  return { meses, req, falta, monto: r2(falta * num(CFG.alimentos.cuota)), dm: detalleMeses(meses), solv: falta < 0.001 };
}

  let res = [], idx = 0, sel = null, rec = null, terms = [];
  const buscar = () => {
    const t = q.value.trim(); X.hidden = !t; terms = norm(t).split(' ').filter(Boolean); sel = null; rec = null; idx = 0;
    if (t.length < 2 && !/^\d+$/.test(t)) { res = []; R.innerHTML = ''; H.textContent = 'Escriba al menos 2 letras. Use ↑ ↓ y Enter para elegir · Esc para limpiar.'; return; }
    const mr = t.match(/^([a-z])?\s*-?\s*(\d{1,7})$/i);
    const P = personasPago(); res = [];
    if (mr) {
      const ser = mr[1] ? mr[1].toUpperCase() : '', n = num(mr[2]);
      Store.all('recibos').filter(r => num(r.numero) === n && (!ser || String(r.serie || '').toUpperCase() === ser)).forEach(r => {
        const pe = P.find(x => (x.est && (r.est_id === x.est._id || (x.est.nie && String(r.nie || '') === String(x.est.nie)))) || norm(x.nombre) === norm(r.nombre)) || { k: 'n:' + norm(r.nombre), nombre: r.nombre || '(sin nombre)', est: null };
        res.push({ p: pe, rec: r });
      });
      P.filter(x => x.est && x.est.nie && String(x.est.nie).startsWith(mr[2])).slice(0, 8).forEach(x => res.push({ p: x }));
    } else {
      P.forEach(x => { const h = norm(x.nombre) + ' ' + (x.est ? String(x.est.nie || '') : ''); if (terms.every(w => h.includes(w))) res.push({ p: x, sc: (norm(x.nombre).startsWith(terms[0]) ? 0 : 1) + (x.est ? 0 : 0.5) }); });
      res.sort((a, b) => a.sc - b.sc || String(a.p.nombre).localeCompare(b.p.nombre, 'es'));
    }
    pintar();
  };
  const pintar = () => {
    if (!res.length) { R.innerHTML = '<div class="empty" style="padding:18px">Sin resultados.</div>'; H.textContent = ''; return; }
    if (res.length === 1 || sel) { const x = sel || res[0]; H.innerHTML = res.length > 1 ? `<a href="#" id="bA_b">← volver a los ${res.length} resultados</a>` : (x.rec ? `Recibo ${esc(recNum(x.rec))} · ` : '') + '1 resultado'; R.innerHTML = fichaHtml(x.p, { terms, rec: x.rec && x.rec._id }); bindFicha(R, x.p, () => { const v = q.value; buscar(); if (x !== res[0]) { sel = res.find(y => y.p.k === x.p.k) || null; pintar(); } q.value = v; });
      const bb = $('#bA_b', H); if (bb) bb.onclick = ev => { ev.preventDefault(); sel = null; pintar(); }; return; }
    H.textContent = `${res.length} resultado(s)${res.length > 30 ? ' · se muestran los primeros 30, escriba más para afinar' : ''}`;
    R.innerHTML = `<div class="resl">${res.slice(0, 30).map((x, i) => { const A = estadoAlimentos(recibosDePersona(x.p)); const e = x.p.est;
      return `<div class="ri ${i === idx ? 'on' : ''}" data-i="${i}"><div style="flex:1"><b>${marcar(x.p.nombre, terms)}</b>${x.rec ? ` <span class="tag">Recibo ${esc(recNum(x.rec))} · ${fdate(x.rec.fecha)} · ${money(x.rec.pago)}</span>` : ''}<br><small>${esc(e ? [e.grado, e.seccion, e.opcion].filter(Boolean).join(' · ') : 'no está en la base')}</small></div>
        <div style="text-align:right;font-size:12.5px">${A.solv ? '<span class="ok-t">✔ solvente</span>' : `<span class="bad-t">debe ${nfmt(A.falta)} mes(es)</span>`}<br><small>${nfmt(A.meses)}/${A.req} alimentos</small></div></div>`; }).join('')}</div>`;
    $$('.ri', R).forEach(d => d.onclick = () => { sel = res[num(d.dataset.i)]; pintar(); });
  };
  q.addEventListener('input', debounce(buscar, 160));
  q.addEventListener('keydown', ev => {
    if (!res.length || sel || res.length === 1) { if (ev.key === 'Escape') { q.value = ''; buscar(); } return; }
    if (ev.key === 'ArrowDown') { ev.preventDefault(); idx = Math.min(idx + 1, Math.min(res.length, 30) - 1); pintar(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); idx = Math.max(idx - 1, 0); pintar(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); sel = res[idx]; pintar(); }
    else if (ev.key === 'Escape') { q.value = ''; buscar(); }
  });
  return { refresh: buscar };
}
